name: Build Verification

on:
  pull_request:
    branches: [master]
    paths:
      - 'skills/**'
      - 'docs/**'
      - 'contributing/**'
      - '*.md'
  push:
    branches: [master]
    paths:
      - 'skills/**'
      - 'docs/**'
      - 'contributing/**'
      - '*.md'

# Companion to build.yml: build.yml has matching paths-ignore so it does not
# run for docs-only changes. Branch protection still requires the "Release
# Build" and "Cross-compile (...)" checks, so this workflow runs no-op jobs
# with the same names to satisfy them.

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - run: echo "No-op: docs-only change, build not required."

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - run: echo "No-op: docs-only change, cross-compile not required."
