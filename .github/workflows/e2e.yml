name: E2E (writable test team)

# Runs the full e2e suite (read + write) against the dedicated writable
# Coralogix test team on every pull request and on every push to master.
#
# Parallel safety: PRs run concurrently against the same team. Every write
# test names its resources `cx-e2e-<kind>-<stamp>-<run id>-<seq>` and deletes
# them on exit, so runs never share state. The sweeper step removes leftovers
# from crashed runs older than two hours. See contributing/development.md
# § "E2E tests".

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# One run per ref; a newer push to the same PR cancels the older run. Different
# PRs run in parallel on purpose - the suite is designed for it.
concurrency:
  group: e2e-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: E2E against writable test team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are not available to pull requests from forks; skip instead of
    # failing them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'assets/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - '.github/workflows/e2e.yml'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          key: e2e-ubuntu

      - name: Install Linux system dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build e2e test binary
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: cargo test --locked --test e2e --no-run

      - name: Sweep stale resources from crashed runs
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        env:
          CX_API_KEY: ${{ secrets.CX_E2E_API_KEY }}
          CX_REGION: eu2
          CX_E2E_ALLOW_WRITES: "1"
          CX_E2E_RUN_ID: ${{ github.run_id }}${{ github.run_attempt }}
        run: cargo test --locked --test e2e sweep_stale_e2e_resources -- --ignored --exact sweeper::sweep_stale_e2e_resources

      - name: Run e2e suite
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        env:
          CX_API_KEY: ${{ secrets.CX_E2E_API_KEY }}
          CX_REGION: eu2
          CX_E2E_ALLOW_WRITES: "1"
          CX_E2E_RUN_ID: ${{ github.run_id }}${{ github.run_attempt }}
          CX_E2E_SKIP_OLLY: ${{ vars.CX_E2E_SKIP_OLLY || '' }}
        # Tests are independent (unique names, own cleanup), so they run in
        # parallel. The sweeper is excluded here because it already ran.
        run: cargo test --locked --test e2e -- --ignored --test-threads=4 --skip sweep_stale_e2e_resources
