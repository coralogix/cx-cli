name: Lint

on:
  pull_request:
    branches: [master]
    paths:
      - 'skills/**'
      - 'docs/**'
      - 'contributing/**'
      - '*.md'

# Companion to lint.yml: lint.yml has matching paths-ignore so it does not run
# for docs-only PRs. Branch protection still requires the "Format & Clippy"
# check, so this workflow runs a no-op job with the same name to satisfy it.

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - run: echo "No-op: docs-only change, lint not required."
