# Automated PR review with the repo's /pr-review skill (.claude/skills/pr-review).
#
# Runs on every same-repo, non-draft PR: when it is opened, reopened, leaves draft,
# or gets a push. The skill reads the PR, checks the file footprint, reads the code,
# and reads CI results (incl. the E2E check). It does not build or run the binary
# here (--no-drive), so no Rust toolchain and no Coralogix credentials are needed.
# The last step fails the job when the review posted for this exact commit says
# BLOCK; that is the status check to require in the ruleset later.
#
# No issue_comment trigger on purpose: checking out PR code in a comment-triggered
# (privileged) workflow is a CodeQL high-severity pattern. Re-runs happen on push.
name: PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  review:
    # Same-repo PRs only: forks get no secrets.
    if: |
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    # Job-level, so a cancelled run is always an older review of the same PR.
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the pr-review skill
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: ""
          allowed_non_write_users: ""
          show_full_output: true
          claude_args: |
            --max-turns 60
            --disallowedTools WebFetch,WebSearch
            --allowedTools "Read,Glob,Grep,Write,mcp__github_inline_comment__create_inline_comment,Bash(mkdir:*),Bash(grep:*),Bash(git fetch:*),Bash(git diff:*),Bash(git show:*),Bash(git grep:*),Bash(git log:*),Bash(git merge-base:*),Bash(git cat-file:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh run view:*),Bash(.github/scripts/pr-footprint.sh:*),Bash(jq:*)"
          prompt: |
            Run the /pr-review skill in .claude/skills/pr-review/SKILL.md
            for PR #${{ github.event.pull_request.number }} with --no-drive --comment.
            Post the full report as one PR comment with `gh pr comment`, and each
            BLOCKER or FIX SOON as an inline comment. Put this line directly after
            the Verdict line of the report, exactly:
            **Commit:** `${{ github.event.pull_request.head.sha }}`
            Do not edit files. Do not commit.

      - name: Fail the job on BLOCK
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only the workflow's own comment, only for this commit: a comment by
          # anyone else, or a report for an older push, never passes the gate.
          body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"# PR Review:\")) and (.body | contains(\"$SHA\")))] | last | .body // \"\"")"
          if [ -z "$body" ]; then
            echo "::error::No review was posted for commit $SHA. Read the skill step log."
            exit 1
          fi
          if printf '%s' "$body" | grep -q 'Verdict: 🔴 BLOCK'; then
            echo "::error::The review verdict is BLOCK. Read the PR comment."
            exit 1
          fi
          echo "Review verdict is PASS for $SHA."
