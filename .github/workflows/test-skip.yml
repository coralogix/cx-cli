name: Test

on:
  pull_request:
    branches: [master]
    paths:
      - 'skills/**'
      - 'docs/**'
      - 'contributing/**'
      - '*.md'
  push:
    branches: [master]
    paths:
      - 'skills/**'
      - 'docs/**'
      - 'contributing/**'
      - '*.md'

# Companion to test.yml: test.yml has matching paths-ignore so it does not
# run for docs-only changes. Branch protection still requires the
# "Tests (<os>)" checks, so this workflow runs no-op jobs with the same names
# to satisfy them.

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: echo "No-op: docs-only change, tests not required."
