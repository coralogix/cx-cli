name: Test

on:
  pull_request:
    branches: [master]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.filter.outputs.code == 'true'

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        if: steps.filter.outputs.code == 'true'
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.filter.outputs.code == 'true'
        with:
          key: ${{ matrix.os }}

      - name: Install Linux system dependencies
        if: steps.filter.outputs.code == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run tests
        if: steps.filter.outputs.code == 'true'
        run: cargo test --locked

  # The CLI's events against the collector config in this PR: a change that
  # adds an event or a value without updating the config fails here.
  # See contributing/telemetry-design-draft.md § 5.2.
  telemetry-contract:
    name: Telemetry contract
    runs-on: ubuntu-latest
    # pull-requests: read is for paths-filter, which lists the PR's files.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'scripts/telemetry-collector*/**'
              - 'scripts/telemetry-collector-check.sh'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.filter.outputs.code == 'true'
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        if: steps.filter.outputs.code == 'true'
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.filter.outputs.code == 'true'
        with:
          key: ubuntu-latest

      - name: Install Linux system dependencies
        if: steps.filter.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      # A debug build: the script reads events through CX_TELEMETRY=log.
      - name: Check CLI events against the collector config
        if: steps.filter.outputs.code == 'true'
        run: |
          cargo build --locked
          scripts/telemetry-collector-check.sh
