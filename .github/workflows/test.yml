name: Test

on:
  pull_request:
    branches: [master]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.filter.outputs.code == 'true'

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        if: steps.filter.outputs.code == 'true'
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.filter.outputs.code == 'true'
        with:
          key: ${{ matrix.os }}

      - uses: jfrog/setup-jfrog-cli@v4
        id: jfrog
        if: steps.filter.outputs.code == 'true'
        env:
          JF_URL: https://cgx.jfrog.io
        with:
          oidc-provider-name: github
          oidc-audience: jfrog-github

      - name: Inspect published cli-otel registry checksum
        if: steps.filter.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
        env:
          CARGO_REGISTRIES_CORALOGIX_INTERNAL_TOKEN: Bearer ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: ${CARGO_REGISTRIES_CORALOGIX_INTERNAL_TOKEN}" \
            https://cgx.jfrog.io/artifactory/api/cargo/internal.rust.coralogix.net/index/cl/i-/cli-otel \
            | jq -c 'select(.vers == "0.1.0") | {vers, cksum, features, features2, deps: [.deps[] | {name, req, optional, default_features, features, target, kind, registry}]}'

      - name: Install Linux system dependencies
        if: steps.filter.outputs.code == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run tests
        if: steps.filter.outputs.code == 'true'
        env:
          CARGO_REGISTRIES_CORALOGIX_INTERNAL_TOKEN: Bearer ${{ steps.jfrog.outputs.oidc-token }}
        run: cargo test --locked
