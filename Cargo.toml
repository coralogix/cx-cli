[package]
name = "cx"
version = "0.1.0"
edition = "2021"
description = "Coralogix CLI — query observability data from the command line"
repository = "https://github.com/coralogix/cx-cli"
license = "Apache-2.0"
default-run = "cx"

[[bin]]
name = "cx"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "=4.5.37", features = ["derive", "env", "color"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "query", "form", "rustls", "rustls-native-certs"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Config directory resolution
dirs = "6"

# Secure credential storage
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
inquire = "0.9"

# OAuth / PKCE
rand = "0.10.1"
sha2 = "0.11"
base64 = "0.22"
open = "5"

# Terminal output
colored = "3"
tabled = { version = "0.20", features = ["ansi"] }
indicatif = "0.18"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"

# URL building
url = "2"

# TOON format — agent-optimised, token-efficient serialisation
toon-format = { version = "0.4.5", default-features = false }

futures = "0.3.32"

[profile.release]
strip = true
lto = true
codegen-units = 1
