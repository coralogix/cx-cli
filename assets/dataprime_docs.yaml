commands:
  source:
    description: "The `source` command is a foundational component of DataPrime. It informs the\nDataPrime engine which datasource you wish to read from.\n\n\n!!! note\n    While you can start your query with this, the `source` command is optional and will default to `logs`.\n\n### Basic usage\n\nIn DataPrime, you read data by specifying a **dataset** within an optional **dataspace**:\n\n```dataprime\nsource <dataspace>/<dataset>\n```\n\nIf no dataspace is provided, the query defaults to the `default` dataspace. This allows for concise syntax when working within the most common data sources.\n\nCommon datasets include:\n\n* `logs` – Application and infrastructure logs.\n  *Default dataset. Equivalent to `source default/logs`.*\n* `spans` – Distributed tracing data from systems like OpenTelemetry.\n  *Equivalent to `source default/spans`.*\n* `enrichments/<name>` – [custom enrichment](https://coralogix.com/docs/user-guides/data-transformation/enrichments/custom-enrichment/) tables uploaded via the UI or API.\n  *For example: `source default/enrichments/ip_lookup`*\n\nYou can also query system-generated datasets such as:\n\n* `system/engine.queries` – Logs of all DataPrime query executions.\n* `system/alerts.history` – Historical records of alert events.\n\n> Dataset names may include dots (e.g., `engine.queries`) but are still treated as flat identifiers-not nested structures.\n\nThis structure supports querying across teams, environments, or pipelines-whether you’re debugging logs, analyzing performance, or auditing notifications.\n"
    syntax: "(source|from) <data_store>"
    category: [Commands reference, Sources, source]
    content: "\n# `source`\n\n## Description\n\n\nThe `source` command is a foundational component of DataPrime. It informs the\nDataPrime engine which datasource you wish to read from.\n\n\n!!! note\n    While you can start your query with this, the `source` command is optional and will default to `logs`.\n\n### Basic usage\n\nIn DataPrime, you read data by specifying a **dataset** within an optional **dataspace**:\n\n```dataprime\nsource <dataspace>/<dataset>\n```\n\nIf no dataspace is provided, the query defaults to the `default` dataspace. This allows for concise syntax when working within the most common data sources.\n\nCommon datasets include:\n\n* `logs` – Application and infrastructure logs.\n  *Default dataset. Equivalent to `source default/logs`.*\n* `spans` – Distributed tracing data from systems like OpenTelemetry.\n  *Equivalent to `source default/spans`.*\n* `enrichments/<name>` – [custom enrichment](https://coralogix.com/docs/user-guides/data-transformation/enrichments/custom-enrichment/) tables uploaded via the UI or API.\n  *For example: `source default/enrichments/ip_lookup`*\n\nYou can also query system-generated datasets such as:\n\n* `system/engine.queries` – Logs of all DataPrime query executions.\n* `system/alerts.history` – Historical records of alert events.\n\n> Dataset names may include dots (e.g., `engine.queries`) but are still treated as flat identifiers-not nested structures.\n\nThis structure supports querying across teams, environments, or pipelines-whether you’re debugging logs, analyzing performance, or auditing notifications.\n\n\n## Syntax\n\n```dataprime\n(source|from) <data_store>\n```\n\n## Example 1\n\n\nQuery logs from the **default** dataspace:\n\n\n\n### Example query\n```dataprime\nsource logs\n// or\nsource default/logs\n\n```\n\n\n## Example 2\n\n\nQuery spans from the default dataspace.\n\n\n\n### Example query\n```dataprime\nsource spans\n\n```\n\n\n## Example 3\n\n\nQuery system generated data such as `engine.query` logs/\n\n\n\n### Example query\n```dataprime\nsource system/engine.queries\n\n```\n\n\n\n"
  around:
    description: "The `around` keyword allows users to declare a timerange, defined as some interval before and after a `timestamp`, on which a query should operate.\n\n!!! note\n    The `interval`, if specified, **MUST** be positive.\n\n!!! note\n    If the `interval` is not specified, then a default value of `30m` is used."
    syntax: "source (logs|spans) around <time> [interval <interval>]"
    category: [Commands reference, Sources, Time, around]
    content: "\n# `around`\n\n## Description\n\n\nThe `around` keyword allows users to declare a timerange, defined as some interval before and after a `timestamp`, on which a query should operate.\n\n!!! note\n    The `interval`, if specified, **MUST** be positive.\n\n!!! note\n    If the `interval` is not specified, then a default value of `30m` is used.\n\n## Syntax\n\n```dataprime\nsource (logs|spans) around <time> [interval <interval>]\n```\n\n## Example\n\n\nThe `around` keyword can be used on `logs` or `spans` like so:\n\n\n\n### Example query\n```dataprime\nsource logs around @'2021-01-01T00:00:00Z' interval 1h\nsource spans around @'2021-01-01T00:00:00Z' interval 1h\n\n```\n\n\n\n"
  between:
    description: "The `between` keyword specifies a date range on which a query on `logs` or `spans` should operate.\n\n!!! note\n    The `between` keyword will work on any time expression, but the result of the expression must be of type `timestamp`."
    syntax: "source (logs|spans) between <time-expression> and <time-expression>"
    category: [Commands reference, Sources, Time, between]
    content: "\n# `between`\n\n## Description\n\n\nThe `between` keyword specifies a date range on which a query on `logs` or `spans` should operate.\n\n!!! note\n    The `between` keyword will work on any time expression, but the result of the expression must be of type `timestamp`.\n\n## Syntax\n\n```dataprime\nsource (logs|spans) between <time-expression> and <time-expression>\n```\n\n## Example 1\n\n\nThe `between` keyword allows users to scope their query to a specific timerange. The simplest example of this is to use two `timestamp` literals:\n\n\n\n### Example query\n```dataprime\nsource spans between @'2024-10-14T00:00:00Z' and @'2024-10-15T00:00:00Z'\n\n```\n\n\n## Example 2\n\n\nThe `between` timestamp works well with the `$p` JSON prefix, which contains the time range in the UI. For example, we have a dashboard that operates over the last 24 hours, but we wish to compare it to the previous 24 hours before that. We can do this, using the `between` command and some timestamp expressions:\n\n\n\n### Example query\n```dataprime\nsource logs between $p.timeRange.startTime - 48h and $p.timeRange.endTime - 24h\n\n```\n\n\n## Example 3\n\n\nUsing the `between` keyword, we can always compare a given timeframe, with relation to the current time, even if the dashboard query changes. In this query, we will always query data from the past 24 hours, no matter what the time range is set to.\n\n\n\n### Example query\n```dataprime\nsource logs between @'now' - 24h and @'now'\n\n```\n\n\n\n"
  last:
    description: "The `last` keyword specifies how far back in time a query should go, defined by a given `interval`.\n\n!!! note\n    The value of the given `interval` MUST be non-negative."
    syntax: "source (logs|spans) last <interval>"
    category: [Commands reference, Sources, Time, last]
    content: "\n# `last`\n\n## Description\n\n\nThe `last` keyword specifies how far back in time a query should go, defined by a given `interval`.\n\n!!! note\n    The value of the given `interval` MUST be non-negative.\n\n## Syntax\n\n```dataprime\nsource (logs|spans) last <interval>\n```\n\n## Example\n\n\nThe `last` keyword is simple to employ for both `logs` and `spans`.\n\n```dataprime\nsource logs last 1h\nsource spans last 1d\n```\n\nGiven the timerange in the Coralogix interface is `Last 1 Hour`, and we run the following query:\n\n```dataprime\nsource spans last 1d\n```\n\nThen the result of this query will be the `spans` from the last 1 day. **There is no relationship between the `interval` in the `last` keyword and the timerange in the Coralogix UI.**  \n\n### Try it yourself\n\nOpen up your Coralogix explore screen and paste in the following query:\n\n```dataprime\nsource logs last 1d\n```\n\n\n\n\n\n\n"
  timeshifted:
    description: "The `timeshifted` keyword modifies the timerange within the scope of the query. This is useful when, for example, a custom dashboard has a global timerange of `Today` but your query only makes sense when looking at yesterday's data."
    syntax: "source (logs|spans) timeshifted <interval>"
    category: [Commands reference, Sources, Time, timeshifted]
    content: "\n\n\n\n\n# `timeshifted`\n\n## Description\n\n\nThe `timeshifted` keyword modifies the timerange within the scope of the query. This is useful when, for example, a custom dashboard has a global timerange of `Today` but your query only makes sense when looking at yesterday's data.\n\n## Syntax\n\n```dataprime\nsource (logs|spans) timeshifted <interval>\n```\n\n## Example\n\n\nThe `timeshifted` query is simple to employ for both `logs` and `spans`.\n\n```dataprime\nsource logs timeshifted 1h\nsource spans timeshifted -1h\n```\n\nTo provide a worked example, assume the current timerange in the Coralogix interface is set to `Last 1 Hour`, and we run the following query:\n\n```dataprime\nsource spans timeshifted -1h\n```\n\nThis is going to execute the query from `now - 2h` to `now - 1h`. It has shifted the entire time window back one hour.\n\n### Try it yourself\n\nOpen up your Coralogix explore screen and paste in the following query:\n\n```dataprime\nsource logs timeshifted -1d\n```\n\n\n\n\n\n\n"
  aggregate:
    description: "The `aggregate` command performs calculations across the entire working set of\ndocuments, producing summary statistics such as totals, averages, minimums,\nmaximums, or counts. Unlike `groupby`, which splits data into multiple groups,\n`aggregate` computes results over the full dataset as a single group.\n\nMultiple aggregation functions can be combined in one command to produce a\nsingle document containing several computed values.\n\n!!! note\n    Aggregations are limited to 1000 buckets in a single operation.\n"
    syntax: "aggregate <aggregation_expression> [as <result_keypath>] [, <aggregation_expression_2> [as <result_keypath_2>], ...]\n"
    category: [Commands reference, aggregate]
    content: "\n# `aggregate`\n\n## Description\n\n\nThe `aggregate` command performs calculations across the entire working set of\ndocuments, producing summary statistics such as totals, averages, minimums,\nmaximums, or counts. Unlike `groupby`, which splits data into multiple groups,\n`aggregate` computes results over the full dataset as a single group.\n\nMultiple aggregation functions can be combined in one command to produce a\nsingle document containing several computed values.\n\n!!! note\n    Aggregations are limited to 1000 buckets in a single operation.\n\n\n## Syntax\n\n```dataprime\naggregate <aggregation_expression> [as <result_keypath>] [, <aggregation_expression_2> [as <result_keypath_2>], ...]\n\n```\n\n## Example 1\n\n\n**Use case: Compute total count and maximum duration across all traces**\n\nSuppose you have a set of trace logs and you want to compute a few overall\nstatistics, such as how many traces exist and the maximum request duration.\n\n\n### Example data\n```json\n{ \"duration\": 340 },\n{ \"duration\": 890 },\n{ \"duration\": 1567 },\n{ \"duration\": 102 }\n\n```\n\n### Example query\n```dataprime\naggregate count() as count, max($m.duration) as max_duration\n\n```\n\n### Example output\n\n| count | max_duration |\n| --- | --- |\n| 4 | 1567 |\n\nThe `aggregate` command computes metrics over the entire dataset rather than\nper group. In this case, it counts four total records and finds that the\nmaximum duration observed is `1567`.\n\n\n## Example 2\n\n\nYou can also perform a single aggregation:\n\n\n\n### Example query\n```dataprime\naggregate count() as count\n\n```\n\n### Example output\n\nWhich would return:\n\n| count |\n| --- |\n| 4 |\n\n\n\n"
  block:
    description: "The `block` command filters out all documents where the given predicate\nevaluates to true. It is the inverse of `filter`, which keeps only documents\nthat match the predicate.\n"
    syntax: "block <boolean expression>"
    category: [Commands reference, block]
    content: "\n# `block`\n\n## Description\n\n\nThe `block` command filters out all documents where the given predicate\nevaluates to true. It is the inverse of `filter`, which keeps only documents\nthat match the predicate.\n\n\n## Syntax\n\n```dataprime\nblock <boolean expression>\n```\n\n## Example\n\n\n**Use case: Exclude successful HTTP responses**\n\nIn this example, we remove all documents representing successful (2xx) HTTP\nstatus codes to focus on redirects and errors.\n\n\n### Example data\n```json\n{ \"status_code\": \"200\", \"endpoint\": \"/api/login\" },\n{ \"status_code\": \"301\", \"endpoint\": \"/api/redirect\" },\n{ \"status_code\": \"500\", \"endpoint\": \"/api/payment\" }\n\n```\n\n### Example query\n```dataprime\nblock $d.status_code.startsWith('2')\n\n```\n\n### Example output\n\n```json\n  { \"status_code\": \"301\", \"endpoint\": \"/api/redirect\" },\n  { \"status_code\": \"500\", \"endpoint\": \"/api/payment\" }\n```\n\n\n\n"
  bottom:
    description: "The `bottom` command limits the rows returned from a query to the last *N* rows\nin a given set, ordered by a specified expression. It is useful for finding the\nlowest-ranking values or least frequent occurrences within a dataset.\n\n!!! note\n    When using this command, pay close attention to your ordering expression,\n    as it determines which records are considered \"bottom\" in the result.\n"
    syntax: "bottom <limit> <result_expression1> [as <alias>] [, <result_expression2> [as\n<alias2>], ...] by <orderby_expression> [as <alias>]\n"
    category: [Commands reference, bottom]
    content: "\n# `bottom`\n\n## Description\n\n\nThe `bottom` command limits the rows returned from a query to the last *N* rows\nin a given set, ordered by a specified expression. It is useful for finding the\nlowest-ranking values or least frequent occurrences within a dataset.\n\n!!! note\n    When using this command, pay close attention to your ordering expression,\n    as it determines which records are considered \"bottom\" in the result.\n\n\n## Syntax\n\n```dataprime\nbottom <limit> <result_expression1> [as <alias>] [, <result_expression2> [as\n<alias2>], ...] by <orderby_expression> [as <alias>]\n\n```\n\n## Example\n\n\n**Use case: Get the least active usernames by activity**\n\nWe want to identify which users interact with our system the least so we can\nfocus on re-engagement or cleanup efforts.\n\n\n### Example data\n```json\n{ \"user\": \"Ariel\", ... },\n{ \"user\": \"Ariel\", ... },\n{ \"user\": \"Harel\", ... },\n{ \"user\": \"Harel\", ... },\n{ \"user\": \"Dana\", ... }\n\n```\n\n### Example query\n```dataprime\nbottom 10 user by count()\n\n```\n\n### Example output\n\n```json\n{ \"user\": \"Dana\", \"count\": 1 },\n{ \"user\": \"Harel\", \"count\": 2 },\n{ \"user\": \"Ariel\", \"count\": 2 }\n```\n\nThe command returns the bottom 10 users based on event frequency. In this mock\ndataset, only three users exist, so all are shown, with \"Dana\" ranked lowest by\nactivity count.\n\n\n\n"
  choose:
    description: "The `choose` command removes all keypaths **not explicitly specified**. This\nallows you to extract and reshape only the data you need from a larger log\ndocument.\n\n!!! note\n    The `choose` command supports nested key paths and aliasing in the output,\n    making it useful for simplifying complex documents.\n"
    syntax: "(choose|select) <keypath1> [as <new_keypath>], <keypath2> [as <new_keypath>], ...\n"
    category: [Commands reference, choose]
    content: "\n# `choose`\n\n## Description\n\n\nThe `choose` command removes all keypaths **not explicitly specified**. This\nallows you to extract and reshape only the data you need from a larger log\ndocument.\n\n!!! note\n    The `choose` command supports nested key paths and aliasing in the output,\n    making it useful for simplifying complex documents.\n\n\n## Syntax\n\n```dataprime\n(choose|select) <keypath1> [as <new_keypath>], <keypath2> [as <new_keypath>], ...\n\n```\n\n## Example\n\n\n**Use case: Extract, flatten, and transform key values from log documents**\n\nWe have logs containing detailed HTTP request metadata, but we only want to\nkeep a few key fields-specifically the request path, status code, and number\nof bytes received. We’ll also add a static field to mark the report author and\nperform a calculation to convert bytes to megabytes.\n\n\n### Example data\n```json\n{\n    \"status_code\": 200,\n    \"user\": \"Chris\",\n    \"path\": \"/home\",\n    \"http_request\": {\n        \"metrics\": {\n            \"bytes_metrics\": {\n            \"bytes_received\": 57819\n            }\n        }\n    }\n}\n\n```\n\n### Example query\n```dataprime\nchoose status_code, user as report_author\n\n```\n\n### Example output\n\n```json\n{\n    \"status_code\": 200,\n    \"report_author\": \"Chris\"\n}\n```\n\nThe `choose` command extracts only the requested fields, flattens nested\nkeypaths, adds a calculated value, and includes a constant metadata field for\neasy tracking or reporting.\n\n\n\n"
  convert:
    description: "The `convert` command is a **semantic keyword** that indicates type conversion\nis taking place. It has no effect on query execution and exists purely to make\ntransformations more readable and self-documenting.\n\n!!! note\n    The `convert` keyword is optional and does not change functionality. Use it\n    when you want to make type changes explicit in your query.\n"
    syntax: "(conv|convert) [datatypes] <keypath1>:<datatype1>, <keypath2>:<datatype2>, ..."
    category: [Commands reference, convert]
    content: "\n\n# `convert`\n\n## Description\n\n\nThe `convert` command is a **semantic keyword** that indicates type conversion\nis taking place. It has no effect on query execution and exists purely to make\ntransformations more readable and self-documenting.\n\n!!! note\n    The `convert` keyword is optional and does not change functionality. Use it\n    when you want to make type changes explicit in your query.\n\n\n## Syntax\n\n```dataprime\n(conv|convert) [datatypes] <keypath1>:<datatype1>, <keypath2>:<datatype2>, ...\n```\n\n## Example\n\n\n**Use case: Make type conversions explicit for readability**\n\nSuppose a dataset contains values like `status_code` stored as strings. You\nwant to treat them as numeric values for sorting or comparison. Using\n`convert` signals the intended type conversion for clarity.\n\n\n### Example data\n```json\n{ \"status_code\": \"200\", \"path\": \"/home\" },\n{ \"status_code\": \"404\", \"path\": \"/error\" }\n\n```\n\n### Example query\n```dataprime\nconvert datatypes status_code:number\n\n```\n\n### Example output\n\n```json\n  { \"status_code\": 200, \"path\": \"/home\" },\n  { \"status_code\": 404, \"path\": \"/error\" }\n```\n\nWhile this transformation would happen the same way without `convert`, the\nkeyword improves readability and communicates the intent to other users or\nmaintainers of the query.\n\n\n\n"
  count:
    description: "The `count` command returns a single row representing the total number of\ndocuments in the current result set. It can optionally store this result in a\nnamed keypath for readability using the `into` keyword.\n"
    syntax: "count [into <keypath>]"
    category: [Commands reference, count]
    content: "\n# `count`\n\n## Description\n\n\nThe `count` command returns a single row representing the total number of\ndocuments in the current result set. It can optionally store this result in a\nnamed keypath for readability using the `into` keyword.\n\n\n## Syntax\n\n```dataprime\ncount [into <keypath>]\n```\n\n## Example\n\n\n**Use case: Count the number of HTTP request logs**\n\nWe have log entries representing HTTP requests, each with a `status_code`\nfield. Using `count`, we can determine the total number of requests that\ninclude a status code, optionally saving the result under a custom name for\nclarity.\n\n\n### Example data\n```json\n{ \"status_code\": 200, \"path\": \"/home\" },\n{ \"status_code\": 404, \"path\": \"/not-found\" },\n{ \"status_code\": 500, \"path\": \"/checkout\" }\n\n```\n\n### Example query\n```dataprime\nfilter status_code != null\n| count into http_request_count\n\n```\n\n### Example output\n\n| http_request_count |\n| --- |\n| 3 |\n\nThe `count` command aggregates the number of documents that meet the filter\ncondition and returns the total as a single record. In this case, all three\ndocuments contained a `status_code`.\n\n\n\n"
  countby:
    description: "The `countby` command generates a count for each distinct value in a given\nexpression, effectively grouping the results by that key.\n\n!!! note\n    Unlike `count`, which tallies all records in a set, `countby` provides a\n    per-group count based on the specified key or expression.\n"
    syntax: "countby <expression> [as <alias>] [into <keypath>] [(asc|desc)]"
    category: [Commands reference, countby]
    content: "\n# `countby`\n\n## Description\n\n\nThe `countby` command generates a count for each distinct value in a given\nexpression, effectively grouping the results by that key.\n\n!!! note\n    Unlike `count`, which tallies all records in a set, `countby` provides a\n    per-group count based on the specified key or expression.\n\n\n## Syntax\n\n```dataprime\ncountby <expression> [as <alias>] [into <keypath>] [(asc|desc)]\n```\n\n## Example\n\n\n**Use case: Count requests by HTTP status code**\n\nWhen analyzing logs, it's often useful to understand the distribution of\nresponse types. The `countby` command groups documents by `status_code` and\ncounts the number of requests in each group.\n\n\n### Example data\n```json\n{ \"status_code\": 200, \"path\": \"/home\" },\n{ \"status_code\": 200, \"path\": \"/about\" },\n{ \"status_code\": 404, \"path\": \"/missing\" },\n{ \"status_code\": 500, \"path\": \"/checkout\" }\n\n```\n\n### Example query\n```dataprime\ncountby status_code into request_count asc\n\n```\n\n### Example output\n\n\n| status_code | request_count |\n| --- | --- |\n| 404 | 1 |\n| 500 | 1 |\n| 200 | 2 |\n\nThe `countby` command produces one record per unique status code, with a count\nof how many times each appears. Using `asc` orders the results from the\nsmallest count to the largest.\n\n\n\n"
  create:
    description: "The `create` command defines a new key and assigns it a value derived from an\nexpression. It is one of the most flexible commands in DataPrime, allowing you\nto **add new fields**, **populate missing data**, or **enrich existing\nstructures** without overwriting parent keys.\n\nIn practice, `create` acts like a safe write operation for structured data.\nYou can explicitly control what happens when a key already exists, when it is\nmissing, or when the new value's type differs from the existing one.\n\n- **Existing keys** can be overwritten, skipped, or cause the query to fail.\n- **Missing keys** can be created, skipped, or trigger a failure.\n- **Type changes** can either be enforced, ignored, or handled as an error.\n\n!!! note\n    Key creation is granular, meaning that parent keys in the path are not\n    overwritten. This allows you to safely add fields within existing\n    objects, even in nested log structures.\n"
    syntax: "(a|add|c|create) <keypath> from <expression> [on keypath exists (fail|skip|overwrite)] [on keypath missing (fail|create|skip)] [on datatype change (skip|fail|overwrite)\n"
    category: [Commands reference, create]
    content: "\n\n# `create`\n\n## Description\n\n\nThe `create` command defines a new key and assigns it a value derived from an\nexpression. It is one of the most flexible commands in DataPrime, allowing you\nto **add new fields**, **populate missing data**, or **enrich existing\nstructures** without overwriting parent keys.\n\nIn practice, `create` acts like a safe write operation for structured data.\nYou can explicitly control what happens when a key already exists, when it is\nmissing, or when the new value's type differs from the existing one.\n\n- **Existing keys** can be overwritten, skipped, or cause the query to fail.\n- **Missing keys** can be created, skipped, or trigger a failure.\n- **Type changes** can either be enforced, ignored, or handled as an error.\n\n!!! note\n    Key creation is granular, meaning that parent keys in the path are not\n    overwritten. This allows you to safely add fields within existing\n    objects, even in nested log structures.\n\n\n## Syntax\n\n```dataprime\n(a|add|c|create) <keypath> from <expression> [on keypath exists (fail|skip|overwrite)] [on keypath missing (fail|create|skip)] [on datatype change (skip|fail|overwrite)\n\n```\n\n## Example\n\n\n**Use case: Fill in missing values for older log formats**\n\nOlder versions of logs might not include computed fields that newer logs\nprovide. With `create`, we can dynamically add missing values without\ndisturbing existing data. In this example, we calculate a `user_score`\nderived from `login_streak_days` and `points_scored`.\n\n\n### Example data\n```json\n{ \"user_name\": \"Chris\", \"login_streak_days\": 10, \"points_scored\": 20, \"user_score\": 200 },\n{ \"user_name\": \"Ariel\", \"login_streak_days\": 8, \"points_scored\": 15 },\n{ \"user_name\": \"Dana\", \"login_streak_days\": 5, \"points_scored\": 25 }\n\n```\n\n### Example query\n```dataprime\ncreate user_score from (points_scored * login_streak_days) on keypath exists skip\n\n```\n\n### Example output\n\n```json\n  { \"user_name\": \"Chris\", \"login_streak_days\": 10, \"points_scored\": 20, \"user_score\": 200 },\n  { \"user_name\": \"Ariel\", \"login_streak_days\": 8, \"points_scored\": 15, \"user_score\": 120 },\n  { \"user_name\": \"Dana\", \"login_streak_days\": 5, \"points_scored\": 25, \"user_score\": 125 }\n```\n\nThe `create` command adds the missing `user_score` field for documents that don’t already have it. Existing scores remain unchanged because of the `on keypath exists skip` directive, ensuring no data is overwritten.\n\n\n\n"
  dedupeby:
    description: "The `dedupeby` command removes duplicate documents based on one or more\nexpressions, keeping only *N* events for each unique combination of the\nspecified fields. This is especially useful for sampling representative data\nfrom large datasets without aggregation.\n\nConceptually, it functions like a smart filter: it doesn’t modify event\ncontent or compute summaries-it simply trims redundancy by retaining a\nlimited number of examples per group.\n\n!!! note\n    The content of each retained document remains unchanged. `dedupeby` only\n    limits how many documents are kept for each unique grouping.\n"
    syntax: "dedupeby <expression1> [, <expression2> ...] keep N\n"
    category: [Commands reference, dedupeby]
    content: "\n# `dedupeby`\n\n## Description\n\n\nThe `dedupeby` command removes duplicate documents based on one or more\nexpressions, keeping only *N* events for each unique combination of the\nspecified fields. This is especially useful for sampling representative data\nfrom large datasets without aggregation.\n\nConceptually, it functions like a smart filter: it doesn’t modify event\ncontent or compute summaries-it simply trims redundancy by retaining a\nlimited number of examples per group.\n\n!!! note\n    The content of each retained document remains unchanged. `dedupeby` only\n    limits how many documents are kept for each unique grouping.\n\n\n## Syntax\n\n```dataprime\ndedupeby <expression1> [, <expression2> ...] keep N\n\n```\n\n## Example\n\n\n**Use case: Sample unique requests per operation name**\n\nSuppose your application receives many repeated requests across endpoints,\nsuch as `/index` and `/healthcheck`. You want to inspect only a few examples\nof each to spot anomalies or patterns without processing every event.\n`dedupeby` can keep just a fixed number of samples for each unique operation.\n\n\n### Example data\n```json\n{ \"operationName\": \"index\", \"latency\": 120 },\n{ \"operationName\": \"index\", \"latency\": 98 },\n{ \"operationName\": \"index\", \"latency\": 110 },\n{ \"operationName\": \"healthcheck\", \"latency\": 4000 },\n{ \"operationName\": \"healthcheck\", \"latency\": 200 },\n{ \"operationName\": \"healthcheck\", \"latency\": 350 },\n{ \"operationName\": \"index\", \"latency\": 125 },\n{ \"operationName\": \"index\", \"latency\": 135 },\n{ \"operationName\": \"healthcheck\", \"latency\": 109 },\n{ \"operationName\": \"healthcheck\", \"latency\": 4150 }\n\n```\n\n### Example query\n```dataprime\ndedupeby operationName keep 2\n\n```\n\n### Example output\n\n```json\n{ \"operationName\": \"index\", \"latency\": 120 },\n{ \"operationName\": \"index\", \"latency\": 98 },\n{ \"operationName\": \"healthcheck\", \"latency\": 4000 },\n{ \"operationName\": \"healthcheck\", \"latency\": 200 }\n```\n\nThe `dedupeby` command keeps two events for each unique `operationName`,\ntrimming duplicates while preserving the original event content. This provides\na quick, representative sample for inspection or debugging.\n\n\n\n\n"
  distinct:
    description: "The `distinct` command returns one document per unique value (or combination\nof values) for the given expressions. It is particularly useful for reporting\nor identifying unique entities within a dataset.\n\nFunctionally, it behaves like a lightweight `groupby` without any aggregation\nfunctions-simply collapsing duplicates and returning the first occurrence of\neach distinct value.\n\n!!! note\n    Use `distinct` when you want a list of unique keys, not an aggregate\n    summary.\n"
    syntax: "distinct <expression> [as <alias>] [, <expression_2> [as <alias_2>], ...]\n"
    category: [Commands reference, distinct]
    content: "\n# `distinct`\n\n## Description\n\n\nThe `distinct` command returns one document per unique value (or combination\nof values) for the given expressions. It is particularly useful for reporting\nor identifying unique entities within a dataset.\n\nFunctionally, it behaves like a lightweight `groupby` without any aggregation\nfunctions-simply collapsing duplicates and returning the first occurrence of\neach distinct value.\n\n!!! note\n    Use `distinct` when you want a list of unique keys, not an aggregate\n    summary.\n\n\n## Syntax\n\n```dataprime\ndistinct <expression> [as <alias>] [, <expression_2> [as <alias_2>], ...]\n\n```\n\n## Example\n\n\n**Use case: Generate a list of unique active users**\n\nSuppose your logs contain multiple entries per user as they interact with your\nsystem. You can use `distinct` to produce a clean list of unique usernames for\nreporting or activity tracking.\n\n\n### Example data\n```json\n{ \"username\": \"Chris\", \"action\": \"login\" },\n{ \"username\": \"Chris\", \"action\": \"upload\" },\n{ \"username\": \"Dave\", \"action\": \"login\" },\n{ \"username\": \"Maria\", \"action\": \"logout\" },\n{ \"username\": \"Maria\", \"action\": \"login\" }\n\n```\n\n### Example query\n```dataprime\nsource logs\n| filter username != null\n| distinct username as active_users\n\n```\n\n### Example output\n\n| active_users |\n| --- |\n| Chris |\n| Dave |\n| Maria |\n\nThe `distinct` command collapses repeated usernames into a single record for\neach, creating a clear list of active users.\n\n\n\n"
  enrich:
    description: "The `enrich` command adds contextual information to logs by performing lookups\nagainst a custom enrichment table. It merges additional columns from the\nlookup into each log document based on a matching key.\n\nThis is particularly useful for attaching static metadata (like user details,\nservice mappings, or IP ownership) to incoming logs without modifying upstream\nsystems. The enrichment is applied **at query time**, meaning you always work\nwith the most recent version of the enrichment table.\n\nEach lookup table must be created and uploaded beforehand as a **Custom\nEnrichment**. For setup and management instructions, see\n[Custom Enrichment](https://coralogix.com/docs/user-guides/data-transformation/enrichments/custom-enrichment/).\n\n!!! note\n    - All values in a lookup table are stored as strings. Use conversion\n      functions such as `toNumber()` or `toTimestamp()` if a different type is\n      required.\n    - If a log already contains the enriched key, `enrich` will merge or update\n      only the matching sub-keys; unrelated fields remain unchanged.\n"
    syntax: "enrich <value_to_lookup> into <enriched_key> using <lookup_table>"
    category: [Commands reference, enrich]
    content: "\n# `enrich`\n\n## Description\n\n\nThe `enrich` command adds contextual information to logs by performing lookups\nagainst a custom enrichment table. It merges additional columns from the\nlookup into each log document based on a matching key.\n\nThis is particularly useful for attaching static metadata (like user details,\nservice mappings, or IP ownership) to incoming logs without modifying upstream\nsystems. The enrichment is applied **at query time**, meaning you always work\nwith the most recent version of the enrichment table.\n\nEach lookup table must be created and uploaded beforehand as a **Custom\nEnrichment**. For setup and management instructions, see\n[Custom Enrichment](https://coralogix.com/docs/user-guides/data-transformation/enrichments/custom-enrichment/).\n\n!!! note\n    - All values in a lookup table are stored as strings. Use conversion\n      functions such as `toNumber()` or `toTimestamp()` if a different type is\n      required.\n    - If a log already contains the enriched key, `enrich` will merge or update\n      only the matching sub-keys; unrelated fields remain unchanged.\n\n\n## Syntax\n\n```dataprime\nenrich <value_to_lookup> into <enriched_key> using <lookup_table>\n```\n\n## Example\n\n\n**Use case: Attach employee information to a user ID**\n\nSuppose your logs contain user IDs, and you maintain an external lookup table\nwith user details such as name and department. You can use `enrich` to join\nthis contextual data dynamically into your logs, enabling richer queries and\nmore meaningful analysis.\n\n**Lookup table (`my_users`):**\n\n| ID                                              | Name  | Department |\n| ----------------------------------------------- | ----- | ---------- |\n| 111                                             | John  | Finance    |\n| 222                                             | Emily | IT         |\n\n\n### Example data\n```json\n{ \"userid\": \"111\" },\n{ \"userid\": \"222\" }\n\n```\n\n### Example query\n```dataprime\nenrich userid into user_enriched using my_users\n\n```\n\n### Example output\n\n```json\n{\n    \"userid\": \"111\",\n    \"user_enriched\": {\n    \"ID\": \"111\",\n    \"Name\": \"John\",\n    \"Department\": \"Finance\"\n    }\n},\n{\n    \"userid\": \"222\",\n    \"user_enriched\": {\n    \"ID\": \"222\",\n    \"Name\": \"Emily\",\n    \"Department\": \"IT\"\n    }\n}\n```\n\nThe `enrich` command performs a lookup in `my_users` based on the `userid`\nvalue and attaches the corresponding data as a nested object under\n`user_enriched`. This approach ensures logs always reflect the latest lookup\ninformation without altering the source data.\n\n\n\n"
  explode:
    description: "The `explode` command transforms an array of *N* elements into *N* separate\ndocuments, each containing one element of the array at the specified keypath.\nIt’s commonly used to “flatten” nested data structures for easier analysis or\naggregation.\n\nWhen using `explode`, you can control whether to keep or remove the original\ndocument fields via the `original` modifier:\n\n- `original discard` removes all original fields, producing minimal output\n  with just the exploded key.\n- `original preserve` retains the original document fields, duplicating them\n  across the new documents.\n\n!!! note\n    If the destination keypath already exists in the document, it is\n    overwritten by the exploded value.  \n    The default behavior is `original discard`.\n"
    syntax: "explode <expression> into <keypath> [original discard|preserve]"
    category: [Commands reference, explode]
    content: "\n# `explode`\n\n## Description\n\n\nThe `explode` command transforms an array of *N* elements into *N* separate\ndocuments, each containing one element of the array at the specified keypath.\nIt’s commonly used to “flatten” nested data structures for easier analysis or\naggregation.\n\nWhen using `explode`, you can control whether to keep or remove the original\ndocument fields via the `original` modifier:\n\n- `original discard` removes all original fields, producing minimal output\n  with just the exploded key.\n- `original preserve` retains the original document fields, duplicating them\n  across the new documents.\n\n!!! note\n    If the destination keypath already exists in the document, it is\n    overwritten by the exploded value.  \n    The default behavior is `original discard`.\n\n\n## Syntax\n\n```dataprime\nexplode <expression> into <keypath> [original discard|preserve]\n```\n\n## Example\n\n\n**Use case: Represent each user permission as an individual document**\n\nEach log contains a list of permissions (`scopes`) assigned to a user. To make\npermission-level analysis simpler, we can use `explode` to create one document\nper permission, preserving the original fields for context.\n\n\n### Example data\n```json\n{ \"userid\": \"1\", \"scopes\": [\"read\", \"write\"] },\n{ \"userid\": \"2\", \"scopes\": [\"read\", null] }\n\n```\n\n### Example query\n```dataprime\nsource logs | explode scopes into scope original preserve\n\n```\n\n### Example output\n\n```json\n{ \"userid\": \"1\", \"scope\": \"read\", \"scopes\": [\"read\", \"write\"] },\n{ \"userid\": \"1\", \"scope\": \"write\", \"scopes\": [\"read\", \"write\"] },\n{ \"userid\": \"2\", \"scope\": \"read\", \"scopes\": [\"read\", null] },\n{ \"userid\": \"2\", \"scope\": null, \"scopes\": [\"read\", null] }\n```\n\nThe `explode` command expands each array element into its own document while\nkeeping the original `userid` and `scopes` fields. This makes it easier to\nquery and aggregate user permissions individually.\nid: explode\n\n\n\n"
  extract:
    description: "The `extract` function allows you to transform raw strings into structured data by parsing out embedded values and storing them as objects. It supports various extraction strategies to convert unstructured fields into clean, queryable formats."
    syntax: "(e|extract) <expression> into <keypath> using <extraction-type>(<extraction-params>) [datatypes keypath:datatype,keypath:datatype,...]"
    category: [Commands reference, extract]
    content: "\n# `extract`\n\n## Description\n\n\nThe `extract` function allows you to transform raw strings into structured data by parsing out embedded values and storing them as objects. It supports various extraction strategies to convert unstructured fields into clean, queryable formats.\n\n## Syntax\n\n```dataprime\n(e|extract) <expression> into <keypath> using <extraction-type>(<extraction-params>) [datatypes keypath:datatype,keypath:datatype,...]\n```\n\n\n\n## Extractor functions\n\nExtractor functions define how raw strings are parsed and transformed into structured objects when using the `extract` keyword. Each function handles a specific format, such as regular expressions, key-value pairs, delimited lists, or escaped JSON. You specify the extractor using the `using` clause, which determines how the string will be interpreted. With the right extractor, you can convert unstructured data into clean, queryable objects for filtering, analysis, and visualization.\n\n\n### 1. `regexp`\n\nParses data using **named capture groups** in a regular expression.\n\n#### Input\n\n```json\n{\n  \"message\": \"user Chris has logged in\"\n}\n```\n\n#### Query\n\n```dataprime\nextract message into user_data using regexp(e=/user (?<user>.*) has logged in/)\n```\n\n#### Output\n\n```json\n{\n  \"message\": \"user Chris has logged in\",\n  \"user_data\": {\n    \"user\": \"Chris\"\n  }\n}\n```\n\n### 2. `multi_regexp`\n\nExtracts **all matches** of a pattern into an **array**.\n\n#### Input\n\n```json\n{\n  \"log\": \"user 1 did 2 things on 3 pages\"\n}\n```\n\n#### Query\n\n```dataprime\nextract log into numbers using multi_regexp(e=/\\d+/)\n```\n\n#### Output\n\n```json\n{\n  \"log\": \"user 1 did 2 things on 3 pages\",\n  \"numbers\": [\"1\", \"2\", \"3\"]\n}\n```\n\n### 3. `kv`\n\nParses a string of key-value pairs into an object.\n\n#### Input\n\n```json\n{\n  \"query_string\": \"a=b&b=c&c=d\"\n}\n```\n\n#### Query\n\n```dataprime\nextract query_string into query_params using kv(pair_delimiter='&', key_delimiter='=')\n```\n\n#### Output\n\n```json\n{\n  \"query_string\": \"a=b&b=c&c=d\",\n  \"query_params\": {\n    \"a\": \"b\",\n    \"b\": \"c\",\n    \"c\": \"d\"\n  }\n}\n```\n\n### 4. `jsonobject`\n\nUnescapes and parses a stringified JSON object.\n\n#### Input\n\n```json\n{\n  \"nested_json\": \"{\\\"key\\\": \\\"value\\\"}\"\n}\n```\n\n#### Query\n\n```dataprime\nextract nested_json into parsed_json using jsonobject\n```\n\n#### Output\n\n```json\n{\n  \"nested_json\": \"{\\\"key\\\": \\\"value\\\"}\",\n  \"parsed_json\": {\n    \"key\": \"value\"\n  }\n}\n```\n\n### 5. `split`\n\nSplits a string by a delimiter into an array of primitive values.\n\n#### Input\n\n```json\n{\n  \"csv_codes\": \"10,20,30\"\n}\n```\n\n#### Query\n\n```dataprime\nextract csv_codes into codes using split(delimiter=',', element_datatype=number)\n```\n\n#### Output\n\n```json\n{\n  \"csv_codes\": \"10,20,30\",\n  \"codes\": [10, 20, 30]\n}\n```\n\n## Using `datatypes` to annotate extracted fields\n\nYou can provide explicit type annotations to specific fields using the `datatypes` clause. This ensures values are stored with the correct type, enabling numerical comparisons, aggregations, and more.\n\n#### Input\n\n```json\n{\n  \"msg\": \"query_type=fetch query_id=100 query_results_duration_ms=232\"\n}\n```\n\n#### Query\n\n```dataprime\nextract msg into query_data using kv() datatypes query_results_duration_ms:number\n```\n\n#### Output\n\n```json\n{\n  \"msg\": \"query_type=fetch query_id=100 query_results_duration_ms=232\",\n  \"query_data\": {\n    \"query_type\": \"fetch\",\n    \"query_id\": \"100\",\n    \"query_results_duration_ms\": 232\n  }\n}\n```\n\n> `query_results_duration_ms` is now a number, while `query_id` remains a string.\n\n!!! note\n    You only need to specify the extracted field name in `datatypes`, not the full keypath.\n\n## Summary\n\nThe `extract` keyword, combined with extractor functions, provides a flexible and powerful way to transform messy strings into usable structured data. Whether you're parsing JSON blobs, splitting CSV-like fields, or decoding regex patterns, the extractor system helps you build clean logs and metrics pipelines in a declarative, readable way.\n\n\n<!-- ---\ntitle: extract\ndate: '2024-10-13'\ndescription: |\n  The `extract` command transforms raw string data into structured objects byparsing embedded values and assigning them to new keypaths. It supports multiple extraction strategies, allowing you to convert unstructured fields into clean, queryable formats for downstream analysis.\n\n  Extractors are modular functions, such as `regexp`, `kv`, `split`, or `jsonobject`, that determine how a string is parsed. Combined with the `datatypes` clause, `extract` provides control over how parsed values are typed and stored.\n\n  !!! note\n      - `extract` does not modify the original field-it creates a new keypath\n        containing the parsed result.\n      - You can use `datatypes` to annotate extracted fields with the correct\n        types for numeric operations or comparisons.\nsyntax: |\n  (e|extract) <expression> into <keypath> using <extraction-type>(<extraction-params>) [datatypes keypath:datatype,keypath:datatype,...]\nexample_description: |\n  **Use case: Parse log fields into structured data**\n\n  Suppose your logs include fields like `query_string` or escaped JSON blobs that\n  are hard to query directly. You can use `extract` to transform these unstructured\n  values into well-defined objects or arrays, making them fully searchable and\n  ready for analysis.\nexample_input: |\n  { \"query_string\": \"a=b&b=c&c=d\" },\n  { \"csv_codes\": \"10,20,30\" },\n  { \"nested_json\": \"{\\\"key\\\": \\\"value\\\"}\" }\nexample_query: |\n  extract query_string into query_params using kv(pair_delimiter='&', key_delimiter='=')\n  | extract csv_codes into codes using split(delimiter=',', element_datatype=number)\n  | extract nested_json into parsed_json using jsonobject\nexample_output: |\n  ```json\n  {\n    \"query_string\": \"a=b&b=c&c=d\",\n    \"query_params\": { \"a\": \"b\", \"b\": \"c\", \"c\": \"d\" },\n    \"csv_codes\": \"10,20,30\",\n    \"codes\": [10, 20, 30],\n    \"nested_json\": \"{\\\"key\\\": \\\"value\\\"}\",\n    \"parsed_json\": { \"key\": \"value\" }\n  }\n  ```\n\n  The `extract` command uses specialized extractor types to interpret raw\n  strings-turning query strings into key-value pairs, delimited values into\n  arrays, and escaped JSON into structured objects. This dramatically improves\n  the readability and queryability of log data.\nid: extract\n---\n\n# `extract`\n\n## Description\n\n\nThe `extract` function allows you to transform raw strings into structured data by parsing out embedded values and storing them as objects. It supports various extraction strategies to convert unstructured fields into clean, queryable formats.\n\n## Syntax\n\n```dataprime\n(e|extract) <expression> into <keypath> using <extraction-type>(<extraction-params>) [datatypes keypath:datatype,keypath:datatype,...]\n```\n\n\n -->\n"
  filter:
    description: "The `filter` command removes all documents that do not satisfy a specified\ncondition. Only events for which the condition evaluates to `true` are\nretained in the result set.\n\nThis command forms the foundation of most queries-it defines which data should\nbe kept for further transformation or aggregation. Filters can be simple\ncomparisons or complex logical expressions involving multiple conditions and\nfunctions.\n\n!!! note\n    When comparing keypaths to `null`, the comparison only works on scalar\n    values (`string`, `number`, `timestamp`, etc.). For nested JSON objects,\n    comparisons with `null` will always return `null`.\n"
    syntax: "(f|filter|where) <condition-expression>\n"
    category: [Commands reference, filter]
    content: "\n# `filter`\n\n## Description\n\n\nThe `filter` command removes all documents that do not satisfy a specified\ncondition. Only events for which the condition evaluates to `true` are\nretained in the result set.\n\nThis command forms the foundation of most queries-it defines which data should\nbe kept for further transformation or aggregation. Filters can be simple\ncomparisons or complex logical expressions involving multiple conditions and\nfunctions.\n\n!!! note\n    When comparing keypaths to `null`, the comparison only works on scalar\n    values (`string`, `number`, `timestamp`, etc.). For nested JSON objects,\n    comparisons with `null` will always return `null`.\n\n\n## Syntax\n\n```dataprime\n(f|filter|where) <condition-expression>\n\n```\n\n## Example\n\n\n**Use case: Keep only server errors (HTTP 5xx)**\n\nYou can use `filter` to include only events matching a specific numeric range,\nstring pattern, or complex condition. In this example, we filter log documents\nto show only those where the `http_status_code` indicates a server error.\n\n\n### Example data\n```json\n{ \"http_status_code\": 502, \"path\": \"/api/login\" },\n{ \"http_status_code\": 404, \"path\": \"/api/home\" },\n{ \"http_status_code\": 503, \"path\": \"/api/checkout\" }\n\n```\n\n### Example query\n```dataprime\nfilter http_status_code > 500\n\n```\n\n### Example output\n\n```json\n{ \"http_status_code\": 502, \"path\": \"/api/login\" },\n{ \"http_status_code\": 503, \"path\": \"/api/checkout\" }\n```\n\nThe `filter` command keeps only the documents that meet the specified\ncondition-in this case, HTTP status codes greater than `500`.\n\nAliases `f` and `where` can be used interchangeably:\n\n* `f http_status_code > 500`\n* `where http_status_code > 500`\n\n\n\n"
  find:
    description: "The `find` command performs a free-text search within a specified keypath. It acts as a\nshorthand for combining `filter` with a text match (`~`).\n\nThis command is ideal for quick searches across log messages or string fields\nwhere full parsing is unnecessary. The alias `text` can be used\ninterchangeably with `find`.\n"
    syntax: "(find|text) <free-text-string> in <keypath>\n"
    category: [Commands reference, find / text]
    content: "\n# `find / text`\n\n## Description\n\n\nThe `find` command performs a free-text search within a specified keypath. It acts as a\nshorthand for combining `filter` with a text match (`~`).\n\nThis command is ideal for quick searches across log messages or string fields\nwhere full parsing is unnecessary. The alias `text` can be used\ninterchangeably with `find`.\n\n\n## Syntax\n\n```dataprime\n(find|text) <free-text-string> in <keypath>\n\n```\n\n## Example\n\n\n**Use case: Find logs mentioning a specific AWS availability zone**\n\nWhen investigating deployment behavior across regions, you might want to\nreturn only logs referencing a particular availability zone-without parsing or\nrestructuring the message field.\n\n\n### Example data\n```json\n{ \"msg\": \"eu-west-1a instance deployed\" },\n{ \"msg\": \"eu-west-1b instance deployed\" },\n{ \"msg\": \"eu-west-1c instance deployed\" }\n\n```\n\n### Example query\n```dataprime\nfind 'eu-west-1a' in msg\n\n```\n\n### Example output\n\n```json\n{ \"msg\": \"eu-west-1a instance deployed\" }\n```\n\nThe `find` command returns only documents containing the specified substring.\nIt’s particularly useful for quickly searching raw log fields.\n\n\n\n"
  groupby:
    description: "The `groupby` command aggregates documents that share one or more common values or calculated expressions, allowing you to compute metrics such as `sum`, `avg`, `max`, `min`, and `count`. It is the cornerstone of DataPrime’s analytical capabilities, enabling powerful summarization and insight generation from raw event data.\nEach unique combination of grouping expressions produces a single output document. The `aggregate` or `agg` keyword specifies which aggregation functions to apply within each group.\n!!! note\n    You can group by both keypaths and calculated expressions. When grouping by\n    an expression, DataPrime evaluates it dynamically for each document before\n    grouping."
    syntax: "groupby <grouping_expression> [as <alias>] [, <grouping_expression_2> [as\n<alias_2>], ...] [aggregate|agg] <aggregate_function> [as <result_keypath>] [,\n<aggregate_function_2> [as <result_keypath_2], ...]\n"
    category: [Commands reference, groupby]
    content: "\n# `groupby`\n\n## Description\n\n\nThe `groupby` command aggregates documents that share one or more common values or calculated expressions, allowing you to compute metrics such as `sum`, `avg`, `max`, `min`, and `count`. It is the cornerstone of DataPrime’s analytical capabilities, enabling powerful summarization and insight generation from raw event data.\nEach unique combination of grouping expressions produces a single output document. The `aggregate` or `agg` keyword specifies which aggregation functions to apply within each group.\n!!! note\n    You can group by both keypaths and calculated expressions. When grouping by\n    an expression, DataPrime evaluates it dynamically for each document before\n    grouping.\n\n## Syntax\n\n```dataprime\ngroupby <grouping_expression> [as <alias>] [, <grouping_expression_2> [as\n<alias_2>], ...] [aggregate|agg] <aggregate_function> [as <result_keypath>] [,\n<aggregate_function_2> [as <result_keypath_2], ...]\n\n```\n\n## Example 1\n\n\n**Use case: Calculate average request duration per HTTP path**\n\nThe `groupby` command is most commonly used to aggregate numerical metrics by\na categorical field. In this example, we group by `path` and calculate the\naverage request duration, producing one result per endpoint.\n\n\n### Example data\n```json\n{ \"path\": \"/home\", \"duration\": 400 },\n{ \"path\": \"/home\", \"duration\": 600 },\n{ \"path\": \"/about\", \"duration\": 512 },\n{ \"path\": \"/store\", \"duration\": 33 }\n\n```\n\n### Example query\n```dataprime\ngroupby path agg avg(duration) as average_duration_for_path\n\n```\n\n### Example output\n\n\n| path | average_duration_for_path |\n| --- | --- |\n| /home | 500 |\n| /about | 512 |\n| /store | 33 |\n\nThe `groupby` command collapses all documents with the same `path` value into\na single record, applying the `avg()` aggregation function to compute the mean\nduration. Only the grouping fields and calculated aggregates are retained in\nthe output.\n\n\n## Example 2\n\n\nGroup by a transformed key:\n\n\n\n### Example query\n```dataprime\ngroupby username.toLowerCase() agg count() as activity_count\n\n```\n\n\n## Example 3\n\n\nCluster IPs into subnets:\n\n\n\n### Example query\n```dataprime\ngroupby ipPrefix(process.tags['k8s.pod.ip'], 24) as subnet_range agg count() as activity_count\n\n```\n\n\n## Example 4\n\n\nCompute 99th percentile from traces:\n\n\n\n### Example query\n```dataprime\nfilter $l.operationName == 'Lambda.Invoke'\n| groupby $l.operationName agg percentile(0.99, $m.duration)\n\n```\n\n\n\n"
  multigroupby:
    description: "The `multigroupby` command concatenates the results from two or more\n[`groupby`](groupby) queries into a single dataset. It allows multiple\naggregation queries to execute in one scan, improving efficiency and keeping\ngrouped results synchronized.\n\n**Key benefits:**\n\n- **Efficiency:** Data is scanned only once across multiple groupings.\n- **Synchronization:** Results remain coherent, avoiding mismatches between\n  independently run groupby queries.\n\n!!! note\n    The maximum number of buckets that `multigroupby` can process is 64.\n"
    syntax: "multigroupby (<grouping_expression_1> as <alias> [, <grouping_expression_2> as <alias_2>, ...]) \n[, (<grouping_expression_1> as <alias> [, <grouping_expression_2> as <alias_2>, ...]), ...]\n[aggregate] <aggregation_expression> [as <result_keypath>] [, <aggregation_expression_2> [as <result_keypath_2>], ...]\n"
    category: [Commands reference, multigroupby]
    content: "\n# `multigroupby`\n\n## Description\n\n\nThe `multigroupby` command concatenates the results from two or more\n[`groupby`](groupby) queries into a single dataset. It allows multiple\naggregation queries to execute in one scan, improving efficiency and keeping\ngrouped results synchronized.\n\n**Key benefits:**\n\n- **Efficiency:** Data is scanned only once across multiple groupings.\n- **Synchronization:** Results remain coherent, avoiding mismatches between\n  independently run groupby queries.\n\n!!! note\n    The maximum number of buckets that `multigroupby` can process is 64.\n\n\n## Syntax\n\n```dataprime\nmultigroupby (<grouping_expression_1> as <alias> [, <grouping_expression_2> as <alias_2>, ...]) \n[, (<grouping_expression_1> as <alias> [, <grouping_expression_2> as <alias_2>, ...]), ...]\n[aggregate] <aggregation_expression> [as <result_keypath>] [, <aggregation_expression_2> [as <result_keypath_2>], ...]\n\n```\n\n## Example 1\n\n\n**Use case: Compare subsystem-level and application-level counts in one query**\n\nWith `multigroupby`, you can produce both detailed counts (e.g. per subsystem)\nand higher-level totals (e.g. per application) in a single scan. This avoids\nrunning two separate queries and ensures the results are synchronized.\n\n\n### Example data\n```json\n{ \"applicationname\": \"monitoring24\", \"subsystemname\": \"NO_SUBSYSTEM_NAME\" },\n{ \"applicationname\": \"monitoring24\", \"subsystemname\": \"coralogix-opentelemetry-agent\" },\n{ \"applicationname\": \"monitoring24\", \"subsystemname\": \"coralogix-opentelemetry-collector\" },\n{ \"applicationname\": \"monitoring24\", \"subsystemname\": \"NO_SUBSYSTEM_NAME\" },\n{ \"applicationname\": \"monitoring24\", \"subsystemname\": \"coralogix-opentelemetry-agent\" }\n\n```\n\n### Example query\n```dataprime\nsource logs\n| multigroupby ($l.applicationname as app, $l.subsystemname as ss), ($l.applicationname as app)\nagg count()\n| orderby app, ss\n\n```\n\n### Example output\n\n\n| app | ss | _count0 |\n| --- | --- | --- |\n| monitoring24 | NO_SUBSYSTEM_NAME | 241 |\n| monitoring24 | coralogix-opentelemetry-agent | 231 |\n| monitoring24 | coralogix-opentelemetry-collector | 15 |\n| monitoring24 | null | 487 |\n\n\nThe first three rows represent counts for each subsystem within the\napplication. The final row shows the total count per application, where `ss`\nis `null` to indicate aggregation across all subsystems.\n\n\n## Example 2\n\n\n**Use case: Different aliases**\n\nIf you use distinct aliases for each grouping, such as `app1` and `app2`, the\ndata remains separate but aligned:\n\n\n\n### Example query\n```dataprime\nsource logs | multigroupby ($l.applicationname as app1, $l.subsystemname as ss), ($l.applicationname as app2) agg count()\n\n```\n\n### Example output\n\n```json\n{ \"_count0\": 241, \"app1\": \"monitoring24\", \"app2\": null, \"ss\": \"coralogix-opentelemetry-agent\" },\n{ \"_count0\": 231, \"app1\": \"monitoring24\", \"app2\": null, \"ss\": \"coralogix-opentelemetry-collector\" },\n{ \"_count0\": 15,  \"app1\": \"monitoring24\", \"app2\": null, \"ss\": \"no_subsystem_name\" },\n{ \"_count0\": 487, \"app1\": null, \"app2\": \"monitoring24\", \"ss\": null }\n```\n\nThis approach clearly separates detailed and aggregate groupings while\ncombining both results in one dataset.\n\n\n\n"
  join:
    description: "The `join` command merges the current (left) query with the results of a\nsecond (right) query. Conceptually, it forms a Cartesian product of left and\nright rows, then applies join logic based on a condition (`on`) or matching\nkeypaths (`using`) and writes the matching right-side row into a destination\nkeypath (`into`).\n\n**Join types**\n\n* **left** (default): Keep all left rows; attach matching right rows or `null`\n  when no match.\n* **inner**: Keep only rows that match on both sides.\n* **full**: Keep all rows from both sides; non-matching fields are `null`.\n* **cross**: Return the full Cartesian product; no `on`/`using` supported.\n\n**Addressing fields**\n\n* Use `left=>` and `right=>` prefixes inside `on` to disambiguate fields with\n  the same name; omit when a keypath exists only on one side.\n\n**Behavior & caveats**\n\n* Conditions support **equality (`==`)** on keypaths; chain multiple with `&&`.\n* One side must be relatively small (< 200MB); reduce size with `filter` or\n  `remove`.\n* In left joins, nulls in the join keys prevent matches; use `join full` to\n  include unmatched keys from either side.\n* Joins can duplicate rows if multiple matches exist; consider preprocessing\n  (e.g., `distinct`) to avoid unintended multiplicity.\n"
    syntax: "<left_side_query> | join [left/inner/full] (<right_side_query>) on <condition> into <right_side_target>\n\n<left_side_query> | join [left/inner/full] (<right_side_query>) using <join_keypath_1> [, <join_keypath_2>, ...] into <right_side_target>\n\n<left_side_query> | join cross (<right_side_query>) into <right_side_target>\n"
    category: [Commands reference, join]
    content: "\n# `join`\n\n## Description\n\n\nThe `join` command merges the current (left) query with the results of a\nsecond (right) query. Conceptually, it forms a Cartesian product of left and\nright rows, then applies join logic based on a condition (`on`) or matching\nkeypaths (`using`) and writes the matching right-side row into a destination\nkeypath (`into`).\n\n**Join types**\n\n* **left** (default): Keep all left rows; attach matching right rows or `null`\n  when no match.\n* **inner**: Keep only rows that match on both sides.\n* **full**: Keep all rows from both sides; non-matching fields are `null`.\n* **cross**: Return the full Cartesian product; no `on`/`using` supported.\n\n**Addressing fields**\n\n* Use `left=>` and `right=>` prefixes inside `on` to disambiguate fields with\n  the same name; omit when a keypath exists only on one side.\n\n**Behavior & caveats**\n\n* Conditions support **equality (`==`)** on keypaths; chain multiple with `&&`.\n* One side must be relatively small (< 200MB); reduce size with `filter` or\n  `remove`.\n* In left joins, nulls in the join keys prevent matches; use `join full` to\n  include unmatched keys from either side.\n* Joins can duplicate rows if multiple matches exist; consider preprocessing\n  (e.g., `distinct`) to avoid unintended multiplicity.\n\n\n## Syntax\n\n```dataprime\n<left_side_query> | join [left/inner/full] (<right_side_query>) on <condition> into <right_side_target>\n\n<left_side_query> | join [left/inner/full] (<right_side_query>) using <join_keypath_1> [, <join_keypath_2>, ...] into <right_side_target>\n\n<left_side_query> | join cross (<right_side_query>) into <right_side_target>\n\n```\n\n## Example\n\n\n**Use case: Attach login counts to user records (left join by default)**\n\nWe have a `users` enrichment table and a set of login events. We want each\nuser row to include the number of logins associated with that user. If a user\nhas no logins, the joined field should be `null` (left-join semantics).\n\n\n### Example data\n```json\n{\n  \"users\": [\n    { \"id\": \"111\", \"name\": \"John\" },\n    { \"id\": \"222\", \"name\": \"Emily\" },\n    { \"id\": \"333\", \"name\": \"Alice\" }\n  ],\n  \"logs\": [\n    { \"userid\": \"111\", \"timestamp\": \"2022-01-01T12:00:00Z\" },\n    { \"userid\": \"111\", \"timestamp\": \"2022-01-01T12:30:00Z\" },\n    { \"userid\": \"222\", \"timestamp\": \"2022-01-01T13:00:00Z\" },\n    { \"userid\": \"222\", \"timestamp\": \"2022-01-01T13:00:00Z\" },\n    { \"userid\": \"222\", \"timestamp\": \"2022-01-01T13:00:00Z\" }\n  ]\n}\n\n```\n\n### Example query\n```dataprime\nsource users | join (source logs | countby userid) on id == userid into logins\n\n```\n\n### Example output\n\n```json\n{ \"id\": \"111\", \"name\": \"John\",  \"logins\": { \"userid\": \"111\", \"_count\": 2 } },\n{ \"id\": \"222\", \"name\": \"Emily\", \"logins\": { \"userid\": \"222\", \"_count\": 3 } },\n{ \"id\": \"333\", \"name\": \"Alice\", \"logins\": null }\n```\n\nThe `join` attaches a single aggregated row per user into `logins`. Users\nwithout matching events (e.g., `\"333\"`) retain their left-side fields with the\njoined target set to `null`.\n\n\n\n"
  limit:
    description: "The `limit` command restricts the number of documents returned by a query to a\nspecified count. It is typically used after sorting or aggregation operations\nto retrieve only the most relevant or top results from a larger dataset.\n\nThis command is especially useful for performance optimization or for\ndisplaying only a subset of high-value results (for example, the top 100 users\nor the most recent 50 logs).\n\n!!! note\n    The `limit` command does not guarantee order unless used after an explicit\n    `orderby`. If order matters, always pair it with `orderby` to ensure\n    predictable results.\n"
    syntax: "limit <event-count>\n"
    category: [Commands reference, limit]
    content: "\n# `limit`\n\n## Description\n\n\nThe `limit` command restricts the number of documents returned by a query to a\nspecified count. It is typically used after sorting or aggregation operations\nto retrieve only the most relevant or top results from a larger dataset.\n\nThis command is especially useful for performance optimization or for\ndisplaying only a subset of high-value results (for example, the top 100 users\nor the most recent 50 logs).\n\n!!! note\n    The `limit` command does not guarantee order unless used after an explicit\n    `orderby`. If order matters, always pair it with `orderby` to ensure\n    predictable results.\n\n\n## Syntax\n\n```dataprime\nlimit <event-count>\n\n```\n\n## Example\n\n\n**Use case: Show the top 100 users by activity**\n\nSuppose you want to analyze the most active users by counting their log\nactivity. After aggregating and sorting by total hits, you can apply `limit`\nto return only the top 100 users.\n\n\n### Example data\n```json\n{ \"path\": \"/home\", \"user\": \"chris\" },\n{ \"path\": \"/home\", \"user\": \"dave\" },\n{ \"path\": \"/home\", \"user\": \"maya\" },\n{ \"path\": \"/checkout\", \"user\": \"chris\" },\n{ \"path\": \"/login\", \"user\": \"dave\" }\n{ \"path\": \"/blog\", \"user\": \"chris\" },\n{ \"path\": \"/about\", \"user\": \"Eugene\" }\n\n```\n\n### Example query\n```dataprime\ngroupby user count() as hit_count\n| orderby hit_count desc\n| limit 2\n\n```\n\n### Example output\n\n```json\n{ \"user\": \"chris\", \"hit_count\": 3 },\n{ \"user\": \"dave\", \"hit_count\": 2 }\n```\n\nThe `limit` command truncates the result set to the first 100 users based on\nthe ordering applied. **Since there are only 3 users** in this example, all\nare returned.\n\n!!! note\n    You can achieve similar behavior with the `top` command, which combines\n    ordering and limiting in one operation.\n\n\n\n"
  lucene:
    description: "The `lucene` command executes a Lucene query within a DataPrime query,\nallowing users to seamlessly combine Lucene’s search syntax with DataPrime’s\nstructured query capabilities.\n\nThis enables powerful hybrid queries-for example, filtering or aggregating\nover results first narrowed by a Lucene search expression.\n\n!!! note\n    Field names inside the Lucene query are relative to `$d` (the root level\n    of user data). You can combine Lucene search with other DataPrime commands\n    such as `filter`, `aggregate`, or `groupby`.\n"
    syntax: "lucene <lucene-query-as-a-string>"
    category: [Commands reference, lucene]
    content: "\n# `lucene`\n\n## Description\n\n\nThe `lucene` command executes a Lucene query within a DataPrime query,\nallowing users to seamlessly combine Lucene’s search syntax with DataPrime’s\nstructured query capabilities.\n\nThis enables powerful hybrid queries-for example, filtering or aggregating\nover results first narrowed by a Lucene search expression.\n\n!!! note\n    Field names inside the Lucene query are relative to `$d` (the root level\n    of user data). You can combine Lucene search with other DataPrime commands\n    such as `filter`, `aggregate`, or `groupby`.\n\n\n## Syntax\n\n```dataprime\nlucene <lucene-query-as-a-string>\n```\n\n## Example\n\n\n**Use case: Combine Lucene filtering with DataPrime analytics**\n\nSuppose you want to retrieve only logs where the `pod` name contains\n“recommender” and the event either indicates an error or has a `404` status\ncode. You can use a Lucene expression directly in your query.\n\n\n### Example data\n```json\n{ \"pod\": \"recommender-01\", \"is_error\": true, \"status_code\": 500 },\n{ \"pod\": \"checkout-02\", \"is_error\": true, \"status_code\": 200 },\n{ \"pod\": \"recommender-02\", \"is_error\": false, \"status_code\": 404 },\n{ \"pod\": \"auth-01\", \"is_error\": false, \"status_code\": 200 }\n\n```\n\n### Example query\n```dataprime\nlucene 'pod:recommender AND (is_error:true OR status_code:404)'\n\n```\n\n### Example output\n\n```json\n{ \"pod\": \"recommender-01\", \"is_error\": true, \"status_code\": 500 },\n{ \"pod\": \"recommender-02\", \"is_error\": false, \"status_code\": 404 }\n```\n\nThe `lucene` command filters logs based on Lucene syntax before passing the\nresults to any subsequent DataPrime transformations. This makes it ideal for\nleveraging existing Lucene search expertise within DataPrime workflows.\n\n\n\n"
  move:
    description: "The `move` command relocates a keypath to a new position within a document.\nThis is useful when keypaths are deeply nested or inconsistently structured,\nmaking queries cumbersome to write and read.\n\nWhen a keypath is moved, its value (and any child keys if it’s an object) is\ntransferred to the target keypath, and the original keypath is removed.\n\n!!! note\n    If the source keypath is an object, the entire key and all child elements\n    are moved to the new location.\n"
    syntax: "(m|move) <source-keypath> to <target-keypath>\n"
    category: [Commands reference, move]
    content: "\n# `move`\n\n## Description\n\n\nThe `move` command relocates a keypath to a new position within a document.\nThis is useful when keypaths are deeply nested or inconsistently structured,\nmaking queries cumbersome to write and read.\n\nWhen a keypath is moved, its value (and any child keys if it’s an object) is\ntransferred to the target keypath, and the original keypath is removed.\n\n!!! note\n    If the source keypath is an object, the entire key and all child elements\n    are moved to the new location.\n\n\n## Syntax\n\n```dataprime\n(m|move) <source-keypath> to <target-keypath>\n\n```\n\n## Example\n\n\n**Use case: Simplify access to nested data**\n\nSuppose your document has deeply nested metadata under multiple object levels,\nand you want to bring one of those fields-like `labels`-to the top level for\neasier querying and readability.\n\n\n### Example data\n```json\n{\n    \"data\": {\n        \"my_data\": {\n        \"labels\": {\n            \"label1\": \"value1\"\n        }\n        }\n    }\n}\n\n```\n\n### Example query\n```dataprime\nmove data.my_data.labels to labels\n\n```\n\n### Example output\n\n```json\n{\n    \"data\": { \"my_data\": {} },\n    \"labels\": { \"label1\": \"value1\" }\n}\n```\n\nAfter executing `move`, the `labels` object is relocated to the top level, and\nthe original nested structure (`data.my_data.labels`) is removed. Queries can\nnow access `labels` directly instead of traversing multiple layers.\n\n\n\n"
  orderby:
    description: "The `orderby` command sorts query results in ascending or descending order\nbased on one or more expressions. It supports multiple sort keys, allowing you\nto order by several fields sequentially.\n\nThe command has several aliases, `orderby`, `sortby`, `order by`, and\n`sort by`, that behave identically.\n\n!!! note\n    Sorting is limited to 10,000 values. Beyond that limit, order is not\n    guaranteed.\n"
    syntax: "(orderby|sortby|order by|sort by) <expression> [(asc|desc)] , ..."
    category: [Commands reference, orderby / sortby]
    content: "\n# `orderby / sortby`\n\n## Description\n\n\nThe `orderby` command sorts query results in ascending or descending order\nbased on one or more expressions. It supports multiple sort keys, allowing you\nto order by several fields sequentially.\n\nThe command has several aliases, `orderby`, `sortby`, `order by`, and\n`sort by`, that behave identically.\n\n!!! note\n    Sorting is limited to 10,000 values. Beyond that limit, order is not\n    guaranteed.\n\n\n## Syntax\n\n```dataprime\n(orderby|sortby|order by|sort by) <expression> [(asc|desc)] , ...\n```\n\n## Example 1\n\n\n**Use case: Sort users alphabetically and by activity count**\n\nSuppose you have a list of users with their respective activity counts, and\nyou want to sort them alphabetically.\n\n\n### Example data\n```json\n{ \"user\": \"Maria\", \"activity_count\": 3 },\n{ \"user\": \"Chris\", \"activity_count\": 8 },\n{ \"user\": \"Dave\",  \"activity_count\": 15 }\n\n```\n\n### Example query\n```dataprime\norderby user asc\n\n```\n\n### Example output\n\n```json\n{ \"user\": \"Chris\", \"activity_count\": 8 },\n{ \"user\": \"Dave\",  \"activity_count\": 15 },\n{ \"user\": \"Maria\", \"activity_count\": 3 }\n```\n\n\n## Example 2\n\n\nSorting alphabetically (`asc`) arranges values from A to Z. To sort by\nactivity count instead, you can provide an expression and direction:\n\n\n\n### Example query\n```dataprime\norderby activity_count desc\n\n```\n\n### Example output\n\n```json\n{ \"user\": \"Chris\", \"activity_count\": 8 },\n{ \"user\": \"Dave\",  \"activity_count\": 5 },\n{ \"user\": \"Maria\", \"activity_count\": 3 }\n```\n\n!!! note\n    When sorting by numeric fields, ensure you cast them to `number` to avoid\n    lexicographic sorting:\n\n    ```dataprime\n    orderby my_num_field:number desc\n    ```\n\n\n\n"
  redact:
    description: "The `redact` command replaces parts of a string that match a given substring\nor regular expression with a replacement value. It’s commonly used to hide\nsensitive information such as emails, tokens, or identifiers found in message\nfields.\n\nYou can use either a plain string or a regular expression pattern to define\nwhat should be redacted.\n\n!!! note\n    The optional keyword `matching` improves readability but is not required.\n"
    syntax: "redact <keypath> [matching] /<regular-expression>/ to '<redacted_str>'\n\nredact <keypath> [matching] <string> to '<redacted_str>'\n"
    category: [Commands reference, redact]
    content: "\n# `redact`\n\n## Description\n\n\nThe `redact` command replaces parts of a string that match a given substring\nor regular expression with a replacement value. It’s commonly used to hide\nsensitive information such as emails, tokens, or identifiers found in message\nfields.\n\nYou can use either a plain string or a regular expression pattern to define\nwhat should be redacted.\n\n!!! note\n    The optional keyword `matching` improves readability but is not required.\n\n\n## Syntax\n\n```dataprime\nredact <keypath> [matching] /<regular-expression>/ to '<redacted_str>'\n\nredact <keypath> [matching] <string> to '<redacted_str>'\n\n```\n\n## Example\n\n\n**Use case: Remove sensitive email addresses from log messages**\n\nSensitive information often appears in free-text fields like `msg`. The\n`redact` command helps ensure data privacy by substituting these details with\na placeholder string.\n\n\n### Example data\n```json\n{ \"msg\": \"User chris with email chris@coralogix.com just signed in!\" },\n{ \"msg\": \"Support contact: help@coralogix.com\" }\n\n```\n\n### Example query\n```dataprime\nredact msg matching /[a-z0-9][+@coralogix.com](https://coralogix.com/docs/dataprime/language-reference/commands-reference/mailto:+@coralogix.com)/ to 'REDACTED'\n\n```\n\n### Example output\n\n```json\n{ \"msg\": \"User chris with email REDACTED just signed in!\" },\n{ \"msg\": \"Support contact: REDACTED\" }\n```\n\nThe `redact` command scans each string in `msg`, finds patterns matching the\ngiven regular expression, and replaces them with the literal `'REDACTED'`.\n\n!!! note\n    You can also redact by an exact substring instead of a regex:\n\n    ```dataprime\n    redact msg matching \"coralogix.com\" to \"[DOMAIN HIDDEN]\"\n    ```\n\n\n\n"
  remove:
    description: "The `remove` command deletes one or more keypaths from every document in the\nworking set. It is the inverse of `choose`, which keeps only the specified\nfields.\n\nThis is especially useful for sanitizing logs or removing fields containing\nunnecessary or sensitive information before performing analysis.\n\n!!! note\n    `remove` can operate on scalar values or entire objects.\n"
    syntax: "'r|remove <keypath1> [ \",\" <keypath2> ]...'\n"
    category: [Commands reference, remove]
    content: "\n# `remove`\n\n## Description\n\n\nThe `remove` command deletes one or more keypaths from every document in the\nworking set. It is the inverse of `choose`, which keeps only the specified\nfields.\n\nThis is especially useful for sanitizing logs or removing fields containing\nunnecessary or sensitive information before performing analysis.\n\n!!! note\n    `remove` can operate on scalar values or entire objects.\n\n\n## Syntax\n\n```dataprime\n'r|remove <keypath1> [ \",\" <keypath2> ]...'\n\n```\n\n## Example\n\n\n**Use case: Remove personal data from logs**\n\nSuppose your dataset includes user information, and you need to remove the\n`email` field for privacy reasons before further processing.\n\n\n### Example data\n```json\n{\n    \"username\": \"chris\",\n    \"email\": \"chris@coralogix.com\",\n    \"location\": \"UK\",\n    \"domain\": \"chris.com\"\n}\n\n```\n\n### Example query\n```dataprime\nremove email\n\n```\n\n### Example output\n\n```json\n{\n    \"username\": \"chris\",\n    \"location\": \"UK\",\n    \"domain\": \"chris.com\"\n}\n```\n\nThe `remove` command eliminates the `email` keypath and its value from each\ndocument, leaving all other fields intact.\n\n\n\n"
  replace:
    description: "The `replace` command overwrites the value of an existing keypath with the\nresult of a new expression. It is often used to clean or transform existing\nvalues while maintaining the same document structure.\n\nThis is particularly helpful for decoding, normalizing, or updating data\nfields without creating new keys.\n"
    syntax: "replace <keypath> with <expression>\n"
    category: [Commands reference, replace]
    content: "\n# `replace`\n\n## Description\n\n\nThe `replace` command overwrites the value of an existing keypath with the\nresult of a new expression. It is often used to clean or transform existing\nvalues while maintaining the same document structure.\n\nThis is particularly helpful for decoding, normalizing, or updating data\nfields without creating new keys.\n\n\n## Syntax\n\n```dataprime\nreplace <keypath> with <expression>\n\n```\n\n## Example\n\n\n**Use case: Decode URL-encoded query parameters**\n\nSuppose you have a nested field containing URL-encoded values. You can use\n`replace` with a decoding function to update the existing keypath directly.\n\n\n### Example data\n```json\n{\n  \"domain\": \"https://www.coralogix.com\",\n  \"query_string\": \"a=b&b=c&c=d\",\n  \"path\": \"/home\",\n  \"query_string_parameters\": {\n    \"name\": \"Tom%20Kosman\",\n    \"b\": \"c\",\n    \"c\": \"d\"\n  }\n}\n\n```\n\n### Example query\n```dataprime\nreplace query_string_parameters.name with query_string_parameters.name.urlDecode()\n\n```\n\n### Example output\n\n```json\n{\n  \"domain\": \"https://www.coralogix.com\",\n  \"query_string\": \"a=b&b=c&c=d\",\n  \"path\": \"/home\",\n  \"query_string_parameters\": {\n    \"name\": \"Tom Kosman\",\n    \"b\": \"c\",\n    \"c\": \"d\"\n  }\n}\n```\n\nThe `replace` command applies the transformation defined in the expression and\nupdates the specified keypath in place. The original encoded value is replaced\nwith its decoded equivalent.\n\n\n\n"
  stitch:
    description: "The `stitch` command performs a **horizontal union** of two datasets,\ncombining them side-by-side. It aligns rows from one dataset with rows from\nanother and merges their columns into a single unified dataset.\n\nThis is particularly useful for joining datasets that share a logical order\nbut lack a join key.\n\n**Key behaviors:**\n\n- Rows are combined in order (row 1 with row 1, row 2 with row 2, etc.).\n- If one dataset contains more rows than the other, unmatched rows include\n  `null` values for missing columns.\n- The resulting dataset contains all columns from both sides.\n\n**Difference from `union`:**\n\n- `stitch` merges datasets horizontally (adding columns).\n- `union` merges datasets vertically (adding rows).\n"
    syntax: "stitch (<subquery>) into <target-keypath>\n"
    category: [Commands reference, stitch]
    content: "\n# `stitch`\n\n## Description\n\n\nThe `stitch` command performs a **horizontal union** of two datasets,\ncombining them side-by-side. It aligns rows from one dataset with rows from\nanother and merges their columns into a single unified dataset.\n\nThis is particularly useful for joining datasets that share a logical order\nbut lack a join key.\n\n**Key behaviors:**\n\n- Rows are combined in order (row 1 with row 1, row 2 with row 2, etc.).\n- If one dataset contains more rows than the other, unmatched rows include\n  `null` values for missing columns.\n- The resulting dataset contains all columns from both sides.\n\n**Difference from `union`:**\n\n- `stitch` merges datasets horizontally (adding columns).\n- `union` merges datasets vertically (adding rows).\n\n\n## Syntax\n\n```dataprime\nstitch (<subquery>) into <target-keypath>\n\n```\n\n## Example 1\n\n\n**Use case: Merge sales and revenue data side-by-side**\n\nSuppose you have two datasets-`sales` and `revenue`-that contain related\ninformation about products. You can use `stitch` to combine them horizontally\ninto a single document per product, provided both datasets are ordered\nconsistently.\n\n\n### Example data\n```json\n\\\\ sales\n{ \"product\": \"Widget\", \"sales\": 100 },\n{ \"product\": \"Gadget\", \"sales\": 200 },\n{ \"product\": \"Dashboard\", \"sales\": 150 }\n\n\\\\ revenue\n{ \"product\": \"Widget\", \"revenue\": 5000 },\n{ \"product\": \"Gadget\", \"revenue\": 8000 },\n{ \"product\": \"Dashboard\", \"revenue\": 6000 }\n\n```\n\n### Example query\n```dataprime\nsource sales\n| orderby product\n| stitch (source revenue | orderby product) into combined_data\n\n```\n\n### Example output\n\n```json\n{ \"product\": \"Widget\", \"sales\": 100, \"combined_data\": { \"product\": \"Widget\", \"revenue\": 5000 } },\n{ \"product\": \"Gadget\", \"sales\": 200, \"combined_data\": { \"product\": \"Gadget\", \"revenue\": 8000 } },\n{ \"product\": \"Dashboard\", \"sales\": 150, \"combined_data\": { \"product\": \"Dashboard\", \"revenue\": 6000 } }\n```\n\nThe `stitch` command aligns rows based on their order after sorting and\nattaches the right dataset (`revenue`) into the target keypath\n(`combined_data`) within the left dataset (`sales`).\n\n!!! note\n    If the datasets have differing row counts, missing values from the shorter\n    dataset are replaced with `null`:\n\n\n## Example 2\n\n\nIf the datasets have unequal rows, the stitch command fills missing values with null.\n\nConsider the following datasets:\n\nsales dataset: (3 rows)\n\n```json\n{ \"product\": \"Widget\", \"sales\": 100 }\n{ \"product\": \"Gadget\", \"sales\": 200 }\n{ \"product\": \"Dashboard\", \"sales\": 150 }\n```\n\nrevenue dataset: (2 rows)\n```json\n{ \"product\": \"Widget\", \"revenue\": 5000 }\n{ \"product\": \"Gadget\", \"revenue\": 8000 }\n```\n\n\n\n### Example query\n```dataprime\nsource sales | orderby product\n| stitch (source revenue | orderby product) into combined_data\n\n```\n\n### Example output\n\n```json\n{ \"product\": \"Widget\", \"sales\": 100, \"combined_data\": { \"product\": \"Widget\", \"revenue\": 5000 } }\n{ \"product\": \"Gadget\", \"sales\": 200, \"combined_data\": { \"product\": \"Gadget\", \"revenue\": 8000 } }\n{ \"product\": \"Dashboard\", \"sales\": 150, \"combined_data\": { \"product\": \"Dashboard\", \"revenue\": null } }\n```\n\n!!! note\n    Rows must represent the same entities and appear in the same order for\n    meaningful stitching. If row alignment differs, results may not match as\n    expected.\n\n\n\n"
  top:
    description: "The `top` command is an aggregation operator that limits the data returned to\nthe first N rows based on an ordering expression. It is particularly useful\nfor identifying the most frequent or highest-ranking values within a dataset.\n\n!!! note\n    - Without grouping, `top` limits the full result set to N rows, ordered by a given expression.\n    - With grouping, it applies the same logic but within each group, returning the top N results per group.\n    - Sorting direction (ascending/descending) is determined by the expression or implicit aggregate ordering.\n"
    syntax: "top <limit> <result_expression1> [as <alias>] [, <result_expression2> [as\n<alias2>], ...] by <orderby_expression> [as <alias>]\n"
    category: [Commands reference, top]
    content: "\n# `top`\n\n## Description\n\n\nThe `top` command is an aggregation operator that limits the data returned to\nthe first N rows based on an ordering expression. It is particularly useful\nfor identifying the most frequent or highest-ranking values within a dataset.\n\n!!! note\n    - Without grouping, `top` limits the full result set to N rows, ordered by a given expression.\n    - With grouping, it applies the same logic but within each group, returning the top N results per group.\n    - Sorting direction (ascending/descending) is determined by the expression or implicit aggregate ordering.\n\n\n## Syntax\n\n```dataprime\ntop <limit> <result_expression1> [as <alias>] [, <result_expression2> [as\n<alias2>], ...] by <orderby_expression> [as <alias>]\n\n```\n\n## Example 1\n\n\n**Use case: Identify the most active users by event count**\n\nThe `top` command can be used to return only the N most active usernames by\ncounting how frequently each appears in log data.\n\n\n### Example data\n```json\n{ \"user\": \"Ariel\", \"action\": \"login\", \"time_taken_ms\": 50 },\n{ \"user\": \"Harel\", \"action\": \"logout\", \"time_taken_ms\": 500 },\n{ \"user\": \"Maya\", \"action\": \"login\", \"time_taken_ms\": 180 },\n{ \"user\": \"Ariel\", \"action\": \"browse\", \"time_taken_ms\": 200 },\n{ \"user\": \"Harel\", \"action\": \"login\", \"time_taken_ms\": 90 }\n\n```\n\n### Example query\n```dataprime\ntop 10 user by count()\n\n```\n\n### Example output\n\n| user | _count |\n| --- | --- |\n| Ariel | 2 |\n| Harel | 2 |\n| Maya | 1 |\n\n\n## Example 2\n\n\n**Use case: Get the slowest user interactions per action**\n\nBy grouping and ordering data by `action` and `user`, the `top` command can\nreturn only the longest-duration interactions in each group.\n\n\n### Example data\n```json\n{ \"user\": \"Ariel\", \"action\": \"login\", \"time_taken_ms\": 50 },\n{ \"user\": \"Harel\", \"action\": \"logout\", \"time_taken_ms\": 500 },\n{ \"user\": \"Ariel\", \"action\": \"browse\", \"time_taken_ms\": 200 },\n{ \"user\": \"Maya\", \"action\": \"login\", \"time_taken_ms\": 150 },\n{ \"user\": \"Harel\", \"action\": \"browse\", \"time_taken_ms\": 250 }\n\n```\n\n### Example query\n```dataprime\ntop 5 time_taken_ms by action, user\n\n```\n\n### Example output\n\n```json\n{ \"action\": \"logout\", \"user\": \"Harel\", \"time_taken_ms\": 500 },\n{ \"action\": \"browse\", \"user\": \"Harel\", \"time_taken_ms\": 250 },\n{ \"action\": \"browse\", \"user\": \"Ariel\", \"time_taken_ms\": 200 },\n{ \"action\": \"login\", \"user\": \"Maya\", \"time_taken_ms\": 150 },\n{ \"action\": \"login\", \"user\": \"Ariel\", \"time_taken_ms\": 50 }\n```\n\n\n\n"
  union:
    description: "The `union` command concatenates the results from two or more datasets into\none dataset. This allows users to combine results from multiple queries into\none seamless dataset. One dataset can be a result set piped into the `union`\ncommand and then concatenated with another dataset.\n"
    syntax: "<query> | union (<query>)"
    category: [Commands reference, union]
    content: "\n# `union`\n\n## Description\n\n\nThe `union` command concatenates the results from two or more datasets into\none dataset. This allows users to combine results from multiple queries into\none seamless dataset. One dataset can be a result set piped into the `union`\ncommand and then concatenated with another dataset.\n\n\n## Syntax\n\n```dataprime\n<query> | union (<query>)\n```\n\n## Example\n\n\nCombine logs from two different teams into a single dataset to analyze them\ntogether.\n\n\n### Example data\n```json\n// Logs for Team 58942\n{ \"id\": \"111\", \"name\": \"John\" , \"team.id\": \"58942\" }\n{ \"id\": \"222\", \"name\": \"Emily\", \"team.id\": \"58942\" }\n{ \"id\": \"333\", \"name\": \"Alice\", \"team.id\": \"58942\" }\n\n// Logs for Team 98361\n{ \"userid\": \"111\", \"timestamp\": \"2022-01-01T12:00:00Z\", \"team.id\": \"98361\" }\n{ \"userid\": \"111\", \"timestamp\": \"2022-01-01T12:30:00Z\", \"team.id\": \"98361\" }\n{ \"userid\": \"222\", \"timestamp\": \"2022-01-01T13:00:00Z\", \"team.id\": \"98361\" }\n{ \"userid\": \"222\", \"timestamp\": \"2022-01-01T13:00:00Z\", \"team.id\": \"98361\" }\n{ \"userid\": \"222\", \"timestamp\": \"2022-01-01T13:00:00Z\", \"team.id\": \"98361\" }\n\n```\n\n### Example query\n```dataprime\nsource logs(teamId='58942')\n| union (source logs(teamId='98361'))\n\n```\n\n### Example output\n\n```json\n{ \"id\": \"111\", \"name\": \"John\" , \"team.id\": \"58942\" }\n{ \"id\": \"222\", \"name\": \"Emily\", \"team.id\": \"58942\" }\n{ \"id\": \"333\", \"name\": \"Alice\", \"team.id\": \"58942\" }\n{ \"userid\": \"111\", \"timestamp\": \"2022-01-01T12:00:00Z\", \"team.id\": \"98361\" }\n{ \"userid\": \"111\", \"timestamp\": \"2022-01-01T12:30:00Z\", \"team.id\": \"98361\" }\n{ \"userid\": \"222\", \"timestamp\": \"2022-01-01T13:00:00Z\", \"team.id\": \"98361\" }\n{ \"userid\": \"222\", \"timestamp\": \"2022-01-01T13:00:00Z\", \"team.id\": \"98361\" }\n{ \"userid\": \"222\", \"timestamp\": \"2022-01-01T13:00:00Z\", \"team.id\": \"98361\" }\n```\n\n\n\n"
  wildfind:
    description: "The `wildfind` command searches for a given string across **all keypaths** in\nevery document in the working set. It is useful when you don’t know which\nfield contains the target value.\n\nThe alias `wildtext` behaves identically.\n\n!!! note\n    `wildfind` is significantly slower than `find` or `text`, since it must\n    inspect every field in every document. Use `find` when the keypath is\n    known for better performance.\n"
    syntax: "(wildfind|wildtext) <string>"
    category: [Commands reference, wildfind / wildtext]
    content: "\n# `wildfind / wildtext`\n\n## Description\n\n\nThe `wildfind` command searches for a given string across **all keypaths** in\nevery document in the working set. It is useful when you don’t know which\nfield contains the target value.\n\nThe alias `wildtext` behaves identically.\n\n!!! note\n    `wildfind` is significantly slower than `find` or `text`, since it must\n    inspect every field in every document. Use `find` when the keypath is\n    known for better performance.\n\n\n## Syntax\n\n```dataprime\n(wildfind|wildtext) <string>\n```\n\n## Example\n\n\n**Use case: Locate an IP address anywhere in a document**\n\nWhen you’re unsure which field contains a specific value (such as an IP\naddress), `wildfind` can search across all keypaths and return any document\ncontaining that value.\n\n\n### Example data\n```json\n{ \"msg\": \"User with IP 10.10.10.10 logged in\", \"msg_field\": \"7.8.4.120 logged in\" },\n{ \"message\": \"User with IP 192.168.0.42 changed password\", \"txt\": \"7.8.4.120 updated profile picture\" },\n{ \"txt_msg\": \"User with IP 7.8.4.120 accessed page\" },\n{ \"body\": \"User with IP 7.8.4.120 logged out\" }\n\n```\n\n### Example query\n```dataprime\nwildfind '7.8.4.120'\n\n```\n\n### Example output\n\n```json\n{ \"txt_msg\": \"User with IP 7.8.4.120 accessed page\" },\n{ \"body\": \"User with IP 7.8.4.120 logged out\" }\n```\n\nThe `wildfind` command scans every field of each document and returns all\nthose containing the search string. In this example, all documents include the\nIP address, so all are returned.\n\n!!! note\n    Use `find` or `text` when you know the keypath (e.g. `find '7.8.4.120' in msg`) for faster performance.\n\n\n\n"
functions:
  any_value:
    description: "Returns any non-null value from the specified expression within a group.\nIf no expression is provided, it defaults to the `$d` object.\n\nReturns `null` if all values in the group are `null`.\n"
    syntax: "any_value(expression: any?): any\n"
    category: [Functions reference, Aggregration, any_value]
    content: "\n\n# `any_value`\n\n## Description\n\n\nReturns any non-null value from the specified expression within a group.\nIf no expression is provided, it defaults to the `$d` object.\n\nReturns `null` if all values in the group are `null`.\n\n\n## Syntax\n\n```dataprime\nany_value(expression: any?): any\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | expression | any | **false** | Expression to evaluate. Defaults to `$d`. |\n\n## Example\n\n\n**Use case: Select any non-null username from a group of documents**\n\nSuppose you want to group documents by team and retrieve any available username.\n\n\n### Example data\n```json\n{\n    \"userId\": 1,\n    \"team\": \"A Team\",\n    \"username\": null\n},\n{\n    \"userId\": 2,\n    \"team\": \"A Team\",\n    \"username\": \"Ryan\"\n},\n{\n    \"userId\": 3,\n    \"team\": \"A Team\",\n    \"username\": \"Anastasia\"\n}\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby team aggregate any_value(username) as random_username\n\n```\n\n### Example output\n\nThe output may vary depending on the order in which documents are processed:\n\n```json\n{\n\"team\": \"A Team\",\n\"random_username\": \"Ryan\"\n}\n```\n\n\n"
  approx_count_distinct:
    description: "Returns an approximate count of unique, non-null values for a given expression.\n\n* A document is counted if it contains a unique, non-null value.\n* The result is approximate, optimized for performance rather than precision.\n\n!!! note\n    `approx_count_distinct` is an aggregation function and must be used with a grouping keyword such as `groupby`.\n"
    syntax: "approx_count_distinct(expression: any): number\n"
    category: [Functions reference, Aggregration, approx_count_distinct]
    content: "\n\n# `approx_count_distinct`\n\n## Description\n\n\nReturns an approximate count of unique, non-null values for a given expression.\n\n* A document is counted if it contains a unique, non-null value.\n* The result is approximate, optimized for performance rather than precision.\n\n!!! note\n    `approx_count_distinct` is an aggregation function and must be used with a grouping keyword such as `groupby`.\n\n\n## Syntax\n\n```dataprime\napprox_count_distinct(expression: any): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | expression | any | **true** | Expression whose unique, non-null values are counted approximately |\n\n## Example\n\n\n**Use case: Estimate the number of active users per application**\n\nSuppose you want to know how many unique users have been active in a given timeframe.\nSince you only care whether the number is above a threshold, an approximate count is sufficient.\n\n\n### Example data\n```json\n{ \"applicationname\": \"checkout-service\", \"username\": \"alice\" },\n{ \"applicationname\": \"checkout-service\", \"username\": \"bob\" },\n{ \"applicationname\": \"checkout-service\", \"username\": \"charlie\" },\n{ \"applicationname\": \"checkout-service\", \"username\": \"alice\" }\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby $l.applicationname aggregate approx_count_distinct($d.username) as active_users\n\n```\n\n### Example output\n\n| applicationname | active_users |\n| --- | --- |\n| checkout-service | 3 |\n\n\n"
  avg:
    description: "Returns the average (mean) value of a numerical expression.\n\n!!! note\n    The input must be a number. Use a cast if the field is stored as a string.\n"
    syntax: "avg(expression: number): number\n"
    category: [Functions reference, Aggregration, avg]
    content: "\n\n# `avg`\n\n## Description\n\n\nReturns the average (mean) value of a numerical expression.\n\n!!! note\n    The input must be a number. Use a cast if the field is stored as a string.\n\n\n## Syntax\n\n```dataprime\navg(expression: number): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | expression | number | **true** | Expression that evaluates to a number |\n\n## Example\n\n\n**Use case: Compute the average HTTP request latency per path**\n\nSuppose you want to calculate the average request duration for each URL path in your logs.\n\n\n### Example data\n```json\n{ \"path\": \"/home\", \"duration\": 400 },\n{ \"path\": \"/home\", \"duration\": 600 },\n{ \"path\": \"/login\", \"duration\": 200 }\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby $d.path aggregate avg($m.duration) as average_duration_for_path\n\n```\n\n### Example output\n\n| path | average_duration_for_path |\n| --- | --- |\n| /home | 500 |\n| /login | 200 |\n\n\n"
  collect:
    description: "Returns an array of values collected from an expression for each group.\n\n* Supports optional deduplication (`distinct`), null filtering (`ignoreNulls`), and element limits (`limit`).\n* Values are aggregated into an array, preserving order of processing unless constrained by `distinct` or `limit`.\n"
    syntax: "collect(expression: T, distinct: bool?, limit: number?, ignoreNulls: bool?): array<T>\n"
    category: [Functions reference, Aggregration, collect]
    content: "\n\n# `collect`\n\n## Description\n\n\nReturns an array of values collected from an expression for each group.\n\n* Supports optional deduplication (`distinct`), null filtering (`ignoreNulls`), and element limits (`limit`).\n* Values are aggregated into an array, preserving order of processing unless constrained by `distinct` or `limit`.\n\n\n## Syntax\n\n```dataprime\ncollect(expression: T, distinct: bool?, limit: number?, ignoreNulls: bool?): array<T>\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | expression | T | **true** | The value to collect into the array |    | distinct | boolean | **false** | If `true`, only unique values are collected. Literal only. Defaults to `false` |    | limit | number | **false** | Maximum number of values to collect. Must be a positive literal |    | ignoreNulls | boolean | **false** | If `true`, `null` values are skipped. Literal only. Defaults to `false` |\n\n## Example\n\n\n**Use case: Collect distinct container names per application**\n\nSuppose you want to gather all unique container names for each application from your Kubernetes logs.\n\n\n### Example data\n```json\n{ \"applicationname\": \"checkout-service\", \"kubernetes\": { \"container_name\": \"c1\" } },\n{ \"applicationname\": \"checkout-service\", \"kubernetes\": { \"container_name\": \"c1\" } },\n{ \"applicationname\": \"checkout-service\", \"kubernetes\": { \"container_name\": \"c2\" } }\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby $l.applicationname aggregate collect(kubernetes.container_name, distinct = true) as containers\n\n```\n\n### Example output\n\n| applicationname | containers |\n| --- | --- |\n| checkout-service | [ \"c1\", \"c2\" ]\n\n\n"
  count_if:
    description: "Returns the number of rows that satisfy a given condition, counting only non-null expression values.\n\n* Useful for measuring subsets of data within groups.\n* Can evaluate a condition alone or in combination with a non-null expression.\n\n!!! note\n    `count_if` is an aggregation function and must be used with a grouping keyword such as `groupby`.\n"
    syntax: "count_if(condition: bool, expression: any?): number\n"
    category: [Functions reference, Aggregration, count_if]
    content: "\n\n# `count_if`\n\n## Description\n\n\nReturns the number of rows that satisfy a given condition, counting only non-null expression values.\n\n* Useful for measuring subsets of data within groups.\n* Can evaluate a condition alone or in combination with a non-null expression.\n\n!!! note\n    `count_if` is an aggregation function and must be used with a grouping keyword such as `groupby`.\n\n\n## Syntax\n\n```dataprime\ncount_if(condition: bool, expression: any?): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | condition | boolean | **true** | Boolean expression indicating whether the row should be counted |    | expression | any | **false** | Optional expression. If provided, only non-null values are counted |\n\n## Example\n\n\n**Use case: Count high-duration HTTP requests per operation**\n\nSuppose you want to count requests where the duration exceeds 500 ms, grouped by operation name.\n\n\n### Example data\n```json\n{ \"operationName\": \"scheduledEvent\", \"duration\": 567 },\n{ \"operationName\": \"HipsterShop\", \"duration\": 512 },\n{ \"operationName\": \"login\", \"duration\": 33 }\n{ \"operationName\": \"HipsterShop\", \"duration\": 744 },\n\n```\n\n\n### Example query\n\n```dataprime\nsource spans\n| groupby $l.operationName aggregate count_if($m.duration > 500) as high_duration_request_count\n\n```\n\n### Example output\n\n| operationName | high_duration_request_count |\n| --- | --- |\n| scheduledEvent | 1 |\n| HipsterShop | 2 |\n\n\n"
  distinct_count_if:
    description: "Returns the number of distinct, non-null values that satisfy a given condition.\n\n* A document is counted only if the condition evaluates to `true`.\n* Duplicate values for the same expression are counted once per group.\n\n!!! note\n    `distinct_count_if` is an aggregation function and must be used with a grouping keyword such as `groupby`.\n"
    syntax: "distinct_count_if(condition: bool, expression: any): number\n"
    category: [Functions reference, Aggregration, distinct_count_if]
    content: "\n\n# `distinct_count_if`\n\n## Description\n\n\nReturns the number of distinct, non-null values that satisfy a given condition.\n\n* A document is counted only if the condition evaluates to `true`.\n* Duplicate values for the same expression are counted once per group.\n\n!!! note\n    `distinct_count_if` is an aggregation function and must be used with a grouping keyword such as `groupby`.\n\n\n## Syntax\n\n```dataprime\ndistinct_count_if(condition: bool, expression: any): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | condition | boolean | **true** | Boolean expression indicating whether the row should be counted |    | expression | any | **true** | Expression whose unique, non-null values are counted |\n\n## Example\n\n\n**Use case: Count users who have experienced errors**\n\nSuppose you want to count how many unique users encountered an error for each application.\nHere, an error is defined as a log with `$m.severity == ERROR`.\n\n\n### Example data\n```json\n{ \"applicationname\": \"checkout-service\", \"username\": \"alice\", \"severity\": \"Error\" },\n{ \"applicationname\": \"pager\", \"username\": \"bob\", \"severity\": \"Info\" },\n{ \"applicationname\": \"checkout-service\", \"username\": \"alice\", \"severity\": \"Error\" },\n{ \"applicationname\": \"checkout-service\", \"username\": \"charlie\", \"severity\": \"Error\" }\n{ \"applicationname\": \"pager\", \"username\": \"bob\", \"severity\": \"Error\" }\n{ \"applicationname\": \"checkout-service\", \"username\": \"charlie\", \"severity\": \"Error\" }\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby $l.applicationname aggregate distinct_count_if($m.severity == ERROR, $d.username) as users_with_errors\n\n```\n\n### Example output\n\n| applicationname | users_with_errors |\n| --- | --- |\n| checkout-service | 2 |\n| pager | 1 |\n\n\n"
  distinct_count:
    description: "Returns the number of distinct, non-null values for a given expression.\n\n* Each unique value is counted once per group.\n\n!!! note\n    `distinct_count` is an aggregation function and must be used with a grouping keyword such as `groupby`.\n"
    syntax: "distinct_count(expression: any): number\n"
    category: [Functions reference, Aggregration, distinct_count]
    content: "\n\n# `distinct_count`\n\n## Description\n\n\nReturns the number of distinct, non-null values for a given expression.\n\n* Each unique value is counted once per group.\n\n!!! note\n    `distinct_count` is an aggregation function and must be used with a grouping keyword such as `groupby`.\n\n\n## Syntax\n\n```dataprime\ndistinct_count(expression: any): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | expression | any | **true** | Expression whose unique, non-null values are counted |\n\n## Example\n\n\n**Use case: Count active users per application**\n\nSuppose you want to know how many unique users have been active in a given timeframe.\n\n\n### Example data\n```json\n{ \"applicationname\": \"checkout-service\", \"username\": \"alice\" },\n{ \"applicationname\": \"checkout-service\", \"username\": \"bob\" },\n{ \"applicationname\": \"checkout-service\", \"username\": \"alice\" }\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby $l.applicationname aggregate distinct_count($d.username) as active_users\n\n```\n\n### Example output\n\n| applicationname | active_users |\n| --- | --- |\n| checkout-service | 2 |\n\n\n"
  max:
    description: "Returns the largest numerical value from the input.\n\n* Can be used in aggregation to compute the maximum value across grouped rows.\n* When used with multiple arguments, returns the largest among them.\n"
    syntax: "max(value: number, ...values: number): number\n"
    category: [Functions reference, Aggregration, max]
    content: "\n\n# `max`\n\n## Description\n\n\nReturns the largest numerical value from the input.\n\n* Can be used in aggregation to compute the maximum value across grouped rows.\n* When used with multiple arguments, returns the largest among them.\n\n\n## Syntax\n\n```dataprime\nmax(value: number, ...values: number): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | number | **true** | The first numerical value to compare |    | ...values | number | **true** | One or more additional numerical values to compare |\n\n## Example\n\n\n**Use case: Find the largest latency per path**\n\nSuppose you want to identify which traces in your logs have the highest duration.\n\n\n### Example data\n```json\n{ \"applicationName\": \"checkout\", \"duration\": 50174000 },\n{ \"applicationName\": \"checkout\", \"duration\": 42000000 },\n{ \"applicationName\": \"web-app\", \"duration\": 39151233 },\n{ \"applicationName\": \"web-app\", \"duration\": 35000000 },\n{ \"applicationName\": \"checkly-browser-check\", \"duration\": 25269000 },\n{ \"applicationName\": \"docs\", \"duration\": 17260981 },\n{ \"applicationName\": \"notifications\", \"duration\": 8000000 },\n{ \"applicationName\": \"search\", \"duration\": 15000000 },\n{ \"applicationName\": \"auth-service\", \"duration\": 9000000 },\n{ \"applicationName\": \"auth-service\", \"duration\": 7000000 }\n\n```\n\n\n### Example query\n\n```dataprime\nsource spans\n| top 10 $l.applicationName by max($m.duration) \n\n```\n\n### Example output\n\n| applicationName | _max0 |\n| --- | --- |\n| checkout | 50174000 |\n| web-app | 39151233 |\n| checkly-browser-check | 25269000 |\n| docs | 17260981 |\n\n\n"
  max_by:
    description: "Returns the value of an expression associated with the maximum value of a given sort key.\n\n* Both `sortKey` and `expression` must be comparable types (`string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, or `enum`).\n* Useful for retrieving details from the row that has the maximum value of another field.\n"
    syntax: "max_by(sortKey: T, expression: U): U\n"
    category: [Functions reference, Aggregration, max_by]
    content: "\n\n# `max_by`\n\n## Description\n\n\nReturns the value of an expression associated with the maximum value of a given sort key.\n\n* Both `sortKey` and `expression` must be comparable types (`string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, or `enum`).\n* Useful for retrieving details from the row that has the maximum value of another field.\n\n\n## Syntax\n\n```dataprime\nmax_by(sortKey: T, expression: U): U\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | sortKey | T | **true** | Field to maximize. Must be `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, or `enum` |    | expression | U | **true** | Value to return from the row with the maximum `sortKey`. Must be a comparable type |\n\n## Example\n\n\n**Use case: Retrieve details of the latest event per user**\n\nSuppose you want to know the last activity performed by each user. You can use `max` to compute the latest timestamp and `max_by` to extract the associated details.\n\n\n### Example data\n```json\n{ \"username\": \"chris\", \"path\": \"/home\", \"latency\": 320, \"ts\": 1728919749261000000 },\n{ \"username\": \"chris\", \"path\": \"/checkout\", \"latency\": 5000, \"ts\": 1728919759261000000 }\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby username aggregate max(ts) as ts, max_by(ts, path) as path\n\n```\n\n### Example output\n\n| username | path | ts |\n| --- | --- | --- |\n| chris | /checkout | 1728919759261000000 |\n\n\n"
  min:
    description: "Returns the smallest numerical value from the input.\n\n* Can be used in aggregation to compute the minimum value across grouped rows.\n* When used with multiple arguments, returns the smallest among them.\n"
    syntax: "min(value: number, ...values: number): number\n"
    category: [Functions reference, Aggregration, min]
    content: "\n\n# `min`\n\n## Description\n\n\nReturns the smallest numerical value from the input.\n\n* Can be used in aggregation to compute the minimum value across grouped rows.\n* When used with multiple arguments, returns the smallest among them.\n\n\n## Syntax\n\n```dataprime\nmin(value: number, ...values: number): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | number | **true** | The first numerical value to compare |    | ...values | number | **true** | One or more additional numerical values to compare |\n\n## Example\n\n\n**Use case: Find the quickest latency per path**\n\nSuppose you want to identify which spans have the shortest duration.\n\n\n### Example data\n```json\n{ \"applicationName\": \"default\", \"duration\": 4 },\n{ \"applicationName\": \"default\", \"duration\": 25 },\n{ \"applicationName\": \"074157727657\", \"duration\": 14 },\n{ \"applicationName\": \"074157727657\", \"duration\": 90 },\n{ \"applicationName\": \"streaming-platform\", \"duration\": 81 },\n{ \"applicationName\": \"web-app\", \"duration\": 1000 },\n{ \"applicationName\": \"docs\", \"duration\": 2000 },\n{ \"applicationName\": \"checkout\", \"duration\": 4500 },\n{ \"applicationName\": \"checkout\", \"duration\": 7000 },\n{ \"applicationName\": \"search\", \"duration\": 3200 }\n\n```\n\n\n### Example query\n\n```dataprime\nsource spans\n| bottom 10 $l.applicationName by min($m.duration) \n\n```\n\n### Example output\n\n|applicationName | _min0 |\n| --- | --- |\n|default | 4 |\n|074157727657 | 14 |\n|streaming-platform | 81 |\n|web-app | 1000 |\n|docs | 2000 |\n\n\n"
  min_by:
    description: "Returns the value of an expression associated with the minimum value of a given sort key.\n\n* Both `sortKey` and `expression` must be comparable types (`string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, or `enum`).\n* Useful for retrieving details from the row that has the earliest or smallest value of another field.\n"
    syntax: "min_by(sortKey: T, expression: U): U\n"
    category: [Functions reference, Aggregration, min_by]
    content: "\n\n# `min_by`\n\n## Description\n\n\nReturns the value of an expression associated with the minimum value of a given sort key.\n\n* Both `sortKey` and `expression` must be comparable types (`string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, or `enum`).\n* Useful for retrieving details from the row that has the earliest or smallest value of another field.\n\n\n## Syntax\n\n```dataprime\nmin_by(sortKey: T, expression: U): U\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | sortKey | T | **true** | Field to minimize. Must be `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, or `enum` |    | expression | U | **true** | Value to return from the row with the minimum `sortKey`. Must be a comparable type |\n\n## Example\n\n\n**Use case: Retrieve details of the earliest event per user**\n\nSuppose you want to know the first activity performed by each user. You can use `min` to compute the earliest timestamp and `min_by` to extract the associated details.\n\n\n### Example data\n```json\n{ \"username\": \"chris\", \"path\": \"/home\", \"latency\": 320, \"ts\": 1728919749261000000 },\n{ \"username\": \"chris\", \"path\": \"/checkout\", \"latency\": 5000, \"ts\": 1728919759261000000 }\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby username aggregate min(ts) as ts, min_by(ts, path) as path\n\n```\n\n### Example output\n\n| username | path | ts |\n| --- | --- | --- |\n| chris | /home | 1728919749261000000 |\n\n\n"
  percentile:
    description: "Returns the approximate n-th percentile of a numerical expression.\n\n* The percentile value must be between `0` and `1`.\n* The calculation is approximate, with accuracy controlled by the optional `error_threshold`.\n"
    syntax: "percentile(percentile: number, expression: number, error_threshold: number?): number\n"
    category: [Functions reference, Aggregration, percentile]
    content: "\n\n# `percentile`\n\n## Description\n\n\nReturns the approximate n-th percentile of a numerical expression.\n\n* The percentile value must be between `0` and `1`.\n* The calculation is approximate, with accuracy controlled by the optional `error_threshold`.\n\n\n## Syntax\n\n```dataprime\npercentile(percentile: number, expression: number, error_threshold: number?): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | percentile | number | **true** | Percentile to compute, between `0` and `1` |    | expression | number | **true** | Numerical expression whose percentile is calculated |    | error_threshold | number | **false** | Accuracy of approximation. Lower values are more accurate but slower. Defaults to `0.01` |\n\n## Example\n\n\n**Use case: Calculate the 99th percentile of trace durations**\n\nSuppose you want to compute the 99th percentile latency for Lambda function invocations.\n\n\n### Example data\n```json\n{ \"operationName\": \"Lambda.Invoke\", \"duration\": 95000 },\n{ \"operationName\": \"Lambda.Invoke\", \"duration\": 500000 },\n{ \"operationName\": \"Lambda.Invoke\", \"duration\": 1100000 },\n{ \"operationName\": \"Lambda.Invoke\", \"duration\": 1482000 },\n{ \"operationName\": \"CheckoutFlow\", \"duration\": 800000 }\n\n```\n\n\n### Example query\n\n```dataprime\nsource spans\n| filter $l.operationName == 'Lambda.Invoke'\n| groupby $l.operationName aggregate percentile(0.99, $m.duration) as p99_latency\n\n```\n\n### Example output\n\n| operationName | p99_latency |\n| --- | --- |\n| Lambda.Invoke | 1482198.478333334 |\n\n\n"
  sample_stddev:
    description: "Returns the sample standard deviation of a numerical expression within a group.\n\n* Designed for use cases where substantial values are missing, such as when data is heavily sampled.\n\n!!! note\n    Use `sample_stddev` when working with incomplete datasets (e.g., sampled trace data). For full datasets, prefer `stddev`.\n"
    syntax: "sample_stddev(expression: number): number\n"
    category: [Functions reference, Aggregration, sample_stddev]
    content: "\n\n# `sample_stddev`\n\n## Description\n\n\nReturns the sample standard deviation of a numerical expression within a group.\n\n* Designed for use cases where substantial values are missing, such as when data is heavily sampled.\n\n!!! note\n    Use `sample_stddev` when working with incomplete datasets (e.g., sampled trace data). For full datasets, prefer `stddev`.\n\n\n## Syntax\n\n```dataprime\nsample_stddev(expression: number): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | expression | number | **true** | Numerical expression whose sample standard deviation is computed |\n\n## Example\n\n\n**Use case: Calculate the standard deviation of API latency in trace data**\n\nTraces contain a `duration` field representing execution time. Computing its sample standard deviation helps you understand the variability of API performance even when data is incomplete.\n\n\n### Example data\n```json\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 1200 },\n{ \"operationName\": \"Scheduled Event\", \"duration\": 32000000 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 6400 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 10000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 60000 },\n{ \"operationName\": \"ScheduledEvent\", \"duration\": 6000000 },\n{ \"operationName\": \"OverloadTable\", \"duration\": 250000 },\n{ \"operationName\": \"DownloadInvoiceFunction\", \"duration\": 300000 },\n{ \"operationName\": \"MultipleServicesOverload\", \"duration\": 250000 },\n{ \"operationName\": \"index.lambda_handler\", \"duration\": 1000000 },\n{ \"operationName\": \"DatabaseErrors\", \"duration\": 800 },\n{ \"operationName\": \"DatabaseErrors\", \"duration\": 9500 },\n{ \"operationName\": \"index.lambda_handler\", \"duration\": 4000000 },\n{ \"operationName\": \"HeavyQueries\", \"duration\": 45000 },\n{ \"operationName\": \"HeavyQueries\", \"duration\": 120000 },\n{ \"operationName\": \"MultipleServicesOverload\", \"duration\": 12000 },\n{ \"operationName\": \"DownloadInvoiceFunction\", \"duration\": 90000 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 8900 },\n{ \"operationName\": \"OverloadTable\", \"duration\": 600000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 120000 }\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby $l.operationName aggregate sample_stddev($m.duration)\n\n```\n\n### Example output\n\n| OperationName | latency_stddev | \n| --- | --- |\n| MalfunctioningDatabase | 4361.089419616654 |\n| brokenPrinter | 47592.67857298488 |\n| Scheduled Event | 22761288.829728547 |\n| MultipleServicesOverload | 83147.67135079544 |\n| index.lambda_handler | 1638633.7355793486 |\n| DatabaseErrors | 4238.272307063378 |\n| HeavyQueries | 59570.23229162531 |\n| DownloadInvoiceFunction | 152958.53824168033 |\n| OverloadTable | 139481.44082183167 |\n\n\n"
  sample_variance:
    description: "Returns the sample variance of a numerical expression within a group.\n\n* Useful for analyzing variability when working with incomplete datasets.\n* Designed for scenarios like heavy trace sampling, where global variance would be misleading.\n\n!!! note\n    Use `sample_variance` when only a subset of data is available. For complete datasets, prefer `variance`.\n"
    syntax: "sample_variance(expression: number): number\n"
    category: [Functions reference, Aggregration, sample_variance]
    content: "\n\n# `sample_variance`\n\n## Description\n\n\nReturns the sample variance of a numerical expression within a group.\n\n* Useful for analyzing variability when working with incomplete datasets.\n* Designed for scenarios like heavy trace sampling, where global variance would be misleading.\n\n!!! note\n    Use `sample_variance` when only a subset of data is available. For complete datasets, prefer `variance`.\n\n\n## Syntax\n\n```dataprime\nsample_variance(expression: number): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | expression | number | **true** | Numerical expression whose sample variance is computed |\n\n## Example\n\n\n**Use case: Compute variance of trace durations**\n\nSuppose you want to calculate how much the duration of each operation varies across traces, even when the dataset is incomplete.\n\n\n### Example data\n```json\n{ \"operationName\": \"cart\", \"duration\": 50000 },\n{ \"operationName\": \"checkout\", \"duration\": 200000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 700000 },\n{ \"operationName\": \"SendOrderConfirmation\", \"duration\": 10200 },\n{ \"operationName\": \"cart\", \"duration\": 300000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 1000000 },\n{ \"operationName\": \"checkout\", \"duration\": 900000 },\n{ \"operationName\": \"cart\", \"duration\": 600000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 400000 },\n{ \"operationName\": \"SendOrderConfirmation\", \"duration\": 9950 },\n{ \"operationName\": \"checkout\", \"duration\": 1200000 },\n{ \"operationName\": \"cart\", \"duration\": 100000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 20000 },\n{ \"operationName\": \"SendOrderConfirmation\", \"duration\": 10050 },\n{ \"operationName\": \"checkout\", \"duration\": 1500000 },\n{ \"operationName\": \"cart\", \"duration\": 800000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 800000 },\n{ \"operationName\": \"checkout\", \"duration\": 500000 },\n{ \"operationName\": \"SendOrderConfirmation\", \"duration\": 10100 },\n{ \"operationName\": \"cart\", \"duration\": 400000 }\n\n```\n\n\n### Example query\n\n```dataprime\nsource spans\n| groupby $l.operationName aggregate sample_variance($m.duration) as duration_variance\n\n```\n\n### Example output\n\n| operationName | duration_variance |\n| --- | -- |\n| brokenPrinter | 56413398108.59468 |\n| cart | 70558342573.80327 |\n| checkout | 111286897989.06136 |\n| SendOrderConfirmation | 383221.0732801104 |\n\n\n"
  stddev:
    description: "Returns the standard deviation of a numerical expression within a group.\n\n* Useful for measuring how much values vary around the mean.\n* Best applied when a complete dataset is available (for sampled data, use `sample_stddev`).\n"
    syntax: "stddev(expression: number): number\n"
    category: [Functions reference, Aggregration, stddev]
    content: "\n\n# `stddev`\n\n## Description\n\n\nReturns the standard deviation of a numerical expression within a group.\n\n* Useful for measuring how much values vary around the mean.\n* Best applied when a complete dataset is available (for sampled data, use `sample_stddev`).\n\n\n## Syntax\n\n```dataprime\nstddev(expression: number): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | expression | number | **true** | Numerical expression whose standard deviation is computed |\n\n## Example\n\n\n**Use case: Calculate the standard deviation of API latency**\n\n  Traces contain a `duration` field representing execution time. Computing its standard deviation helps you understand the variability of API performance.\n\n\n### Example data\n```json\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 10100 },\n{ \"operationName\": \"checkout\", \"duration\": 350000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 20000 },\n{ \"operationName\": \"ScheduledEvent\", \"duration\": 1500000 },\n{ \"operationName\": \"checkout\", \"duration\": 100000 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 10050 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 400000 },\n{ \"operationName\": \"ScheduledEvent\", \"duration\": 900000 },\n{ \"operationName\": \"checkout\", \"duration\": 600000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 800000 },\n{ \"operationName\": \"ScheduledEvent\", \"duration\": 1200000 },\n{ \"operationName\": \"checkout\", \"duration\": 500000 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 9950 },\n{ \"operationName\": \"ScheduledEvent\", \"duration\": 500000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 1000000 },\n{ \"operationName\": \"checkout\", \"duration\": 250000 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 10000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 600000 },\n{ \"operationName\": \"ScheduledEvent\", \"duration\": 50000 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 9800 }\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby $m.operationName aggregate stddev($m.duration) as latency_stddev\n\n```\n\n### Example output\n\n| operationName | latency_stddev |\n| --- | --- |\n| checkout | 241610.80691335752 |\n| brokenPrinter | 279989.950525226 |\n| ScheduledEvent | 343380.2645421216 |\n| MalfunctioningDatabase | 554.8304396318806 |\n\n\n"
  sum:
    description: "Returns the total of all numerical values passed into the function.\n\n* Can be used in aggregation to compute totals across grouped rows.\n* When used with multiple arguments, returns the sum of all provided values.\n"
    syntax: "sum(value: number, ...values: number): number\n"
    category: [Functions reference, Aggregration, sum]
    content: "\n\n# `sum`\n\n## Description\n\n\nReturns the total of all numerical values passed into the function.\n\n* Can be used in aggregation to compute totals across grouped rows.\n* When used with multiple arguments, returns the sum of all provided values.\n\n\n## Syntax\n\n```dataprime\nsum(value: number, ...values: number): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | number | **true** | The first numerical value to add |    | ...values | number | **true** | One or more additional numerical values to add |\n\n## Example\n\n\n**Use case: Calculate total money spent per user**\n\nSuppose you want to compute the total amount of money spent by each user.\n\n\n### Example data\n```json\n{ \"user\": \"Chris\", \"product\": \"Sunglasses\", \"price\": 10 },\n{ \"user\": \"Chris\", \"product\": \"Car\", \"price\": 1000 },\n{ \"user\": \"Dave\", \"product\": \"Desk\", \"price\": 250 }\n\n```\n\n\n### Example query\n\n```dataprime\ntop 10 user by sum(price)\n\n```\n\n### Example output\n\n| user | sum_price |\n| --- | --- |\n| Chris | 1010 |\n| Dave | 250 |\n\n\n"
  variance:
    description: "Returns the variance of a numerical expression within a group.\n\n* Variance measures how far values spread out from the mean.\n* Best applied when a complete dataset is available (for sampled data, use `sample_variance`).\n"
    syntax: "variance(expression: number): number\n"
    category: [Functions reference, Aggregration, variance]
    content: "\n\n# `variance`\n\n## Description\n\n\nReturns the variance of a numerical expression within a group.\n\n* Variance measures how far values spread out from the mean.\n* Best applied when a complete dataset is available (for sampled data, use `sample_variance`).\n\n\n## Syntax\n\n```dataprime\nvariance(expression: number): number\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | expression | number | **true** | Numerical expression whose variance is computed |\n\n## Example\n\n\n**Use case: Compute variance of trace durations**\n\nSuppose you want to calculate how much the duration of each operation varies across traces.\n\n\n### Example data\n```json\n{ \"operationName\": \"brokenPrinter\", \"duration\": 20000 },\n{ \"operationName\": \"checkout\", \"duration\": 250000 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 900000 },\n{ \"operationName\": \"hipstershop.EmailService\", \"duration\": 10000 },\n{ \"operationName\": \"checkout\", \"duration\": 800000 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 300000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 700000 },\n{ \"operationName\": \"hipstershop.EmailService\", \"duration\": 10100 },\n{ \"operationName\": \"checkout\", \"duration\": 1200000 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 100000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 1000000 },\n{ \"operationName\": \"hipstershop.EmailService\", \"duration\": 9950 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 600000 },\n{ \"operationName\": \"checkout\", \"duration\": 400000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 400000 },\n{ \"operationName\": \"hipstershop.EmailService\", \"duration\": 10050 },\n{ \"operationName\": \"MalfunctioningDatabase\", \"duration\": 500000 },\n{ \"operationName\": \"brokenPrinter\", \"duration\": 800000 },\n{ \"operationName\": \"checkout\", \"duration\": 600000 },\n{ \"operationName\": \"hipstershop.EmailService\", \"duration\": 10200 }\n\n```\n\n\n### Example query\n\n```dataprime\ngroupby $l.operationName aggregate variance($m.duration) as duration_variance\n\n```\n\n### Example output\n\n| operationName | duration_variance |\n| --- | -- |\n| checkout | 58572892530.596344 |\n| MalfunctioningDatabase | 67834543984.789665 |\n| brokenPrinter | 110859632383.16512 |\n| hipstershop.EmailService | 378315.86960154894 |\n\n\n"
  arrayAppend:
    description: "Returns a new array with an additional element appended to the end of an existing array.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "arrayAppend(array: array<T>, element: T): array<T>\n"
    category: [Functions reference, Array, arrayAppend]
    content: "\n\n# `arrayAppend`\n\n## Description\n\n\nReturns a new array with an additional element appended to the end of an existing array.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arrayAppend` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narrayAppend(array: array<T>, element: T): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).arrayAppend(element: T): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The base array to modify |    | element | T | **true** | The element to append, must match the array type |\n\n## Example\n\n\n**Use case: Add a missing value to an array for consistency in processing**\n\nSuppose you have an array of job names but need to include an additional value from another field. Consider the following input:\n\n```json\n{\n    \"my_values\": [\"Job 1\", \"Job 2\", \"Job 3\"],\n    \"my_other_value\": \"Job 4\"\n}\n```\n\nBy appending `my_other_value` to `my_values`, you can ensure all values are included in the array for downstream processing.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nreplace my_values with arrayAppend(my_values, my_other_value)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nreplace my_values with my_values.arrayAppend(my_other_value)\n\n```\n///\n\n\n### Example output\n\nThe result will include the new element at the end of the array:\n\n```json\n{\n    \"my_values\": [\"Job 1\", \"Job 2\", \"Job 3\", \"Job 4\"],\n    \"my_other_value\": \"Job 4\"\n}\n```\n\n\n"
  arrayConcat:
    description: "Returns a new array by concatenating the elements of two arrays into a single array.\n\n* Both arrays must be of the same element type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "arrayConcat(array1: array<T>, array2: array<T>): array<T>\n"
    category: [Functions reference, Array, arrayConcat]
    content: "\n\n# `arrayConcat`\n\n## Description\n\n\nReturns a new array by concatenating the elements of two arrays into a single array.\n\n* Both arrays must be of the same element type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arrayConcat` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narrayConcat(array1: array<T>, array2: array<T>): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array1: array<T>).arrayConcat(array2: array<T>): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array1 | array<T> | **true** | The first array to combine |    | array2 | array<T> | **true** | The second array to combine |\n\n## Example\n\n\n**Use case: Combine job queues into a single view**\n\nSuppose you want to view both processing and loading jobs in a single list. Consider the following input:\n\n```json\n{\n    \"processing_jobs_waiting\": [\"job1\", \"job2\", \"job3\"],\n    \"loading_jobs_waiting\": [\"loading_job1\", \"loading_job2\", \"loading_job3\"]\n}\n```\n\nBy concatenating the arrays, you can see all jobs together in one array for simplified analysis.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate all_jobs from arrayConcat(processing_jobs_waiting, loading_jobs_waiting)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate all_jobs from processing_jobs_waiting.arrayConcat(loading_jobs_waiting)\n\n```\n///\n\n\n### Example output\n\nThe result will combine both arrays:\n\n```json\n{\n    \"processing_jobs_waiting\": [\"job1\", \"job2\", \"job3\"],\n    \"loading_jobs_waiting\": [\"loading_job1\", \"loading_job2\", \"loading_job3\"],\n    \"all_jobs\": [\"job1\", \"job2\", \"job3\", \"loading_job1\", \"loading_job2\", \"loading_job3\"]\n}\n```\n\n\n"
  arrayContains:
    description: "Returns `true` if an array includes the specified element, or `false` if it does not.\n\n* This function is the mirror version of [inArray](inArray).\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "arrayContains(array: array<T>, element: T): bool\n"
    category: [Functions reference, Array, arrayContains]
    content: "\n\n# `arrayContains`\n\n## Description\n\n\nReturns `true` if an array includes the specified element, or `false` if it does not.\n\n* This function is the mirror version of [inArray](inArray).\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arrayContains` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narrayContains(array: array<T>, element: T): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).arrayContains(element: T): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The array to search |    | element | T | **true** | The element to check for in the array |\n\n## Example\n\n\n**Use case: Check if a client IP is present in a block list.**\n\nSuppose you have a firewall log that records blocked IPs. Consider the following input:\n\n```json\n{\n    \"action\": \"BLOCK\",\n    \"client_ip\": \"134.56.32.98\",\n    \"blocked_ips\": [\n        \"134.56.32.91\",\n        \"134.56.32.93\",\n        \"134.56.32.90\",\n        \"134.56.32.105\"\n    ]\n}\n```\n\nBy checking whether `client_ip` is contained in `blocked_ips`, you can determine if the request came from a blocked address.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_blocked_ip from arrayContains(blocked_ips, client_ip)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_blocked_ip from blocked_ips.arrayContains(client_ip)\n\n```\n///\n\n\n### Example output\n\nThe result will include a new field `is_blocked_ip` with a boolean value:\n\n```json\n{\n    \"action\": \"BLOCK\",\n    \"client_ip\": \"134.56.32.98\",\n    \"blocked_ips\": [\n        \"134.56.32.91\",\n        \"134.56.32.93\",\n        \"134.56.32.90\",\n        \"134.56.32.105\"\n    ],\n    \"is_blocked_ip\": false\n}\n```\n\n\n"
  arrayInsertAt:
    description: "Returns a new array with an element inserted at the specified position.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "arrayInsertAt(array: array<T>, position: number, value: T): array<T>\n"
    category: [Functions reference, Array, arrayInsertAt]
    content: "\n\n# `arrayInsertAt`\n\n## Description\n\n\nReturns a new array with an element inserted at the specified position.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arrayInsertAt` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narrayInsertAt(array: array<T>, position: number, value: T): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).arrayInsertAt(position: number, value: T): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The array to modify |    | position | number | **true** | The index at which to insert the new element |    | value | T | **true** | The element to insert, must match the array type |\n\n## Example\n\n\n**Use case: Insert an item into the middle of a queue**\n\nSuppose you have a list of jobs but notice one is missing. Consider the following input:\n\n```json\n{\n    \"values\": [\"Job 1\", \"Job 2\", \"Job 4\"]\n}\n```\n\nBy inserting `'Job 3'` at position `2`, you restore the intended sequence of jobs.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nreplace values with arrayInsertAt(values, 2, 'Job 3')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nreplace values with values.arrayInsertAt(2, 'Job 3')\n\n```\n///\n\n\n### Example output\n\nThe result will include the new element at the specified index:\n\n```json\n{\n    \"values\": [\"Job 1\", \"Job 2\", \"Job 3\", \"Job 4\"]\n}\n```\n\n\n\n"
  arrayJoin:
    description: "Returns a single string by joining the elements of an array using the specified delimiter.\n\n* The element type must be compatible with string conversion.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "arrayJoin(array: array<T>, delimiter: string): string\n"
    category: [Functions reference, Array, arrayJoin]
    content: "\n\n# `arrayJoin`\n\n## Description\n\n\nReturns a single string by joining the elements of an array using the specified delimiter.\n\n* The element type must be compatible with string conversion.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arrayJoin` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narrayJoin(array: array<T>, delimiter: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).arrayJoin(delimiter: string): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The array of values to join |    | delimiter | string | **true** | The string delimiter used to join the array elements |\n\n## Example\n\n\n**Use case: Build a readable message from array values**\n\nSuppose you have a list of users who logged in. Consider the following input:\n\n```json\n{\n    \"users\": [\"Chip\", \"Ruby\", \"Glitch\", \"Cora\"],\n    \"action\": \"LOGIN\"\n}\n```\n\nBy joining the `users` array with a delimiter, you can generate a human-readable string that combines the array elements with other fields.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate msg from `Users {arrayJoin(users, ',')} performed action {action}`\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate msg from `Users {users.arrayJoin(',')} performed action {action}`\n\n```\n///\n\n\n### Example output\n\nThe result will include a new field `msg` with the joined string:\n\n```json\n{\n    \"users\": [\"Chip\", \"Ruby\", \"Glitch\", \"Cora\"],\n    \"action\": \"LOGIN\",\n    \"msg\": \"Users Chip,Ruby,Glitch,Cora performed action LOGIN\"\n}\n```\n\n\n"
  arrayLength:
    description: "Returns the number of elements in an array.\n"
    syntax: "arrayLength(array: array<any>): number\n"
    category: [Functions reference, Array, arrayLength]
    content: "\n\n# `arrayLength`\n\n## Description\n\n\nReturns the number of elements in an array.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arrayLength` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narrayLength(array: array<any>): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<any>).arrayLength(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<any> | **true** | The array whose length will be calculated |\n\n## Example\n\n\n**Use case: Determine the number of jobs waiting to be processed**\n\nSuppose you have a list of jobs in a queue. Consider the following input:\n\n```json\n{\n    \"loading_jobs_waiting\": [\"loading_job1\", \"loading_job2\", \"loading_job3\"]\n}\n```\n\nBy applying `arrayLength`, you can find out how many jobs are waiting.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate waiting_jobs from arrayLength(loading_jobs_waiting)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate waiting_jobs from loading_jobs_waiting.arrayLength()\n\n```\n///\n\n\n### Example output\n\nThe result will include the count of array elements:\n\n```json\n{\n    \"loading_jobs_waiting\": [\"loading_job1\", \"loading_job2\", \"loading_job3\"],\n    \"waiting_jobs\": 3\n}\n```\n\n\n"
  arrayRemove:
    description: "Returns a new array with the specified element removed.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "arrayRemove(array: array<T>, element: T): array<T>\n"
    category: [Functions reference, Array, arrayRemove]
    content: "\n\n# `arrayRemove`\n\n## Description\n\n\nReturns a new array with the specified element removed.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arrayRemove` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narrayRemove(array: array<T>, element: T): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).arrayRemove(element: T): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The array to modify |    | element | T | **true** | The element to remove, must match the array type |\n\n## Example\n\n\n**Use case: Remove an item from a queue**\n\nSuppose you have a queue of jobs and want to remove one element. Consider the following input:\n\n```json\n{\n    \"values\": [\"Job 1\", \"Job 2\", \"Job 3\", \"Job 4\"]\n}\n```\n\nBy removing `'Job 3'`, the array is updated to exclude that job.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nreplace values with arrayRemove(values, 'Job 3')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nreplace values with values.arrayRemove('Job 3')\n\n```\n///\n\n\n### Example output\n\nThe result will include the updated array without the removed element:\n\n```json\n{\n    \"values\": [\"Job 1\", \"Job 2\", \"Job 4\"]\n}\n```\n\n\n"
  arrayRemoveAt:
    description: "Returns a new array with the element at the specified position removed.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n* Positions are **0-indexed**.\n"
    syntax: "arrayRemoveAt(array: array<T>, position: number): array<T>\n"
    category: [Functions reference, Array, arrayRemoveAt]
    content: "\n\n# `arrayRemoveAt`\n\n## Description\n\n\nReturns a new array with the element at the specified position removed.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n* Positions are **0-indexed**.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arrayRemoveAt` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narrayRemoveAt(array: array<T>, position: number): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).arrayRemoveAt(position: number): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The array to modify |    | position | number | **true** | The index of the element to remove (0-indexed) |\n\n## Example\n\n\n**Use case: Remove an item from a queue by position**\n\nSuppose you have a list of jobs and want to remove the job at a specific position. Consider the following input:\n\n```json\n{\n    \"values\": [\"Job 1\", \"Job 2\", \"Job 3\", \"Job 4\"]\n}\n```\n\nBy removing the element at index `2`, the array will no longer include `\"Job 3\"`.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nreplace values with arrayRemoveAt(values, 2)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nreplace values with values.arrayRemoveAt(2)\n\n```\n///\n\n\n### Example output\n\nThe result will include the updated array without the element at that position:\n\n```json\n{\n    \"values\": [\"Job 1\", \"Job 2\", \"Job 4\"]\n}\n```\n\n\n"
  arrayReplaceAll:
    description: "Returns a new array where all instances of a specified value are replaced with a new value.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "arrayReplaceAll(array: array<T>, value: T, newValue: T): array<T>\n"
    category: [Functions reference, Array, arrayReplaceAll]
    content: "\n\n# `arrayReplaceAll`\n\n## Description\n\n\nReturns a new array where all instances of a specified value are replaced with a new value.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arrayReplaceAll` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narrayReplaceAll(array: array<T>, value: T, newValue: T): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).arrayReplaceAll(value: T, newValue: T): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The array to modify |    | value | T | **true** | The value to replace |    | newValue | T | **true** | The replacement value, must match the array type |\n\n## Example\n\n\n**Use case: Replace outdated schema values in arrays**\n\nSuppose you have a list of values where some still use an outdated schema. Consider the following inputs:\n\n```json\n{\n    \"values\": [\"NewVal1\", \"NewVal2\", \"NewVal3\"]\n},\n{\n    \"values\": [\"OldVal1\", \"NewVal2\", \"NewVal3\"]\n}\n```\n\nBy replacing all occurrences of `\"OldVal1\"` with `\"NewVal1\"`, you ensure data consistency before further processing.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate updated_values from arrayReplaceAll(values, 'OldVal1', 'NewVal1')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate updated_values from values.arrayReplaceAll('OldVal1', 'NewVal1')\n\n```\n///\n\n\n### Example output\n\nThe result will replace all outdated values:\n\n```json\n{\n    \"values\": [\"NewVal1\", \"NewVal2\", \"NewVal3\"]\n},\n{\n    \"values\": [\"NewVal1\", \"NewVal2\", \"NewVal3\"]\n}\n```\n\n\n\n"
  arrayReplaceAt:
    description: "Returns a new array with the element at the specified position replaced by a new value.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "arrayReplaceAt(array: array<T>, position: number, value: T): array<T>\n"
    category: [Functions reference, Array, arrayReplaceAt]
    content: "\n\n# `arrayReplaceAt`\n\n## Description\n\n\nReturns a new array with the element at the specified position replaced by a new value.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arrayReplaceAt` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narrayReplaceAt(array: array<T>, position: number, value: T): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).arrayReplaceAt(position: number, value: T): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The array to modify |    | position | number | **true** | The index of the element to replace (0-indexed) |    | value | T | **true** | The replacement value, must match the array type |\n\n## Example\n\n\n**Use case: Replace outdated schema values at a specific position**\n\nSuppose you have a list of values where the first entry uses an outdated schema. Consider the following inputs:\n\n```json\n{\n    \"values\": [\"NewVal1\", \"NewVal2\", \"NewVal3\"]\n},\n{\n    \"values\": [\"OldVal1\", \"NewVal2\", \"NewVal3\"]\n}\n```\n\nBy replacing the element at position `0` with `\"NewVal1\"`, you ensure consistent schema values across documents.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate updated_values from arrayReplaceAt(values, 0, 'NewVal1')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate updated_values from values.arrayReplaceAt(0, 'NewVal1')\n\n```\n///\n\n\n### Example output\n\nThe result will replace the outdated value at the given index:\n\n```json\n{\n    \"values\": [\"NewVal1\", \"NewVal2\", \"NewVal3\"]\n},\n{\n    \"values\": [\"NewVal1\", \"NewVal2\", \"NewVal3\"]\n}\n```\n\n\n\n"
  arraySort:
    description: "Returns a new array with the elements sorted according to the specified options.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n* By default, the array is sorted in ascending order, with null values appearing last.\n"
    syntax: "arraySort(array: array<T>, desc: bool?, nullsFirst: bool?): array<T>\n"
    category: [Functions reference, Array, arraySort]
    content: "\n\n# `arraySort`\n\n## Description\n\n\nReturns a new array with the elements sorted according to the specified options.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n* By default, the array is sorted in ascending order, with null values appearing last.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arraySort` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narraySort(array: array<T>, desc: bool?, nullsFirst: bool?): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).arraySort(desc: bool?, nullsFirst: bool?): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The array to sort |    | desc | bool | **false** | Sort order flag. When `true`, the array is sorted in descending order. Must be a literal. Defaults to `false`. |    | nullsFirst | bool | **false** | Null placement flag. When `true`, null values appear at the start of the output. Must be a literal. Defaults to `false`. |\n\n## Example\n\n\n**Use case: Sort names alphabetically**\n\nSuppose you have a list of names. Consider the following input:\n\n```json\n{\n    \"names\": [\"Chris\", \"John\", \"Adam\", \"Jose\"]\n}\n```\n\nBy applying `arraySort`, you can sort the list alphabetically in ascending order.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nreplace names with arraySort(names)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nreplace names with names.arraySort()\n\n```\n///\n\n\n### Example output\n\nThe result will include the array sorted alphabetically:\n\n```json\n{\n    \"names\": [\"Adam\", \"Chris\", \"John\", \"Jose\"]\n}\n```\n\n\n\n"
  arraySplit:
    description: "Returns an array of substrings by splitting a string using the specified delimiter.\n\n* The delimiter can be either a `string` or a `regexp`.\n"
    syntax: "arraySplit(string: string, delimiter: regexp | string): array<string>\n"
    category: [Functions reference, Array, arraySplit]
    content: "\n\n# `arraySplit`\n\n## Description\n\n\nReturns an array of substrings by splitting a string using the specified delimiter.\n\n* The delimiter can be either a `string` or a `regexp`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `arraySplit` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\narraySplit(string: string, delimiter: regexp | string): array<string>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(string: string).arraySplit(delimiter: regexp | string): array<string>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | string | string | **true** | The string to split |    | delimiter | regexp | string | **true** | The delimiter used to split the string |\n\n## Example\n\n\n**Use case: Extract first and last names from a full name**\n\nSuppose you have a field containing a full name. Consider the following input:\n\n```json\n{\n    \"name\": \"Al Gorithm\"\n}\n```\n\nBy splitting the `name` field on a space, you can extract the first and last names into separate fields.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate first_name from arraySplit(name, ' ')[0]\n| create last_name from arraySplit(name, ' ')[1]\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate first_name from name.arraySplit(' ')[0]\n| create last_name from name.arraySplit(' ')[1]\n\n```\n///\n\n\n### Example output\n\nThe result will include new fields for the first and last names:\n\n```json\n{\n    \"name\": \"Al Gorithm\",\n    \"first_name\": \"Al\",\n    \"last_name\": \"Gorithm\"\n}\n```\n\n\n"
  cardinality:
    description: "Returns the number of unique elements in an array.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "cardinality(array: array<T>): number\n"
    category: [Functions reference, Array, cardinality]
    content: "\n\n# `cardinality`\n\n## Description\n\n\nReturns the number of unique elements in an array.\n\n* The element type must match the array type.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `cardinality` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ncardinality(array: array<T>): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).cardinality(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The array whose unique elements will be counted |\n\n## Example\n\n\n**Use case: Detect the number of unique IP addresses**\n\nSuppose you have a list of active IPs in a system. Consider the following input:\n\n```json\n{\n    \"active_ips\": [\"123.45.32.1\", \"111.230.76.5\", \"9.8.7.1\", \"123.45.32.1\"]\n}\n```\n\nBy applying `cardinality`, you can determine how many unique IP addresses are present in the array.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate unique_ip_count from cardinality(active_ips)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate unique_ip_count from active_ips.cardinality()\n\n```\n///\n\n\n### Example output\n\nThe result will include a new field `unique_ip_count` showing the number of unique elements:\n\n```json\n{\n    \"active_ips\": [\"123.45.32.1\", \"111.230.76.5\", \"9.8.7.1\", \"123.45.32.1\"],\n    \"unique_ip_count\": 3\n}\n```\n\n\n"
  inArray:
    description: "Returns `true` if the specified element exists within the array, or `false` if it does not.\n\n* This function is the inverse of [`arrayContains`](arrayContains).\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "inArray(element: T, array: array<T>): bool\n"
    category: [Functions reference, Array, inArray]
    content: "\n\n# `inArray`\n\n## Description\n\n\nReturns `true` if the specified element exists within the array, or `false` if it does not.\n\n* This function is the inverse of [`arrayContains`](arrayContains).\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `inArray` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ninArray(element: T, array: array<T>): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(element: T).inArray(array: array<T>): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | element | T | **true** | The element to check for in the array |    | array | array<T> | **true** | The array to search, must contain elements of the same type as `element` |\n\n## Example\n\n\n**Use case: Check if a client IP appears in a block list**\n\nSuppose you have a log entry with a client IP. Consider the following input:\n\n```json\n{\n    \"client_ip\": \"192.168.1.105\"\n}\n```\n\nBy checking whether the `client_ip` value exists in an array of blocked IP addresses, you can identify whether the request should be blocked.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nfilter inArray(client_ip, ['192.168.1.105', '192.168.1.112', '192.168.1.32'])\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nfilter client_ip.inArray(['192.168.1.105', '192.168.1.112', '192.168.1.32'])\n\n```\n///\n\n\n### Example output\n\nThe result will return `true` since `\"192.168.1.105\"` is included in the array:\n\n```json\n{\n    \"client_ip\": \"192.168.1.105\",\n    \"is_blocked\": true\n}\n```\n\n\n"
  isEmpty:
    description: "Returns `true` if the array contains no elements, or `false` otherwise.\n\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "isEmpty(array: array<T>): bool\n"
    category: [Functions reference, Array, isEmpty]
    content: "\n\n# `isEmpty`\n\n## Description\n\n\nReturns `true` if the array contains no elements, or `false` otherwise.\n\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `isEmpty` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nisEmpty(array: array<T>): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array: array<T>).isEmpty(): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array | array<T> | **true** | The array to check for emptiness |\n\n## Example\n\n\n**Use case: Check if an array is empty**\n\nYou can directly test whether an array has any elements:\n\n```dataprime\ncreate is_empty from isEmpty(my_array)\n```\n\nThis produces a new boolean field indicating whether the array is empty.\n\n**Use case 2: Optimize execution by skipping work when arrays are empty**\n\nSuppose you have documents like the following:\n\n```json\n{\n    \"names\": [\"Chip\", \"Ruby\", \"Glitch\"]\n},\n{\n    \"names\": []\n}\n```\n\nIf you want to join names into a string but avoid unnecessary computation for empty arrays, you can combine `isEmpty` with an `if` statement:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate msg from if(!names.isEmpty(), names.arrayJoin(','), '')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate msg from if(!isEmpty(names), names.arrayJoin(','), '')\n\n```\n///\n\n\n### Example output\n\nFor the above input, the results will look like:\n\n```json\n{\n    \"names\": [\"Chip\", \"Ruby\", \"Glitch\"],\n    \"msg\": \"Chip,Ruby,Glitch\"\n},\n{\n    \"names\": [],\n    \"msg\": \"\"\n}\n```\n\n\n"
  isSubset:
    description: "Returns `true` if `array1` is a subset of `array2`, or `false` otherwise.\n\n* When comparing `array1` and `array2`, duplicates are discarded. This means two arrays of different lengths but with the same unique elements are considered equal.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "isSubset(array1: array<T>, array2: array<T>): bool\n"
    category: [Functions reference, Array, isSubset]
    content: "\n\n# `isSubset`\n\n## Description\n\n\nReturns `true` if `array1` is a subset of `array2`, or `false` otherwise.\n\n* When comparing `array1` and `array2`, duplicates are discarded. This means two arrays of different lengths but with the same unique elements are considered equal.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `isSubset` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nisSubset(array1: array<T>, array2: array<T>): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array1: array<T>).isSubset(array2: array<T>): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array1 | array<T> | **true** | The array to test as a subset |    | array2 | array<T> | **true** | The array to test against, must contain all elements of `array1` |\n\n## Example\n\n\n**Use case: Verify if started jobs are part of all jobs**\n\nSuppose you want to confirm that a list of started jobs is fully contained within the list of all jobs. Consider the following input:\n\n```json\n{\n    \"all_jobs\": [\"Chris\", \"Quinn\", \"Flo\", \"Meta\", \"Neo\"],\n    \"started_jobs\": [\"Chris\", \"Quinn\"]\n}\n```\n\nBy applying `isSubset`, you can check if every element of `started_jobs` exists within `all_jobs`.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_subset from isSubset(started_jobs, all_jobs)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_subset from started_jobs.isSubset(all_jobs)\n\n```\n///\n\n\n### Example output\n\nThe result will include a new field `is_subset` indicating whether the subset condition is satisfied:\n\n```json\n{\n    \"all_jobs\": [\"Chris\", \"Quinn\", \"Flo\", \"Meta\", \"Neo\"],\n    \"started_jobs\": [\"Chris\", \"Quinn\"],\n    \"is_subset\": true\n}\n```\n\n\n"
  isSuperset:
    description: "Returns `true` if `array1` is a superset of `array2`, or `false` otherwise.\n\n* When comparing `array1` and `array2`, duplicates are discarded. This means two arrays of different lengths but with the same unique elements are considered equal.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "isSuperset(array1: array<T>, array2: array<T>): bool\n"
    category: [Functions reference, Array, isSuperset]
    content: "\n\n# `isSuperset`\n\n## Description\n\n\nReturns `true` if `array1` is a superset of `array2`, or `false` otherwise.\n\n* When comparing `array1` and `array2`, duplicates are discarded. This means two arrays of different lengths but with the same unique elements are considered equal.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `isSuperset` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nisSuperset(array1: array<T>, array2: array<T>): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array1: array<T>).isSuperset(array2: array<T>): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array1 | array<T> | **true** | The array to test as a superset |    | array2 | array<T> | **true** | The array to test against, must be fully contained within `array1` |\n\n## Example\n\n\n**Use case: Verify if all jobs contain the started jobs**\n\nSuppose you want to confirm that a list of all jobs includes every job that has been started. Consider the following input:\n\n```json\n{\n    \"all_jobs\": [\"Chris\", \"John\", \"Adam\", \"Ariel\", \"Zev\"],\n    \"started_jobs\": [\"Chris\", \"John\"]\n}\n```\n\nBy applying `isSuperset`, you can verify that `all_jobs` fully contains the elements in `started_jobs`.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_superset from isSuperset(all_jobs, started_jobs)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_superset from all_jobs.isSuperset(started_jobs)\n\n```\n///\n\n\n### Example output\n\nThe result will include a new field `is_superset` indicating whether the superset condition is satisfied:\n\n```json\n{\n    \"all_jobs\": [\"Chris\", \"John\", \"Adam\", \"Ariel\", \"Zev\"],\n    \"started_jobs\": [\"Chris\", \"John\"],\n    \"is_superset\": true\n}\n```\n\n\n"
  setDiff:
    description: "Returns the set difference of two arrays, producing a new array with elements from `array1` that are not in `array2`.\n\n* Duplicates are discarded when computing the difference.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "setDiff(array1: array<T>, array2: array<T>): array<T>\n"
    category: [Functions reference, Array, setDiff]
    content: "\n\n# `setDiff`\n\n## Description\n\n\nReturns the set difference of two arrays, producing a new array with elements from `array1` that are not in `array2`.\n\n* Duplicates are discarded when computing the difference.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `setDiff` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nsetDiff(array1: array<T>, array2: array<T>): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array1: array<T>).setDiff(array2: array<T>): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array1 | array<T> | **true** | The base array to compare |    | array2 | array<T> | **true** | The array containing values to exclude from `array1` |\n\n## Example\n\n\n**Use case: Identify unauthorized IP addresses**\n\nSuppose you have aggregated a list of IP addresses that accessed different paths. Consider the following input:\n\n```json\n{\n    \"path\": \"/home\",\n    \"ip_addresses\": [\"156.76.87.4\", \"156.76.12.4\", \"156.74.1.4\"]\n},\n{\n    \"path\": \"/checkout\",\n    \"ip_addresses\": [\"156.76.87.4\"]\n}\n```\n\nBy applying `setDiff`, you can compare the observed IP addresses against a known allow list to identify unauthorized addresses.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate unauthorized_ip_addresses from setDiff(ip_addresses, [\"156.76.12.4\", \"156.76.87.4\"])\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate unauthorized_ip_addresses from ip_addresses.setDiff([\"156.76.12.4\", \"156.76.87.4\"])\n\n```\n///\n\n\n### Example output\n\nThe result will include a new field `unauthorized_ip_addresses` containing only the addresses not in the allow list:\n\n```json\n{\n    \"path\": \"/home\",\n    \"ip_addresses\": [\"156.76.87.4\", \"156.76.12.4\", \"156.74.1.4\"],\n    \"unauthorized_ip_addresses\": [\"156.74.1.4\"]\n},\n{\n    \"path\": \"/checkout\",\n    \"ip_addresses\": [\"156.76.87.4\"],\n    \"unauthorized_ip_addresses\": []\n}\n```\n\n\n"
  setDiffSymmetric:
    description: "Returns the symmetric difference of two arrays, producing a new array with elements that exist in either `array1` or `array2` but not in both.\n\n* Duplicates are discarded when computing the difference.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "setDiffSymmetric(array1: array<T>, array2: array<T>): array<T>\n"
    category: [Functions reference, Array, setDiffSymmetric]
    content: "\n\n# `setDiffSymmetric`\n\n## Description\n\n\nReturns the symmetric difference of two arrays, producing a new array with elements that exist in either `array1` or `array2` but not in both.\n\n* Duplicates are discarded when computing the difference.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `setDiffSymmetric` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nsetDiffSymmetric(array1: array<T>, array2: array<T>): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array1: array<T>).setDiffSymmetric(array2: array<T>): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array1 | array<T> | **true** | The first array to compare |    | array2 | array<T> | **true** | The second array to compare |\n\n## Example\n\n\n**Use case: Identify differences between two IP allow lists**\n\nSuppose you maintain two separate allow lists of IP addresses. Consider the following input:\n\n```json\n{\n    \"ip_addresses_a\": [\"156.76.87.4\", \"156.76.12.4\", \"156.74.1.4\"],\n    \"ip_addresses_b\": [\"156.76.87.4\", \"156.76.1.4\"]\n}\n```\n\nBy applying `setDiffSymmetric`, you can find IPs that exist in one list but not the other.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate diff_ips from setDiffSymmetric(ip_addresses_a, ip_addresses_b)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate diff_ips from ip_addresses_a.setDiffSymmetric(ip_addresses_b)\n\n```\n///\n\n\n### Example output\n\nThe result will include a new field `diff_ips` showing only the differing elements:\n\n```json\n{\n    \"ip_addresses_a\": [\"156.76.87.4\", \"156.76.12.4\", \"156.74.1.4\"],\n    \"ip_addresses_b\": [\"156.76.87.4\", \"156.76.1.4\"],\n    \"diff_ips\": [\"156.76.12.4\", \"156.74.1.4\", \"156.76.1.4\"]\n}\n```\n\n\n"
  setEqualsTo:
    description: "Returns `true` if `array1` and `array2` contain the same unique elements, or `false` otherwise.\n\n* When comparing arrays, duplicates are discarded. This means two arrays of different lengths but with the same unique elements are considered equal.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "setEqualsTo(array1: array<T>, array2: array<T>): bool\n"
    category: [Functions reference, Array, setEqualsTo]
    content: "\n\n# `setEqualsTo`\n\n## Description\n\n\nReturns `true` if `array1` and `array2` contain the same unique elements, or `false` otherwise.\n\n* When comparing arrays, duplicates are discarded. This means two arrays of different lengths but with the same unique elements are considered equal.\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `setEqualsTo` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nsetEqualsTo(array1: array<T>, array2: array<T>): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array1: array<T>).setEqualsTo(array2: array<T>): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array1 | array<T> | **true** | The first array to compare |    | array2 | array<T> | **true** | The second array to compare |\n\n## Example\n\n\n**Use case: Compare arrays for unique element equality**\n\nSuppose you have two arrays that may contain duplicate elements. Consider the following input:\n\n```json\n{\n    \"array_1\": [\"val1\", \"val1\", \"val2\", \"val2\", \"val3\"],\n    \"array_2\": [\"val1\", \"val2\", \"val3\", \"val3\", \"val3\"]\n}\n```\n\nBy applying `setEqualsTo`, you can determine if both arrays contain the same set of unique values, regardless of duplicates.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate arrays_equal from setEqualsTo(array_1, array_2)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate arrays_equal from array_1.setEqualsTo(array_2)\n\n```\n///\n\n\n### Example output\n\nThe result will include a new field `arrays_equal` indicating whether the sets are equal:\n\n```json\n{\n    \"array_1\": [\"val1\", \"val1\", \"val2\", \"val2\", \"val3\"],\n    \"array_2\": [\"val1\", \"val2\", \"val3\", \"val3\", \"val3\"],\n    \"arrays_equal\": true\n}\n```\n\n\n\n"
  setIntersection:
    description: "Returns the intersection of two arrays, producing a new array with elements common to both.\n\n* Both arrays are treated as sets:\n\n* Duplicates are removed from both arrays\n* Order is not preserved in the result\n* `null` is treated as an empty set\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "setIntersection(array1: array<T>, array2: array<T>): array<T>\n"
    category: [Functions reference, Array, setIntersection]
    content: "\n\n# `setIntersection`\n\n## Description\n\n\nReturns the intersection of two arrays, producing a new array with elements common to both.\n\n* Both arrays are treated as sets:\n\n* Duplicates are removed from both arrays\n* Order is not preserved in the result\n* `null` is treated as an empty set\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `setIntersection` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nsetIntersection(array1: array<T>, array2: array<T>): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array1: array<T>).setIntersection(array2: array<T>): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array1 | array<T> | **true** | The first array to compare |    | array2 | array<T> | **true** | The second array to compare |\n\n## Example\n\n\n**Use case: Compare observed IPs against a block list**\n\nSuppose you collect IP addresses accessing different paths. Consider the following input:\n\n```json\n{\n    \"path\": \"/home\",\n    \"ip_addresses\": [\"156.76.87.4\", \"156.76.12.4\", \"156.74.1.4\"]\n},\n{\n    \"path\": \"/checkout\",\n    \"ip_addresses\": [\"156.76.87.4\"]\n}\n```\n\nBy applying `setIntersection`, you can identify which observed IP addresses also appear in a known block list.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate unauthorized_ip_addresses from setIntersection(ip_addresses, [\"156.76.12.4\", \"156.76.87.4\"])\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate unauthorized_ip_addresses from ip_addresses.setIntersection([\"156.76.12.4\", \"156.76.87.4\"])\n\n```\n///\n\n\n### Example output\n\nThe result will include a new field `unauthorized_ip_addresses` showing IPs found in both arrays:\n\n```json\n{\n    \"path\": \"/home\",\n    \"ip_addresses\": [\"156.76.87.4\", \"156.76.12.4\", \"156.74.1.4\"],\n    \"unauthorized_ip_addresses\": [\"156.76.87.4\", \"156.76.12.4\"]\n},\n{\n    \"path\": \"/checkout\",\n    \"ip_addresses\": [\"156.76.87.4\"],\n    \"unauthorized_ip_addresses\": []\n}\n```\n\n\n"
  setUnion:
    description: "Returns the union of two arrays, producing a new array that contains all unique elements from both.\n\n* Both arrays are treated as sets:\n\n* Duplicates are removed\n* Order is not preserved in the result\n* `null` is treated as an empty set\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n"
    syntax: "setUnion(array1: array<T>, array2: array<T>): array<T>\n"
    category: [Functions reference, Array, setUnion]
    content: "\n\n# `setUnion`\n\n## Description\n\n\nReturns the union of two arrays, producing a new array that contains all unique elements from both.\n\n* Both arrays are treated as sets:\n\n* Duplicates are removed\n* Order is not preserved in the result\n* `null` is treated as an empty set\n* Supported element types include `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, and `enum`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `setUnion` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nsetUnion(array1: array<T>, array2: array<T>): array<T>\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(array1: array<T>).setUnion(array2: array<T>): array<T>\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | array1 | array<T> | **true** | The first array to combine |    | array2 | array<T> | **true** | The second array to combine |\n\n## Example\n\n\n**Use case: Combine processing and loading jobs into a unique set**\n\nSuppose you have arrays of processing and loading jobs. Consider the following input:\n\n```json\n{\n    \"processing_jobs_waiting\": [\"job1\", \"job2\", \"job3\", \"job4\"],\n    \"loading_jobs_waiting\": [\"job1\", \"job2\", \"job3\"]\n}\n```\n\nBy applying `setUnion`, you can merge the two arrays and keep only unique jobs.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate all_jobs from setUnion(processing_jobs_waiting, loading_jobs_waiting)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate all_jobs from processing_jobs_waiting.setUnion(loading_jobs_waiting)\n\n```\n///\n\n\n### Example output\n\nThe result will include a new field `all_jobs` containing unique values from both arrays:\n\n```json\n{\n    \"processing_jobs_waiting\": [\"job1\", \"job2\", \"job3\"],\n    \"loading_jobs_waiting\": [\"job1\", \"job2\", \"job3\"],\n    \"all_jobs\": [\"job1\", \"job2\", \"job3\", \"job4\"]\n}\n```\n\n\n\n"
  case:
    description: "Returns a value based on the first condition that evaluates to `true`.\n\nThe `case` statement allows you to perform multiple conditional checks against a value. Each condition must resolve to a boolean expression, and the first condition that matches determines the result.\n\n!!! note\n    Like all case statements, `case` returns the **first matching value**. The order of clauses is important.\n"
    syntax: "case {\ncondition1 -> value1,\ncondition2 -> value2,\n...\nconditionN -> valueN,\n_          -> default\n}\n"
    category: [Functions reference, Case, case]
    content: "\n\n# `case`\n\n## Description\n\n\nReturns a value based on the first condition that evaluates to `true`.\n\nThe `case` statement allows you to perform multiple conditional checks against a value. Each condition must resolve to a boolean expression, and the first condition that matches determines the result.\n\n!!! note\n    Like all case statements, `case` returns the **first matching value**. The order of clauses is important.\n\n\n## Syntax\n\n```dataprime\ncase {\ncondition1 -> value1,\ncondition2 -> value2,\n...\nconditionN -> valueN,\n_          -> default\n}\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | condition | boolean | **true** | A condition to evaluate |    | value | any | **true** | The value to return if the condition is true |    | _ | any | **false** | Default value if no conditions match |\n\n## Example\n\n\n**Use case: Map server IPs to owners by subnet**\n\nSuppose you want to enrich logs with the owner of each server based on its IP address. This can help route incidents to the right team. \n\n\nYou can use the `ipInSubnet` function inside a `case` statement to determine ownership. If no subnet matches, a default owner is assigned.\n\n\n### Example data\n```json\n{\n  \"server_ip\": \"10.0.0.1\"\n},\n{\n  \"server_ip\": \"165.0.0.1\"\n},\n{\n  \"server_ip\": \"333.4.5.6\"\n}\n\n```\n\n\n### Example query\n\n```dataprime\ncreate server_owner from\ncase {\n  ipInSubnet(server_ip, '10.0.0.0/8')   -> 'Chris',\n  ipInSubnet(server_ip, '165.0.0.0/8')  -> 'George',\n  ipInSubnet(server_ip, '333.4.0.0/16') -> 'Maya',\n  _                                     -> 'DevOps Team'\n}\n\n```\n\n### Example output\n\n```json\n{\n  \"server_ip\": \"10.0.0.1\",\n  \"server_owner\": \"Chris\"\n},\n{\n  \"server_ip\": \"165.0.0.1\",\n  \"server_owner\": \"George\"\n},\n{\n  \"server_ip\": \"333.4.5.6\",\n  \"server_owner\": \"Maya\"\n}\n```\n\n\n"
  case_contains:
    description: "Returns a value based on whether a string contains one of several specified substrings.\n\nThis function is a shorthand for `case` expressions with `contains` logic and helps shorten queries that would otherwise repeat conditional statements.\n\n!!! note\n    Like all case statements, `case_contains` returns the **first matching value**. The order of clauses is important.\n"
    syntax: "case_contains {\ns: string,\nsubstring1 -> result1,\nsubstring2 -> result2,\n...\nsubstringN -> resultN,\n_          -> default\n}\n"
    category: [Functions reference, Case, case_contains]
    content: "\n\n# `case_contains`\n\n## Description\n\n\nReturns a value based on whether a string contains one of several specified substrings.\n\nThis function is a shorthand for `case` expressions with `contains` logic and helps shorten queries that would otherwise repeat conditional statements.\n\n!!! note\n    Like all case statements, `case_contains` returns the **first matching value**. The order of clauses is important.\n\n\n## Syntax\n\n```dataprime\ncase_contains {\ns: string,\nsubstring1 -> result1,\nsubstring2 -> result2,\n...\nsubstringN -> resultN,\n_          -> default\n}\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | s | string | **true** | The string to check for substrings |    | substring | string | **true** | A substring to search for within `s` |    | result | any | **true** | The value to return if the substring is found |    | _ | any | **false** | Default value if no substrings match |\n\n## Example\n\n\n**Use case: Map cluster names to environment names**\n\nSuppose you want to convert subsystem metadata into full environment names. Consider these log documents:\n\n\n### Example data\n```json\n{\n  \"cluster_name\": \"acme-prod-cluster\"\n},\n{\n  \"cluster_name\": \"acme-dev-cluster\"\n},\n{\n  \"cluster_name\": \"acme-stg-cluster\"\n}\n\n```\n\n\n### Example query\n\n```dataprime\ncreate environment_name from \n  case_contains {\n    $d.cluster_name,\n    '-prod-' -> 'production',\n    '-dev-'  -> 'development',\n    '-stg-'  -> 'staging',\n    _        -> 'test'\n  }\n\n```\n\n### Example output\n\n```json\n{\n  \"cluster_name\": \"acme-prod-cluster\",\n  \"environment_name\": \"production\"\n},\n{\n  \"cluster_name\": \"acme-dev-cluster\",\n  \"environment_name\": \"development\"\n},\n{\n  \"cluster_name\": \"acme-stg-cluster\",\n  \"environment_name\": \"staging\"\n}\n```\n\n\n"
  case_equals:
    description: "Returns a value based on whether an expression equals one of several specified values.\n\nThis function is a shorthand for `case` expressions with equality (`==`) logic and helps shorten queries that would otherwise repeat conditional statements.\n\n!!! note\n    Like all case statements, `case_equals` returns the **first matching value**. The order of clauses is important.\n"
    syntax: "case_equals {\ne: any,\nvalue1 -> result1,\nvalue2 -> result2,\n...\nvalueN -> resultN,\n_      -> default\n}\n"
    category: [Functions reference, Case, case_equals]
    content: "\n\n# `case_equals`\n\n## Description\n\n\nReturns a value based on whether an expression equals one of several specified values.\n\nThis function is a shorthand for `case` expressions with equality (`==`) logic and helps shorten queries that would otherwise repeat conditional statements.\n\n!!! note\n    Like all case statements, `case_equals` returns the **first matching value**. The order of clauses is important.\n\n\n## Syntax\n\n```dataprime\ncase_equals {\ne: any,\nvalue1 -> result1,\nvalue2 -> result2,\n...\nvalueN -> resultN,\n_      -> default\n}\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | e | any | **true** | The expression to compare against values |    | value | any | **true** | A value to compare with `e` |    | result | any | **true** | The value to return if `e` equals `value` |    | _ | any | **false** | Default value if no values match |\n\n## Example\n\n\n**Use case: Flag environments for alerting**\n\nSuppose you want to create a field `should_alert` that is `true` for environments where alerts should fire and `false` otherwise. Consider these log documents:\n\n\n### Example data\n```json\n{\n  \"cluster_name\": \"acme-prod-cluster\"\n},\n{\n  \"cluster_name\": \"acme-dev-cluster\"\n},\n{\n  \"cluster_name\": \"acme-stg-cluster\"\n}\n\n```\n\n\n### Example query\n\n```dataprime\ncreate should_alert from \n  case_equals {\n    $d.cluster_name,\n    'acme-prod-cluster' -> true,\n    'acme-dev-cluster'  -> false,\n    'acme-stg-cluster'  -> true,\n    _                   -> false\n  }\n\n```\n\n### Example output\n\n```json\n{\n  \"cluster_name\": \"acme-prod-cluster\",\n  \"should_alert\": true\n},\n{\n  \"cluster_name\": \"acme-dev-cluster\",\n  \"should_alert\": false\n},\n{\n  \"cluster_name\": \"acme-stg-cluster\",\n  \"should_alert\": true\n}\n```\n\n\n"
  case_greaterthan:
    description: "Returns a value based on whether a number is greater than one of several thresholds.\n\nThis function is a shorthand for `case` expressions with `>` (greater than) logic and helps shorten queries that would otherwise repeat conditional statements.\n\n!!! note\n    Like all case statements, `case_greaterthan` returns the **first matching value**. The order of clauses is important.\n"
    syntax: "case_greaterthan {\n  n: number,\n  value1: number -> result1,\n  value2: number -> result2,\n  ...\n  valueN: number -> resultN,\n  _              -> default\n}\n"
    category: [Functions reference, Case, case_greaterthan]
    content: "\n\n# `case_greaterthan`\n\n## Description\n\n\nReturns a value based on whether a number is greater than one of several thresholds.\n\nThis function is a shorthand for `case` expressions with `>` (greater than) logic and helps shorten queries that would otherwise repeat conditional statements.\n\n!!! note\n    Like all case statements, `case_greaterthan` returns the **first matching value**. The order of clauses is important.\n\n\n## Syntax\n\n```dataprime\ncase_greaterthan {\n  n: number,\n  value1: number -> result1,\n  value2: number -> result2,\n  ...\n  valueN: number -> resultN,\n  _              -> default\n}\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | n | number | **true** | The numeric expression to compare |    | value | number | **true** | A threshold value for comparison |    | result | any | **true** | The value to return if `n` is greater than the threshold |    | _ | any | **false** | Default value if no thresholds match |\n\n## Example\n\n\n**Use case: Map HTTP status codes to text descriptions**\n\nSuppose you want to create a field `status_description` that provides a readable label for HTTP status codes. Consider these log documents:\n\n```json\n{\n  \"status_code\": 201\n},\n{\n  \"status_code\": 500\n},\n{\n  \"status_code\": 404\n}\n```\n\nThe comparison thresholds should be listed in descending order, since the first match is returned. Also note that each threshold must be reduced by 1 because `case_greaterthan` uses a strict `>` operator (not `>=`). For example, to capture 4xx codes, use `399` as the threshold, not `400`.\n\n\n\n\n### Example query\n\n```dataprime\ncreate status_description from\ncase_greaterthan {\n  $d.status_code,\n  499 -> 'server-error',\n  399 -> 'client-error',\n  299 -> 'redirection',\n  199 -> 'success',\n  99  -> 'information',\n  _   -> 'other'\n}\n\n```\n\n### Example output\n\n```json\n{\n  \"status_code\": 201,\n  \"status_description\": \"success\"\n},\n{\n  \"status_code\": 500,\n  \"status_description\": \"server-error\"\n},\n{\n  \"status_code\": 404,\n  \"status_description\": \"client-error\"\n}\n```\n\n\n"
  case_lessthan:
    description: "Returns a value based on whether a number is less than one of several thresholds.\n\nThis function is a shorthand for `case` expressions with `<` (less than) logic and helps shorten queries that would otherwise repeat conditional statements.\n\n!!! note\n    Like all case statements, `case_lessthan` returns the **first matching value**. The order of clauses is important.\n"
    syntax: "case_lessthan {\nn: number,\nvalue1: number -> result1,\nvalue2: number -> result2,\n...\nvalueN: number -> resultN,\n_              -> default\n}\n"
    category: [Functions reference, Case, case_lessthan]
    content: "\n\n# `case_lessthan`\n\n## Description\n\n\nReturns a value based on whether a number is less than one of several thresholds.\n\nThis function is a shorthand for `case` expressions with `<` (less than) logic and helps shorten queries that would otherwise repeat conditional statements.\n\n!!! note\n    Like all case statements, `case_lessthan` returns the **first matching value**. The order of clauses is important.\n\n\n## Syntax\n\n```dataprime\ncase_lessthan {\nn: number,\nvalue1: number -> result1,\nvalue2: number -> result2,\n...\nvalueN: number -> resultN,\n_              -> default\n}\n\n```\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | n | number | **true** | The numeric expression to compare |    | value | number | **true** | A threshold value for comparison |    | result | any | **true** | The value to return if `n` is less than the threshold |    | _ | any | **false** | Default value if no thresholds match |\n\n## Example\n\n\n**Use case: Map temperature values to descriptions**\n\nSuppose you want to create a field `temperature_description` that provides a readable label for temperatures in Celsius. Consider these log documents:\n\n```json\n{\n  \"temperature_celsius\": 10\n},\n{\n  \"temperature_celsius\": 50\n},\n{\n  \"temperature_celsius\": 20\n}\n```\n\nThe comparison thresholds should be listed in ascending order, since the first match is returned. For example, a value of `20` is less than both `45` and `30`, but the correct match is `30 -> 'fun'` because it appears first in ascending order.\n\n\n\n\n### Example query\n\n```dataprime\ncreate temperature_description from\ncase_lessthan {\n  $d.temperature_celsius,\n  10 -> 'freezing',\n  20 -> 'cold',\n  30 -> 'fun',\n  45 -> 'hot',\n  _  -> 'burning'\n}\n\n```\n\n### Example output\n\n```json\n{\n  \"temperature_celsius\": 10,\n  \"temperature_description\": \"freezing\"\n},\n{\n  \"temperature_celsius\": 50,\n  \"temperature_description\": \"burning\"\n},\n{\n  \"temperature_celsius\": 20,\n  \"temperature_description\": \"cold\"\n}\n```\n\n\n"
  firstNonNull:
    description: "Return the first non-null value from a list of arguments, in the order they\nare provided.\n\n!!! note\n    Works only on scalar values such as `number`, `string`, or `timestamp`.\n    Does not work on objects.\n"
    syntax: "firstNonNull(value: any, ...values: any): any\n"
    category: [Functions reference, General, firstNonNull]
    content: "\n\n# `firstNonNull`\n\n## Description\n\n\nReturn the first non-null value from a list of arguments, in the order they\nare provided.\n\n!!! note\n    Works only on scalar values such as `number`, `string`, or `timestamp`.\n    Does not work on objects.\n\n\n## Syntax\n\nLike many functions in DataPrime, `firstNonNull` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nfirstNonNull(value: any, ...values: any): any\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: any).firstNonNull(...values: any): any\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | any | **true** | The first argument to check for a non-null value |    | ...values | any | **true** | Subsequent arguments to check, in order |\n\n## Example\n\n\n**Use case: Consolidate inconsistent field names for the same logical value**\n\nLogs may contain a user identifier under different field names (`userId`, `user_id`, `user_identifier`). Instead of writing complex conditionals, `firstNonNull` returns the first populated value across these fields, creating schema-on-read consistency.\n\n\n### Example data\n```json\n{\n    \"userId\": \"123\",\n    \"user_id\": null,\n    \"user_identifier\": null\n},\n{\n    \"userId\": null,\n    \"user_id\": \"456\",\n    \"user_identifier\": null\n},\n{\n    \"userId\": null,\n    \"user_id\": null,\n    \"user_identifier\": \"789\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose canonical_user_id from firstNonNull(userId, user_id, user_identifier)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose canonical_user_id from userId.firstNonNull(user_id, user_identifier)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"canonical_user_id\": \"123\"\n},\n{\n    \"canonical_user_id\": \"456\"\n},\n{\n    \"canonical_user_id\": \"789\"\n}\n```\n\n\n"
  if:
    description: "Return one value if a condition is `true`, otherwise return an alternative\nvalue.\n"
    syntax: "if(condition: bool, then: any, else: any?): any\n"
    category: [Functions reference, General, if]
    content: "\n\n# `if`\n\n## Description\n\n\nReturn one value if a condition is `true`, otherwise return an alternative\nvalue.\n\n\n## Syntax\n\nLike many functions in DataPrime, `if` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nif(condition: bool, then: any, else: any?): any\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(condition: bool).if(then: any, else: any?): any\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | condition | bool | **true** | Condition to evaluate |    | then | any | **true** | Value to return if the condition is `true` |    | else | any | **false** | Value to return if the condition is `false` |\n\n## Example\n\n\n**Use case: Add a flag based on whether an IP belongs to a subnet**\n\nIf an IP is in the `10.0.0.0/8` range, mark it with a flag. This avoids recalculating the condition multiple times.\n\n\n### Example data\n```json\n{\n    \"ip\": \"10.8.0.8\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_in_10_subnet from if(ipInSubnet(ip, '10.0.0.0/8'), true, false)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_in_10_subnet from ip.ipInSubnet('10.0.0.0/8').if(true, false)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ip\": \"10.8.0.8\",\n    \"is_in_10_subnet\": true\n}\n```\n\n\n\n"
  in:
    description: "Return `true` if a given value matches any value in a list of candidates,\notherwise return `false`.\n"
    syntax: "in(comparand: any, value: any, ...values: any): bool\n"
    category: [Functions reference, General, in]
    content: "\n\n# `in`\n\n## Description\n\n\nReturn `true` if a given value matches any value in a list of candidates,\notherwise return `false`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `in` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nin(comparand: any, value: any, ...values: any): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(comparand: any).in(value: any, ...values: any): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | comparand | any | **true** | The value to check |    | value | any | **true** | The first candidate to compare against |    | ...values | any | **true** | Additional candidates to compare against |\n\n## Example\n\n\n**Use case: Flag membership in a predefined group**\n\nA team name can be compared against a list of department members to determine if it belongs to Engineering.\n\n\n### Example data\n```json\n{\n    \"team\": \"Developers\"\n},\n{\n    \"team\": \"Marketing\"\n},\n{\n    \"team\": \"QA Testing\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_in_engineering from in(team, 'Developers', 'QA Testing', 'Front End Engineers', 'DevOps Team')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_in_engineering from team.in('Developers', 'QA Testing', 'Front End Engineers', 'DevOps Team')\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"team\": \"Developers\",\n    \"is_in_engineering\": true\n},\n{\n    \"team\": \"Marketing\",\n    \"is_in_engineering\": false\n},\n{\n    \"team\": \"QA Testing\",\n    \"is_in_engineering\": true\n}\n```\n\n\n"
  recordLocation:
    description: "Return the cloud storage location of a record, such as the URL of an S3 object\nwhen using AWS S3.\n\n!!! note\n    Works only with data stored in your cloud storage. Running this on indexed\n    documents (Frequent Search mode) will return `null`.\n"
    syntax: "recordLocation(): string\n"
    category: [Functions reference, General, recordLocation]
    content: "\n\n# `recordLocation`\n\n## Description\n\n\nReturn the cloud storage location of a record, such as the URL of an S3 object\nwhen using AWS S3.\n\n!!! note\n    Works only with data stored in your cloud storage. Running this on indexed\n    documents (Frequent Search mode) will return `null`.\n\n\n## Syntax\n\n```dataprime\nrecordLocation(): string\n\n```\n\n\n## Example\n\n\n**Use case: Add the storage URL to documents**\nAttach the S3 object URL to each document for easier navigation between logs and raw storage.\n\n\n### Example data\n```json\n{\n    \"service\": \"backend-service\",\n    \"status_code\": 500\n}\n\n```\n\n\n### Example query\n\n```dataprime\ncreate s3_location from recordLocation()\n\n```\n\n### Example output\n\n```json\n{\n    \"service\": \"backend-service\",\n    \"status_code\": 500,\n    \"s3_location\": \"s3://your-bucket/path/to/object\"\n}\n```\n\n\n"
  ipInSubnet:
    description: "Return `true` if an IP address belongs to a given subnet, otherwise return\n`false`.\n"
    syntax: "ipInSubnet(ip: string, ipPrefix: string): bool\n"
    category: [Functions reference, IP, ipInSubnet]
    content: "\n\n# `ipInSubnet`\n\n## Description\n\n\nReturn `true` if an IP address belongs to a given subnet, otherwise return\n`false`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `ipInSubnet` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nipInSubnet(ip: string, ipPrefix: string): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(ip: string).ipInSubnet(ipPrefix: string): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | ip | string | **true** | The IP address to test |    | ipPrefix | string | **true** | The CIDR range to check against, e.g. `154.67.8.0/24` |\n\n## Example\n\n\n**Use case: Filter documents by subnet membership**\n\nCheck if the field `ip_address` belongs to the subnet `154.67.8.0/24`.\nDocuments with matching IPs are included in the result set, while others are excluded.\n\n\n### Example data\n```json\n{\n    \"ip_address\": \"154.67.8.42\"\n},\n{\n    \"ip_address\": \"10.0.0.5\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nfilter ipInSubnet(ip_address, '154.67.8.0/24')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nfilter ip_address.ipInSubnet('154.67.8.0/24')\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ip_address\": \"154.67.8.42\"\n}\n```\n\n\n"
  ipPrefix:
    description: "Return the CIDR subnet for a given IP address and subnet size.\n"
    syntax: "ipPrefix(ip: string, subnetSize: number): string\n"
    category: [Functions reference, IP, ipPrefix]
    content: "\n\n\n# `ipPrefix`\n\n## Description\n\n\nReturn the CIDR subnet for a given IP address and subnet size.\n\n\n## Syntax\n\nLike many functions in DataPrime, `ipPrefix` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nipPrefix(ip: string, subnetSize: number): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(ip: string).ipPrefix(subnetSize: number): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | ip | string | **true** | The IP address to process |    | subnetSize | number | **true** | Number of mask bits in the subnet, e.g. `10` produces a `/10` CIDR range |\n\n## Example\n\n\n**Use case: Derive the subnet from an IP address**\n\nCompute the subnet for a given IP when the number of mask bits is known.\n\n\n### Example data\n```json\n{\n    \"ip\": \"155.123.7.4\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate ip_subnet from ipPrefix(ip, 10)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate ip_subnet from ip.ipPrefix(10)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ip\": \"155.123.7.4\",\n    \"ip_subnet\": \"155.64.0.0/10\"\n}\n```\n\n\n"
  abs:
    description: "Returns the absolute value of a number. Useful for computing the total\ndifference between two values without regard to sign.\n"
    syntax: "abs(number: number): number\n"
    category: [Functions reference, Number, abs]
    content: "\n\n# `abs`\n\n## Description\n\n\nReturns the absolute value of a number. Useful for computing the total\ndifference between two values without regard to sign.\n\n\n## Syntax\n\nLike many functions in DataPrime, `abs` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nabs(number: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).abs(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | The value to convert to a positive number |\n\n## Example\n\n\n**Use case: Calculate the difference between two timestamps**\nGenerate a `time_difference` field based on two timestamp values. Using `abs` avoids worrying about which timestamp is greater.\n\n\n### Example data\n```json\n{\n    \"first_timestamp\": 1728636298,\n    \"second_timestamp\": 1728636358\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nsource logs | create time_difference from abs(first_timestamp - second_timestamp)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nsource logs | create time_difference from (first_timestamp - second_timestamp).abs()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"first_timestamp\": 1728636298,\n    \"second_timestamp\": 1728636358,\n    \"time_difference\": 60\n}\n```\n\n\n"
  ceil:
    description: "Returns the smallest integer greater than or equal to a number.\nFor example, `1.5` becomes `2`, and `8.1` becomes `9`.\n"
    syntax: "ceil(number: number): number\n"
    category: [Functions reference, Number, ceil]
    content: "\n\n# `ceil`\n\n## Description\n\n\nReturns the smallest integer greater than or equal to a number.\nFor example, `1.5` becomes `2`, and `8.1` becomes `9`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `ceil` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nceil(number: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).ceil(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | A numeric expression to round up |\n\n## Example\n\n\n**Use case: Calculate required SaaS licenses**\n\nWhen averaging license usage over time, results may include decimals. Since fractional licenses cannot be purchased, `ceil` ensures the number is rounded up to the nearest integer.\n\n\n### Example data\n```json\n{\n    \"total_licenses\": 100,\n    \"licenses_in_use\": 31,\n    \"timestamp\": \"2024-10-10T21:00:00Z\"\n},\n{\n    \"total_licenses\": 100,\n    \"licenses_in_use\": 35,\n    \"timestamp\": \"2024-10-11T21:00:00Z\"\n},\n{\n    \"total_licenses\": 100,\n    \"licenses_in_use\": 22,\n    \"timestamp\": \"2024-10-12T21:00:00Z\"\n},\n{\n    \"total_licenses\": 100,\n    \"licenses_in_use\": 54,\n    \"timestamp\": \"2024-10-13T21:00:00Z\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\naggregate ceil(avg(total_licenses)) as licenses_needed\n\n```\n///\n\n/// tab | Method notation\n```dataprime\naggregate total_licenses.avg().ceil() as licenses_needed\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"licenses_needed\": 36\n}\n```\n\n\n"
  floor:
    description: "Returns the largest integer less than or equal to a number.\nFor example, `1.5` becomes `1`, and `8.1` becomes `8`.\n"
    syntax: "floor(number: number): number\n"
    category: [Functions reference, Number, floor]
    content: "\n\n# `floor`\n\n## Description\n\n\nReturns the largest integer less than or equal to a number.\nFor example, `1.5` becomes `1`, and `8.1` becomes `8`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `floor` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nfloor(number: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).floor(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | A numeric expression to round down |\n\n## Example\n\n\n**Use case: Calculate required SaaS licenses**\n\nWhen averaging license usage over time, results may include decimals. Since you cannot buy fractional licenses, `floor` ensures the result is rounded down to the nearest whole number.\n\n\n### Example data\n```json\n{\n    \"total_licenses\": 100,\n    \"licenses_in_use\": 31,\n    \"timestamp\": \"2024-10-10T21:00:00Z\"\n},\n{\n    \"total_licenses\": 100,\n    \"licenses_in_use\": 35,\n    \"timestamp\": \"2024-10-11T21:00:00Z\"\n},\n{\n    \"total_licenses\": 100,\n    \"licenses_in_use\": 22,\n    \"timestamp\": \"2024-10-12T21:00:00Z\"\n},\n{\n    \"total_licenses\": 100,\n    \"licenses_in_use\": 54,\n    \"timestamp\": \"2024-10-13T21:00:00Z\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\naggregate floor(avg(total_licenses)) as licenses_needed\n\n```\n///\n\n/// tab | Method notation\n```dataprime\naggregate total_licenses.avg().floor() as licenses_needed\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"licenses_needed\": 35\n}\n```\n\n\n"
  fromBase:
    description: "Converts a string representation of a number in a given base into its numeric value.\n\nFor example, `\"101\"` in base `2` becomes `5` in base `10`.\n"
    syntax: "fromBase(string: string, radix: number): number\n"
    category: [Functions reference, Number, fromBase]
    content: "\n\n# `fromBase`\n\n## Description\n\n\nConverts a string representation of a number in a given base into its numeric value.\n\nFor example, `\"101\"` in base `2` becomes `5` in base `10`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `fromBase` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nfromBase(string: string, radix: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(string: string).fromBase(radix: number): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | string | string | **true** | The string containing the number |    | radix | number | **true** | The base of the string representation (e.g. hexadecimal is base `16`) |\n\n## Example\n\n\n**Use case: Parse a hexadecimal string**\n\nConvert a hexadecimal string to a numeric value so it can be used in calculations.\n\n\n### Example data\n```json\n{\n    \"hex_value\": \"FF00FF\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate num_value from fromBase(hex_value, 16)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate num_value from hex_value.fromBase(16)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"hex_value\": \"FF00FF\",\n    \"num_value\": 16711935\n}\n```\n\n\n\n"
  ln:
    description: "Computes the natural logarithm (base *e*) of a number.\n"
    syntax: "ln(number: number): number\n"
    category: [Functions reference, Number, ln]
    content: "\n\n# `ln`\n\n## Description\n\n\nComputes the natural logarithm (base *e*) of a number.\n\n\n## Syntax\n\nLike many functions in DataPrime, `ln` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nln(number: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).ln(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | The number whose natural logarithm will be computed |\n\n## Example\n\n\n**Use case: Model exponential growth with Euler's number and natural logarithm**\n\nCalculate the growth rate from observed data, then project future values using `e` and `ln`.\n\n\n### Example data\n```json\n{\n    \"initial_value\": 500,\n    \"current_value\": 1000,\n    \"time_since_start_hours\": 10\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate growth_rate from ((1 / time_since_start_hours) * (ln(current_value / initial_value)))\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate growth_rate from ((1 / time_since_start_hours) * ((current_value / initial_value).ln()))\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"initial_value\": 500,\n    \"current_value\": 1000,\n    \"time_since_start_hours\": 10,\n    \"growth_rate\": 0.0693,\n    \"prediction_in_ten_hours\": 1999.41\n}\n```\n\n\n"
  log:
    description: "Returns the logarithm of a number to a specified base.\nCommon uses include modeling compound interest, exponential growth or decay,\npH levels, and earthquake magnitudes.\n"
    syntax: "log(base: number, number: number): number\n"
    category: [Functions reference, Number, log]
    content: "\n\n# `log`\n\n## Description\n\n\nReturns the logarithm of a number to a specified base.\nCommon uses include modeling compound interest, exponential growth or decay,\npH levels, and earthquake magnitudes.\n\n\n## Syntax\n\nLike many functions in DataPrime, `log` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nlog(base: number, number: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(base: number).log(number: number): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | base | number | **true** | The logarithmic base (e.g. `2` for log base 2) |    | number | number | **true** | The value whose logarithm will be computed |\n\n## Example\n\n\n**Use case: Compute a log base 2 transformation**\n\nCalculate the log base 2 of a numerical field and store the result in a new field.\n\n\n### Example data\n```json\n{\n    \"some_value\": 16\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate log_field from log(2, some_value)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate log_field from 2.log(some_value)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"some_value\": 16,\n    \"log_field\": 4\n}\n```\n\n\n"
  log2:
    description: "Returns the base-2 logarithm of a number.\nEquivalent to `log(2, number)`.\n"
    syntax: "log2(number: number): number\n"
    category: [Functions reference, Number, log2]
    content: "\n\n# `log2`\n\n## Description\n\n\nReturns the base-2 logarithm of a number.\nEquivalent to `log(2, number)`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `log2` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nlog2(number: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).log2(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | The value whose base-2 logarithm will be computed |\n\n## Example\n\n\n**Use case: Apply a log base 2 transformation**\n\nCompute the log base 2 of a numerical field and store the result in a new field.\n\n\n### Example data\n```json\n{\n    \"some_value\": 16\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate log_field from log2(some_value)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate log_field from some_value.log2()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"some_value\": 16,\n    \"log_field\": 4\n}\n```\n\n\n"
  mod:
    description: "Returns the remainder after dividing a number by a divisor.\nEquivalent to the modulus operator (`%`).\n"
    syntax: "mod(number: number, divisor: number): number\n"
    category: [Functions reference, Number, mod]
    content: "\n\n# `mod`\n\n## Description\n\n\nReturns the remainder after dividing a number by a divisor.\nEquivalent to the modulus operator (`%`).\n\n\n## Syntax\n\nLike many functions in DataPrime, `mod` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nmod(number: number, divisor: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).mod(divisor: number): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | The value to divide |    | divisor | number | **true** | The divisor used for the modulus operation |\n\n## Example\n\n\n**Use case: Determine if a number is even or odd**\n\n  A value is even if dividing it by `2` leaves a remainder of `0`. Otherwise, it is odd.\n\n\n### Example data\n```json\n{\n    \"val\": 7\n},\n{\n    \"val\": 12\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_even from (mod(val, 2) == 0)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_even from (val.mod(2) == 0)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"val\": 7,\n    \"is_even\": false\n},\n{\n    \"val\": 12,\n    \"is_even\": true\n}\n```\n\n\n"
  pi:
    description: "Returns the mathematical constant π (pi), limited to 15 decimal places.\n"
    syntax: "pi(): number\n"
    category: [Functions reference, Number, pi]
    content: "\n\n# `pi`\n\n## Description\n\n\nReturns the mathematical constant π (pi), limited to 15 decimal places.\n\n\n## Syntax\n\n```dataprime\npi(): number\n\n```\n\n\n## Example\n\n\n**Use case: Compute the area of a circle**\n\nUse π with the formula *π × r²* to calculate the area of a circle given a radius in meters.\n\n\n### Example data\n```json\n{\n    \"distance_m\": 10\n}\n\n```\n\n\n### Example query\n\n```dataprime\ncreate area from (pi() * power(distance_m, 2))\n\n```\n\n### Example output\n\n```json\n{\n    \"distance_m\": 10,\n    \"area\": 314.1592653589793\n}\n```\n\n\n"
  power:
    description: "Returns the result of raising a number to the power of an exponent.\n"
    syntax: "power(number: number, exponent: number): number\n"
    category: [Functions reference, Number, power]
    content: "\n\n# `power`\n\n## Description\n\n\nReturns the result of raising a number to the power of an exponent.\n\n\n## Syntax\n\nLike many functions in DataPrime, `power` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\npower(number: number, exponent: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).power(exponent: number): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | The base value to raise |    | exponent | number | **true** | The exponent to raise the base to (e.g. `2` squares the base) |\n\n## Example\n\n\n**Use case: Square a number**\n\nRaise a numeric field to the power of 2 to calculate its square.\n\n\n### Example data\n```json\n{\n    \"num\": 7\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate num_squared from power(num, 2)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate num_squared from num.power(2)\n\n```\n///\n\n\n### Example output\n\n```json\n  {\n      \"num\": 7,\n      \"num_squared\": 49\n  }\n```\n\n\n"
  random:
    description: "Returns a pseudorandom decimal between `0` (inclusive) and `1` (exclusive).\n\n!!! note\n    `random` is not cryptographically secure.\n"
    syntax: "random(): number\n"
    category: [Functions reference, Number, random]
    content: "\n\n# `random`\n\n## Description\n\n\nReturns a pseudorandom decimal between `0` (inclusive) and `1` (exclusive).\n\n!!! note\n    `random` is not cryptographically secure.\n\n\n## Syntax\n\n```dataprime\nrandom(): number\n\n```\n\n\n## Example\n\n\n**Use case: Add a random decimal field**\n\nGenerate a pseudorandom number between `0` and `1` and attach it to each document.\n\n\n### Example data\n```json\n{\n    \"event\": \"login_attempt\"\n}\n\n```\n\n\n### Example query\n\n```dataprime\ncreate random_num from random()\n\n```\n\n### Example output\n\n```json\n{\n    \"event\": \"login_attempt\",\n    \"random_num\": 0.732145691\n}\n```\n\n\n"
  randomInt:
    description: "Returns a pseudorandom integer between `0` (inclusive) and an upper bound\n(exclusive).\n\n!!! note\n    `randomInt` is not cryptographically secure.\n"
    syntax: "randomInt(upperBound: number): number\n"
    category: [Functions reference, Number, randomInt]
    content: "\n\n# `randomInt`\n\n## Description\n\n\nReturns a pseudorandom integer between `0` (inclusive) and an upper bound\n(exclusive).\n\n!!! note\n    `randomInt` is not cryptographically secure.\n\n\n## Syntax\n\nLike many functions in DataPrime, `randomInt` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nrandomInt(upperBound: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(upperBound: number).randomInt(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | upperBound | number | **true** | The exclusive upper limit for the random number |\n\n## Example\n\n\n**Use case: Generate a random integer within a range**\n\nCreate a pseudorandom integer between `0` and `99` and attach it to each document.\n\n\n### Example data\n```json\n{\n    \"event\": \"login_attempt\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate random_num from randomInt(100)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate random_num from 100.randomInt()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"event\": \"login_attempt\",\n    \"random_num\": 57\n}\n```\n\n\n"
  round:
    description: "Returns a number rounded to the nearest integer or to a specified number of\ndecimal places.\nFor example, `1.5` becomes `2` and `8.1` becomes `8`.\n"
    syntax: "round(number: number, digits: number?): number\n"
    category: [Functions reference, Number, round]
    content: "\n\n# `round`\n\n## Description\n\n\nReturns a number rounded to the nearest integer or to a specified number of\ndecimal places.\nFor example, `1.5` becomes `2` and `8.1` becomes `8`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `round` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nround(number: number, digits: number?): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).round(digits: number?): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | The value to round |    | digits | number | **false** | Number of decimal places to round to. Defaults to `0` (whole numbers) |\n\n## Example\n\n\n**Use case: Round averages for discrete counts**\n\nCompute the average number of online users and round to a whole number for clarity.\nExample: `569.5` becomes `570`.\n\n**Use case 2: Round latency values for readability**\n\nWhen analyzing traces, average latency values may have long decimal places. Use `round` with `2` digits for cleaner results.\n\n\n### Example data\n```json\n{\n    \"total_users_online\": 1093\n},\n{\n    \"total_users_online\": 942\n},\n{\n    \"total_users_online\": 120\n},\n{\n    \"total_users_online\": 123\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\naggregate round(avg(total_users_online)) as average_users_online\n\n```\n///\n\n/// tab | Method notation\n```dataprime\naggregate total_users_online.avg().round() as average_users_online\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"average_users_online\": 570\n}\n```\n\n\n"
  sqrt:
    description: "Returns the square root of a number.\n\n!!! note\n    This is the inverse of `power(number, 2)`.\n"
    syntax: "sqrt(number: number): number\n"
    category: [Functions reference, Number, sqrt]
    content: "\n\n# `sqrt`\n\n## Description\n\n\nReturns the square root of a number.\n\n!!! note\n    This is the inverse of `power(number, 2)`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `sqrt` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nsqrt(number: number): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).sqrt(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | The value to compute the square root of |\n\n## Example\n\n\n**Use case: Compute rate of return over 2 years**\n\nCalculate the rate of return for an asset purchase and sale by taking the square root of the price ratio and subtracting 1.\n\n\n### Example data\n```json\n{\n    \"buyer\": \"Chris\",\n    \"asset\": \"DataDog\",\n    \"bought_at_price\": 100,\n    \"sold_at_price\": 10\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate ror from (sqrt(sold_at_price / bought_at_price) - 1)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate ror from ((sold_at_price / bought_at_price).sqrt() - 1)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"buyer\": \"Chris\",\n    \"asset\": \"DataDog\",\n    \"bought_at_price\": 100,\n    \"sold_at_price\": 10,\n    \"ror\": -0.683772233983162\n}\n```\n\n\n\n"
  toBase:
    description: "Converts a number into its string representation in a specified base.\n\nFor example, converting `10` into base `16` results in `\"a\"`.\n"
    syntax: "toBase(number: number, radix: number): string\n"
    category: [Functions reference, Number, toBase]
    content: "\n\n# `toBase`\n\n## Description\n\n\nConverts a number into its string representation in a specified base.\n\nFor example, converting `10` into base `16` results in `\"a\"`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `toBase` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ntoBase(number: number, radix: number): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).toBase(radix: number): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | The number to convert |    | radix | number | **true** | The base for the conversion (e.g. `16` for hexadecimal) |\n\n## Example\n\n\n**Use case: Convert numbers to hexadecimal**\n\nTransform a decimal value into a hexadecimal string for representation or further processing.\n\n\n### Example data\n```json\n{\n    \"val\": 10\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate val_hex from toBase(val, 16)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate val_hex from val.toBase(16)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"val\": 10,\n    \"val_hex\": \"a\"\n}\n```\n\n\n\n"
  byteLength:
    description: "Returns the number of bytes required to represent a UTF-8 encoded string.\n"
    syntax: "byteLength(value: string): number\n"
    category: [Functions reference, String, byteLength]
    content: "\n\n# `byteLength`\n\n## Description\n\n\nReturns the number of bytes required to represent a UTF-8 encoded string.\n\n\n## Syntax\n\nLike many functions in DataPrime, `byteLength` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nbyteLength(value: string): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).byteLength(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to measure in UTF-8 bytes |\n\n## Example\n\n\n**Compare character count vs. byte count for a UTF-8 encoded string**\n\nConsider the following document:\n\n```json\n{\n    \"time_taken_str\": \"100μs\"\n}\n```\n\nUsing `length` returns the number of characters:\n\n```dataprime\ncreate len from time_taken_str.length()\n```\n\nThis produces:\n\n```json\n{\n    \"time_taken_str\": \"100μs\",\n    \"len\": 5\n}\n```\n\nHowever, this does not reflect the true byte size. The character `μ` requires two bytes in UTF-8.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate byte_len from byteLength(time_taken_str)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate byte_len from time_taken_str.byteLength()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"time_taken_str\": \"100μs\",\n    \"byte_len\": 6\n}\n```\n\nThe four ASCII characters (`1`, `0`, `0`, `s`) each take one byte, and the `μ` symbol takes two bytes, for a total of six.\n\n\n\n"
  chr:
    description: "Converts a numeric Unicode code point into its corresponding string character.\n"
    syntax: "chr(value: number): string\n"
    category: [Functions reference, String, chr]
    content: "\n\n# `chr`\n\n## Description\n\n\nConverts a numeric Unicode code point into its corresponding string character.\n\n\n## Syntax\n\nLike many functions in DataPrime, `chr` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nchr(value: number): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: number).chr(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | number | **true** | The Unicode code point to convert into a character |\n\n## Example\n\n\n**Convert a numeric code point into a Unicode character**\n\nUsing `chr`, the numeric value can be rendered as its corresponding Unicode symbol. Consider the following document:\n\n\n### Example data\n```json\n{\n    \"emoji_numeric_value\": 10084\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate emoji_value from chr(emoji_numeric_value)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate emoji_value from emoji_numeric_value.chr()\n\n```\n///\n\n\n### Example output\n\nBoth notations produce:\n\n```json\n{\n    \"emoji_numeric_value\": 10084,\n    \"emoji_value\": \"❤\"\n}\n```\n\n\n\n"
  codepoint:
    description: "Converts a Unicode character into its numeric code point representation.\n"
    syntax: "codepoint(value: string): number\n"
    category: [Functions reference, String, codepoint]
    content: "\n\n# `codepoint`\n\n## Description\n\n\nConverts a Unicode character into its numeric code point representation.\n\n\n## Syntax\n\nLike many functions in DataPrime, `codepoint` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ncodepoint(value: string): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).codepoint(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The Unicode character to convert into a numeric code point |\n\n## Example\n\n\n**Convert a Unicode character into its numeric representation**\n\nUsing `codepoint`, the character can be translated into its numeric value. Consider the following document:\n\n\n### Example data\n```json\n{\n    \"emoji_value\": \"❤\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate emoji_numeric_value from codepoint(emoji_value)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate emoji_numeric_value from emoji_value.codepoint()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"emoji_value\": \"❤\",\n    \"emoji_numeric_value\": 10084\n}\n```\n\n\n"
  concat:
    description: "Joins multiple strings together and return the result as a single string.\n"
    syntax: "concat(value: string, ...values: string): string\n"
    category: [Functions reference, String, concat]
    content: "\n\n# `concat`\n\n## Description\n\n\nJoins multiple strings together and return the result as a single string.\n\n\n## Syntax\n\nLike many functions in DataPrime, `concat` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nconcat(value: string, ...values: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).concat(...values: string): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The first string to include in the result |    | ...values | string | **true** | Additional strings to concatenate, in order |\n\n## Example 1\n\n\n**Combine first and last names into a full name.**\n\nUse `concat` to build a `full_name` field:\n\n```json\n{\n    \"username\": \"prime4u\",\n    \"first_name\": \"Rick\",\n    \"last_name\": \"Ast\",\n}\n```\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate full_name from concat(first_name, ' ', last_name)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate full_name from first_name.concat(' ', last_name)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"username\": \"prime4u\",\n    \"first_name\": \"Rick\",\n    \"last_name\": \"Ast\",\n    \"full_name\": \"Rick Ast\"\n}\n```\n\n\n## Example 2\n\n\n**Use case 2: Build an Amazon ARN**\n\n```json\n{\n    \"aws\": {\n        \"region\": \"eu-west-1\",\n        \"instance_id\": \"i-02084e96d21517df8\",\n        \"account_number\": 74157727657\n    }\n}\n```\n\nAmazon ARNs follow the format:\n\n```\narn:aws:ec2:<region>:<account-number>:instance/<instance-id>\n```\n\nUse `concat` to construct the ARN:\n\n\n\n\n### Example query\n\n```dataprime\ncreate aws.instance_arn from concat('arn:aws:ec2:', aws.region, ':', aws.account_number, ':instance/', aws.instance_id)\n\n```\n\n### Example output\n\n```json\n{\n    \"aws\": {\n        \"region\": \"eu-west-1\",\n        \"instance_id\": \"i-02084e96d21517df8\",\n        \"account_number\": 74157727657,\n        \"instance_arn\": \"arn:aws:ec2:eu-west-1:74157727657:instance/i-02084e96d21517df8\"\n    }\n}\n```\n\n\n\n"
  contains:
    description: "Returns `true` if the given substring appears anywhere in a string; otherwise return `false`. The check is case sensitive. For case-insensitive matching, normalize both values with `toLowerCase()` or `toUpperCase()` before calling `contains`.\n"
    syntax: "contains(value: string, substring: string): bool\n"
    category: [Functions reference, String, contains]
    content: "\n\n# `contains`\n\n## Description\n\n\nReturns `true` if the given substring appears anywhere in a string; otherwise return `false`. The check is case sensitive. For case-insensitive matching, normalize both values with `toLowerCase()` or `toUpperCase()` before calling `contains`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `contains` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ncontains(value: string, substring: string): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).contains(substring: string): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The full string to search (haystack) |    | substring | string | **true** | The substring to look for within the full string (needle) |\n\n## Example 1\n\n\n**Check if an AWS Account ID appears in an ARN**\n\nSometimes only a broader field such as an ARN is available. Use `contains` to test for the presence of the account ID.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_from_account from contains(arn_field, '074157727657')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_from_account from arn_field.contains('074157727657')\n\n```\n///\n\n\n### Example output\n\nBoth notations produce a field `is_from_account` that is `true` if the ARN contains the account ID.\n\n\n## Example 2\n\n\n**Use case 2: Check if a domain appears within a URL**\n\nUse `contains` to verify if a domain name exists inside a given URL.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_from_google from contains(url, 'google.com')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_from_google from url.contains('google.com')\n\n```\n///\n\n\n### Example output\n\nBoth notations produce a field `is_from_google` that is `true` if the URL contains `google.com`.\n\n\n\n"
  decodeBase64:
    description: "Decodes a Base64-encoded string into its original value.\n"
    syntax: "decodeBase64(value: string): string\n"
    category: [Functions reference, String, decodeBase64]
    content: "\n\n# `decodeBase64`\n\n## Description\n\n\nDecodes a Base64-encoded string into its original value.\n\n\n## Syntax\n\nLike many functions in DataPrime, `decodeBase64` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ndecodeBase64(value: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).decodeBase64(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The Base64-encoded string to decode |\n\n## Example\n\n\n**Decode a Base64-encoded URL**\n\nConsider the following document:\n\n```json\n{\n    \"path\": \"/home\",\n    \"domain\": \"coralogix.com\",\n    \"full_url_encoded\": \"aHR0cHM6Ly9jb3JhbG9naXguY29tL2hvbWU=\" \n}\n```\n\nUse `decodeBase64` to recover the original URL:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate full_url from decodeBase64(full_url_encoded)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate full_url from full_url_encoded.decodeBase64()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"path\": \"/home\",\n    \"domain\": \"coralogix.com\",\n    \"full_url_encoded\": \"aHR0cHM6Ly9jb3JhbG9naXguY29tL2hvbWU=\",\n    \"full_url\": \"https://coralogix.com/home\"\n}\n```\n\n\n\n"
  encodeBase64:
    description: "Encodes a string into its Base64 representation.\n"
    syntax: "encodeBase64(value: string): string\n"
    category: [Functions reference, String, encodeBase64]
    content: "\n\n# `encodeBase64`\n\n## Description\n\n\nEncodes a string into its Base64 representation.\n\n\n## Syntax\n\nLike many functions in DataPrime, `encodeBase64` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nencodeBase64(value: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).encodeBase64(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to encode into Base64 |\n\n## Example\n\n\n**Encode a URL into Base64**\n\nConsider the following document:\n\n```json\n{\n    \"path\": \"/home\",\n    \"domain\": \"coralogix.com\",\n    \"full_url\": \"https://coralogix.com/home\"\n}\n```\n\nUse `encodeBase64` to transform the URL into a Base64-encoded string:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate full_url_encoded from encodeBase64(full_url)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate full_url_encoded from full_url.encodeBase64()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"path\": \"/home\",\n    \"domain\": \"coralogix.com\",\n    \"full_url\": \"https://coralogix.com/home\",\n    \"full_url_encoded\": \"aHR0cHM6Ly9jb3JhbG9naXguY29tL2hvbWU=\"\n}\n```\n\n\n\n"
  endsWith:
    description: "Returns `true` if a string ends with a given substring, otherwise return `false`.\n\n!!! note\n    Unlike `contains`, which checks for a substring anywhere in the string, `endsWith` only matches the end.\n"
    syntax: "endsWith(value: string, suffix: string): bool\n"
    category: [Functions reference, String, endsWith]
    content: "\n\n# `endsWith`\n\n## Description\n\n\nReturns `true` if a string ends with a given substring, otherwise return `false`.\n\n!!! note\n    Unlike `contains`, which checks for a substring anywhere in the string, `endsWith` only matches the end.\n\n\n## Syntax\n\nLike many functions in DataPrime, `endsWith` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nendsWith(value: string, suffix: string): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).endsWith(suffix: string): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to test |    | suffix | string | **true** | The substring to match against the end of the string |\n\n## Example\n\n\n**Check if an IBM Cloud CRN refers to a known COS bucket**\n\nIBM Cloud CRNs look like this:\n\n```\ncrn:v1:bluemix:public:cloud-object-storage:global:a/59bcbfa6ea2f006b4ed7094c1a08dcdd:1a0ec336-f391-4091-a6fb-5e084a4c56f4:bucket:mybucket\n```\n\nTo verify if the CRN points to `mybucket`, use `endsWith`:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_my_bucket from endsWith(crn, 'mybucket')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_my_bucket from crn.endsWith('mybucket')\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"crn\": \"crn:v1:bluemix:public:cloud-object-storage:global:a/59bcbfa6ea2f006b4ed7094c1a08dcdd:1a0ec336-f391-4091-a6fb-5e084a4c56f4:bucket:mybucket\",\n    \"is_my_bucket\": true\n}\n```\n\n\n\n"
  indexOf:
    description: "Returns the position of the first occurrence of a substring within a string.\n\nThe index is zero-based. If the substring is not found, the function returns `-1`.\n"
    syntax: "indexOf(value: string, substring: string): number\n"
    category: [Functions reference, String, indexOf]
    content: "\n\n# `indexOf`\n\n## Description\n\n\nReturns the position of the first occurrence of a substring within a string.\n\nThe index is zero-based. If the substring is not found, the function returns `-1`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `indexOf` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nindexOf(value: string, substring: string): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).indexOf(substring: string): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The full string to search (haystack) |    | substring | string | **true** | The substring to locate (needle) |\n\n## Example\n\n\n**Extract a value from a key-value style string**\n\nConsider the following document:\n\n```json\n{\n    \"msg\": \"result=Some value\"\n}\n```\n\nUse `indexOf` to find the position of `=` and then extract everything after it.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate index_of_value from (indexOf(msg, '='))\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate index_of_value from (msg.indexOf('='))\n\n```\n///\n\n\n### Example output\n\nWith the index known, you can extract the substring:\n\n```dataprime\ncreate value from msg.substr(index_of_value)\n```\n\nResult:\n\n```json\n{\n    \"msg\": \"result=Some value\",\n    \"index_of_value\": 6,\n    \"value\": \"Some value\"\n}\n```\n\n\n\n"
  length:
    description: "Returns the number of characters in a string.\n"
    syntax: "length(value: string): number\n"
    category: [Functions reference, String, length]
    content: "\n\n# `length`\n\n## Description\n\n\nReturns the number of characters in a string.\n\n\n## Syntax\n\nLike many functions in DataPrime, `length` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nlength(value: string): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).length(): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to measure |\n\n## Example\n\n\n**Count the number of characters in a string**\n\nConsider the following document:\n\n```json\n{\n    \"str_val\": \"such logs, much tracing, wow!\"\n}\n```\n\nUse `length` to count the number of characters:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate str_val_len from length(str_val)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate str_val_len from str_val.length()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"str_val\": \"such logs, much tracing, wow!\",\n    \"str_val_len\": 29\n}\n```\n\n\n\n"
  ltrim:
    description: "Removes whitespace from the start of a string while leaving the end unchanged.\n"
    syntax: "ltrim(value: string): string\n"
    category: [Functions reference, String, ltrim]
    content: "\n\n# `ltrim`\n\n## Description\n\n\nRemoves whitespace from the start of a string while leaving the end unchanged.\n\n\n## Syntax\n\nLike many functions in DataPrime, `ltrim` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nltrim(value: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).ltrim(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to trim |\n\n## Example\n\n\n**Clean up an extracted username**\n\n```json\n{\n  \"username\": \"   SyntaxTerror\"\n}\n```\n\nUse `ltrim` to remove the unwanted space:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate trimmed_user from ltrim(username)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate trimmed_user from username.ltrim()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"username\": \"   SyntaxTerror\",\n  \"trimmed_user\": \"SyntaxTerror\"\n}\n```\n\n\n\n"
  matches:
    description: "Returns `true` if a string matches a given regular expression. The expression is applied to the entire string; partial matches return `false`.\n"
    syntax: "matches(value: string, pattern: regexp): bool\n"
    category: [Functions reference, String, matches]
    content: "\n\n# `matches`\n\n## Description\n\n\nReturns `true` if a string matches a given regular expression. The expression is applied to the entire string; partial matches return `false`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `matches` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nmatches(value: string, pattern: regexp): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).matches(pattern: regexp): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to test |    | pattern | regexp | **true** | The regular expression to test against |\n\n## Example\n\n\n**Detect malformed fields**\n\nConsider the following documents:\n\n```json\n{ \"msg_structured\": \"User Chris bought 10 Sunglasses\" }\n{ \"msg_structured\": \"User James bought 1 Bed\" }\n{ \"msg_structured\": \"User Rick won't give you up\" }\n```\n\nThe third entry is incomplete. Use `matches` to filter out malformed values:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nfilter !matches(msg_structured, /User [a-z|A-Z]+ bought \\d+ [a-z|A-Z]+/)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nfilter !msg_structured.matches(/User [a-z|A-Z]+ bought \\d+ [a-z|A-Z]+/)\n\n```\n///\n\n\n### Example output\n\n```json\n{ \"msg_structured\": \"User Rick won't give you up\" }\n```\n\n\n\n"
  pad:
    description: "**Alias for [`padLeft`](padLeft).**\n\nAdds characters to the beginning of a string until it reaches the desired length.\nIf the string is longer than the target length, it is truncated from the end.\n\n!!! note\n    The `fillWith` argument must be a single-character string.\n"
    syntax: "pad(value: string, charCount: number, fillWith: string): string\n"
    category: [Functions reference, String, pad]
    content: "\n\n# `pad`\n\n## Description\n\n\n**Alias for [`padLeft`](padLeft).**\n\nAdds characters to the beginning of a string until it reaches the desired length.\nIf the string is longer than the target length, it is truncated from the end.\n\n!!! note\n    The `fillWith` argument must be a single-character string.\n\n\n## Syntax\n\nLike many functions in DataPrime, `pad` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\npad(value: string, charCount: number, fillWith: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).pad(charCount: number, fillWith: string): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to pad |    | charCount | number | **true** | Desired total length of the string; if smaller than current length, the string is truncated |    | fillWith | string | **true** | The single character used for padding |\n\n## Example\n\n\n**Ensure all strings are the same length**\n\nConsider the following documents:\n\n```json\n{ \"name\": \"Chris\" }\n{ \"name\": \"David\" }\n{ \"name\": \"John\" }\n```\n\nUse `pad` to make all names 10 characters long:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate name_padded from pad(name, 10, 'X')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate name_padded from name.pad(10, 'X')\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"name\": \"Chris\",\n    \"name_padded\": \"XXXXXChris\"\n}\n{\n    \"name\": \"David\",\n    \"name_padded\": \"XXXXXDavid\"\n}\n{\n    \"name\": \"John\",\n    \"name_padded\": \"XXXXXXJohn\"\n}\n```\n\n\n\n"
  padLeft:
    description: "Adds characters to the beginning of a string until it reaches the desired length.\nIf the string is longer than the target length, it is truncated from the end.\n\n!!! note\n    The `fillWith` argument must be a single-character string.\n"
    syntax: "padLeft(value: string, charCount: number, fillWith: string): string\n"
    category: [Functions reference, String, padLeft]
    content: "\n\n# `padLeft`\n\n## Description\n\n\nAdds characters to the beginning of a string until it reaches the desired length.\nIf the string is longer than the target length, it is truncated from the end.\n\n!!! note\n    The `fillWith` argument must be a single-character string.\n\n\n## Syntax\n\nLike many functions in DataPrime, `padLeft` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\npadLeft(value: string, charCount: number, fillWith: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).padLeft(charCount: number, fillWith: string): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to pad |    | charCount | number | **true** | Desired total length of the string; if smaller than current length, the string is truncated |    | fillWith | string | **true** | The single character used for padding |\n\n## Example\n\n\n**Ensure all strings are the same length**\n\nConsider the following documents:\n\n```json\n{ \"name\": \"Chris\" }\n{ \"name\": \"David\" }\n{ \"name\": \"John\" }\n```\n\nUse `padLeft` to make all names 10 characters long:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate name_padded from padLeft(name, 10, 'X')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate name_padded from name.padLeft(10, 'X')\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"name\": \"Chris\",\n    \"name_padded\": \"XXXXXChris\"\n}\n{\n    \"name\": \"David\",\n    \"name_padded\": \"XXXXXDavid\"\n}\n{\n    \"name\": \"John\",\n    \"name_padded\": \"XXXXXXJohn\"\n}\n```\n\n\n\n"
  padRight:
    description: "Adds characters to the end of a string until it reaches the desired length.\nIf the string is longer than the target length, it is truncated from the end.\n\n!!! note\n    The `fillWith` argument must be a single-character string.\n"
    syntax: "padRight(value: string, charCount: number, fillWith: string): string\n"
    category: [Functions reference, String, padRight]
    content: "\n\n# `padRight`\n\n## Description\n\n\nAdds characters to the end of a string until it reaches the desired length.\nIf the string is longer than the target length, it is truncated from the end.\n\n!!! note\n    The `fillWith` argument must be a single-character string.\n\n\n## Syntax\n\nLike many functions in DataPrime, `padRight` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\npadRight(value: string, charCount: number, fillWith: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).padRight(charCount: number, fillWith: string): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to pad |    | charCount | number | **true** | Desired total length of the string; if smaller than current length, the string is truncated |    | fillWith | string | **true** | The single character used for padding |\n\n## Example\n\n\n**Ensure all strings are the same length**\n\nConsider the following documents:\n\n```json\n{ \"name\": \"Chris\" }\n{ \"name\": \"David\" }\n{ \"name\": \"John\" }\n```\n\nUse `padRight` to make all names 10 characters long:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate name_padded from padRight(name, 10, 'X')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate name_padded from name.padRight(10, 'X')\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"name\": \"Chris\",\n    \"name_padded\": \"ChrisXXXXX\"\n}\n{\n    \"name\": \"David\",\n    \"name_padded\": \"DavidXXXXX\"\n}\n{\n    \"name\": \"John\",\n    \"name_padded\": \"JohnXXXXXX\"\n}\n```\n\n\n\n"
  regexpSplitParts:
    description: "Splits a string using a regular expression as the delimiter and return the token at the specified index.\nThe index starts at 1, not 0.\n"
    syntax: "regexpSplitParts(value: string, delimiter: regexp, index: number): string\n"
    category: [Functions reference, String, regexpSplitParts]
    content: "\n\n# `regexpSplitParts`\n\n## Description\n\n\nSplits a string using a regular expression as the delimiter and return the token at the specified index.\nThe index starts at 1, not 0.\n\n\n## Syntax\n\nLike many functions in DataPrime, `regexpSplitParts` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nregexpSplitParts(value: string, delimiter: regexp, index: number): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).regexpSplitParts(delimiter: regexp, index: number): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to split |    | delimiter | regexp | **true** | The regular expression used as the delimiter |    | index | number | **true** | The 1-based index of the token to return |\n\n## Example\n\n\n**Extract a value from inconsistently spaced key-value data**\n\nConsider the following document:\n\n```json\n{\n    \"values\": \"val=4 val2=8  val3=9   val4=10\"\n}\n```\n\nUse `regexpSplitParts` with a whitespace pattern to split the string and return the third token:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate val from regexpSplitParts(values, /\\s+/, 3)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate val from values.regexpSplitParts(/\\s+/, 3)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"values\": \"val=4 val2=8  val3=9   val4=10\",\n    \"val\": \"val3=9\"\n}\n```\n\n\n\n"
  rtrim:
    description: "Removes whitespace from the end of a string while leaving the beginning unchanged.\n"
    syntax: "rtrim(value: string): string\n"
    category: [Functions reference, String, rtrim]
    content: "\n\n# `rtrim`\n\n## Description\n\n\nRemoves whitespace from the end of a string while leaving the beginning unchanged.\n\n\n## Syntax\n\nLike many functions in DataPrime, `rtrim` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nrtrim(value: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).rtrim(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to trim |\n\n## Example\n\n\n**Clean up an extracted username**\n\nConsider the following document:\n\n```json\n{\n  \"username\": \"SyntaxTerror    \"\n}\n```\n\nUse `rtrim` to remove the unwanted space:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate trimmed_user from rtrim(username)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate trimmed_user from username.rtrim()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"username\": \"SyntaxTerror    \"\n  \"trimmed_user\": \"SyntaxTerror\"\n}\n```\n\n\n\n"
  splitParts:
    description: "Splits a string using a delimiter and return the token at the specified index.\nThe index starts at 1, not 0.\n"
    syntax: "splitParts(value: string, delimiter: string, index: number): string\n"
    category: [Functions reference, String, splitParts]
    content: "\n\n# `splitParts`\n\n## Description\n\n\nSplits a string using a delimiter and return the token at the specified index.\nThe index starts at 1, not 0.\n\n\n## Syntax\n\nLike many functions in DataPrime, `splitParts` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nsplitParts(value: string, delimiter: string, index: number): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).splitParts(delimiter: string, index: number): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to split |    | delimiter | string | **true** | The delimiter used to split the string |    | index | number | **true** | The 1-based index of the token to return |\n\n## Example\n\n\n**Extract the domain from an email address**\n\nConsider the following document:\n\n```json\n{\n    \"email\": \"chris@coralogix.com\"\n}\n```\n\nUse `splitParts` to extract the domain in one step:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate domain from splitParts(email, '@', 2)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate domain from email.splitParts('@', 2)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"email\": \"chris@coralogix.com\",\n    \"domain\": \"coralogix.com\"\n}\n```\n\n\n\n"
  startsWith:
    description: "Returns `true` if a string begins with a given substring, otherwise return `false`.\n\n!!! note\n    Unlike `contains`, which checks for a substring anywhere in the string, `startsWith` only matches the beginning.\n"
    syntax: "startsWith(value: string, prefix: string): bool\n"
    category: [Functions reference, String, startsWith]
    content: "\n\n# `startsWith`\n\n## Description\n\n\nReturns `true` if a string begins with a given substring, otherwise return `false`.\n\n!!! note\n    Unlike `contains`, which checks for a substring anywhere in the string, `startsWith` only matches the beginning.\n\n\n## Syntax\n\nLike many functions in DataPrime, `startsWith` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nstartsWith(value: string, prefix: string): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).startsWith(prefix: string): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The full string to test (haystack) |    | prefix | string | **true** | The substring to check at the start of the string (needle) |\n\n## Example\n\n\n**Check if a string is an IBM CRN**\n\nIBM Cloud CRNs look like this:\n\n```\ncrn:v1:bluemix:public:cloud-object-storage:global:a/59bcbfa6ea2f006b4ed7094c1a08dcdd:1a0ec336-f391-4091-a6fb-5e084a4c56f4:bucket:mybucket\n```\n\nTo confirm if a value is a CRN, check if it starts with `crn:`:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_crn from startsWith(crn, 'crn:')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_crn from crn.startsWith('crn:')\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"crn\": \"crn:v1:bluemix:public:cloud-object-storage:global:a/59bcbfa6ea2f006b4ed7094c1a08dcdd:1a0ec336-f391-4091-a6fb-5e084a4c56f4:bucket:mybucket\",\n    \"is_crn\": true\n}\n```\n\n\n\n"
  substr:
    description: "Extracts a substring from a string starting at a given position, with an optional length.\nUseful for simple value extraction without needing regular expressions.\n"
    syntax: "substr(value: string, from: number, length?: number): string\n"
    category: [Functions reference, String, substr]
    content: "\n\n# `substr`\n\n## Description\n\n\nExtracts a substring from a string starting at a given position, with an optional length.\nUseful for simple value extraction without needing regular expressions.\n\n\n## Syntax\n\nLike many functions in DataPrime, `substr` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nsubstr(value: string, from: number, length?: number): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).substr(from: number, length?: number): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to extract from |    | from | number | **true** | The starting index for the substring |    | length | number | **false** | Number of characters to return. Defaults to the remainder of the string |\n\n## Example\n\n\n**Extract the value after a delimiter**\n\nConsider the following document:\n\n```json\n{\n    \"msg\": \"result=Some value\"\n}\n```\n\nFirst, find the position of `=` with `indexOf`, then use `substr` to capture everything after it:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate index_of_value from (indexOf(msg, '=') + 1)\n| create value from substr(msg, index_of_value)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate index_of_value from (msg.indexOf('=') + 1)\n| create value from msg.substr(index_of_value)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"msg\": \"result=Some value\",\n    \"index_of_value\": 7,\n    \"value\": \"Some value\"\n}\n```\n\n\n\n"
  textSearch:
    description: "Searches for a text phrase within a target value.\n\nThe behavior depends on the type of the target:\n\n* **Primitive types** (`string`, `number`, `bool`, `interval`, `timestamp`, `regexp`, `enum`) are converted to strings before searching.\n* **Objects** are searched by their values (keys are ignored).\n* **Arrays** are searched by their elements.\n\nThe `phrase` must appear as one or more complete tokens. Tokens are defined during log parsing and are split on the following characters:\nwhitespace (`\\s`), `=`, `/`, `:`, `@`, `#`, `$`, `*`, `|`, `,`, `;`, `'`, `\"`, `(`, `[`, `{`, `}`, `)`, `]`, `&lt;`, `&gt;`, `.`, `_`, `-`.\n\nBecause of this, a search for `online` will not match `onlineboutique` (one token), but will match `online_boutique` (`online` and `boutique` are separate tokens).\nSimilarly, `Version 17` matches `Version 17.4 (Build 21E213)` because `Version` and `17` are two tokens, but `Vers` would not match because it is not a full token.\n"
    syntax: "textSearch(target: T, phrase: string): bool\n"
    category: [Functions reference, String, textSearch]
    content: "\n\n# `textSearch`\n\n## Description\n\n\nSearches for a text phrase within a target value.\n\nThe behavior depends on the type of the target:\n\n* **Primitive types** (`string`, `number`, `bool`, `interval`, `timestamp`, `regexp`, `enum`) are converted to strings before searching.\n* **Objects** are searched by their values (keys are ignored).\n* **Arrays** are searched by their elements.\n\nThe `phrase` must appear as one or more complete tokens. Tokens are defined during log parsing and are split on the following characters:\nwhitespace (`\\s`), `=`, `/`, `:`, `@`, `#`, `$`, `*`, `|`, `,`, `;`, `'`, `\"`, `(`, `[`, `{`, `}`, `)`, `]`, `<`, `>`, `.`, `_`, `-`.\n\nBecause of this, a search for `online` will not match `onlineboutique` (one token), but will match `online_boutique` (`online` and `boutique` are separate tokens).\nSimilarly, `Version 17` matches `Version 17.4 (Build 21E213)` because `Version` and `17` are two tokens, but `Vers` would not match because it is not a full token.\n\n\n## Syntax\n\nLike many functions in DataPrime, `textSearch` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ntextSearch(target: T, phrase: string): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(target: T).textSearch(phrase: string): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | target | T | **true** | Must be one of `string`, `bool`, `number`, `interval`, `timestamp`, `regexp`, or `enum`. Objects and arrays are also supported. |    | phrase | string | **true** | The search string. Must be a literal value, not the result of a calculation |\n\n## Example\n\n\n**Find a string in a complex object**\n\nUse `textSearch` to locate the value `\"mi\"` inside nested arrays and objects:\n\n\n### Example data\n```json\n{\n    \"doc\": {\n        \"id\": 1,\n        \"name\": \"woods\",\n        \"warning\": \"mi\",\n        \"details\": {\n        \"level\": 3,\n        \"message\": \"proceed cautiously\",\n        }\n    },\n    \"doc\": {\n        \"id\": 2,\n        \"type\": \"fortress\",\n        \"extra\": {\"fun_fact\": \"mi\"}\n    },\n    \"doc\": {\n        \"id\": 5,\n        \"village\": \"stonekeep\",\n        \"motto\": \"it is a curious place\",\n    }\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ntextSearch(doc, 'mi')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ndoc.textSearch('mi')\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    true,\n    true,\n    false\n}\n```\n\n\n\n"
  toLowerCase:
    description: "Converts all alphabetical characters in a string to lowercase.\n"
    syntax: "toLowerCase(value: string): string\n"
    category: [Functions reference, String, toLowerCase]
    content: "\n\n# `toLowerCase`\n\n## Description\n\n\nConverts all alphabetical characters in a string to lowercase.\n\n\n## Syntax\n\nLike many functions in DataPrime, `toLowerCase` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ntoLowerCase(value: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).toLowerCase(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to transform to lowercase |\n\n## Example\n\n\n**Normalize UUIDs for comparison**\n\nA direct comparison would fail due to differing cases. Use `toLowerCase` to normalize them:\n\n\n### Example data\n```json\n{\n    \"uuid1\": \"37367559-35f4-459c-943e-19025765da15\",\n    \"uuid2\": \"37367559-35F4-459C-943E-19025765DA15\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nfilter toLowerCase(uuid1) == toLowerCase(uuid2)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nfilter uuid1.toLowerCase() == uuid2.toLowerCase()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"uuid1\": \"37367559-35f4-459c-943e-19025765da15\",\n    \"uuid2\": \"37367559-35F4-459C-943E-19025765DA15\"\n}\n```\n\n\n\n"
  toUpperCase:
    description: "Converts all alphabetical characters in a string to uppercase.\n"
    syntax: "toUpperCase(value: string): string\n"
    category: [Functions reference, String, toUpperCase]
    content: "\n\n# `toUpperCase`\n\n## Description\n\n\nConverts all alphabetical characters in a string to uppercase.\n\n\n## Syntax\n\nLike many functions in DataPrime, `toUpperCase` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ntoUpperCase(value: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).toUpperCase(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to transform to uppercase |\n\n## Example\n\n\n**Normalize UUIDs for comparison**\n\nA direct comparison would fail due to differing cases. Use `toUpperCase` to normalize them:\n\n\n### Example data\n```json\n{\n    \"uuid1\": \"37367559-35f4-459c-943e-19025765da15\",\n    \"uuid2\": \"37367559-35F4-459C-943E-19025765DA15\"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nfilter toUpperCase(uuid1) == toUpperCase(uuid2)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nfilter uuid1.toUpperCase() == uuid2.toUpperCase()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"uuid1\": \"37367559-35f4-459c-943e-19025765da15\",\n    \"uuid2\": \"37367559-35F4-459C-943E-19025765DA15\"\n}\n```\n\n\n\n"
  trim:
    description: "Removes whitespace from both the start and end of a string.\n"
    syntax: "trim(value: string): string\n"
    category: [Functions reference, String, trim]
    content: "\n\n# `trim`\n\n## Description\n\n\nRemoves whitespace from both the start and end of a string.\n\n\n## Syntax\n\nLike many functions in DataPrime, `trim` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ntrim(value: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(value: string).trim(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | value | string | **true** | The string to trim |\n\n## Example\n\n\n**Clean up an extracted username**\n\nUse `trim` to remove the extra spaces:\n\n\n### Example data\n```json\n{\n  \"username\": \"    SyntaxTerror    \"\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate trimmed_user from trim(username)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate trimmed_user from username.trim()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"username\": \"    SyntaxTerror    \",\n  \"trimmed_user\": \"SyntaxTerror\"\n}\n```\n\n\n\n"
  addInterval:
    description: "Returns the sum of two intervals as a single interval value.\n\nFor example, adding an interval of `1d` (one day) to another `1d` produces `2d` (two days).\n\n!!! note\n    This function also supports negative intervals. For example, `1d + -1h` results in `23h`, following standard arithmetic rules where adding a negative is equivalent to subtraction.\n"
    syntax: "addInterval(left: interval, right: interval): interval\n"
    category: [Functions reference, Time, addInterval]
    content: "\n\n# `addInterval`\n\n## Description\n\n\nReturns the sum of two intervals as a single interval value.\n\nFor example, adding an interval of `1d` (one day) to another `1d` produces `2d` (two days).\n\n!!! note\n    This function also supports negative intervals. For example, `1d + -1h` results in `23h`, following standard arithmetic rules where adding a negative is equivalent to subtraction.\n\n\n## Syntax\n\nLike many functions in DataPrime, `addInterval` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\naddInterval(left: interval, right: interval): interval\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(left: interval).addInterval(right: interval): interval\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | left | interval | **true** | The first interval to add |    | right | interval | **true** | The second interval to add |\n\n## Example\n\n\n**Use case: Compute total processing time across different units**\n\nA document contains both a loading duration in milliseconds and processing timestamps in seconds. To compute the full duration of the transaction, convert the millisecond value to an interval, compute the processing interval, and add them together.\n\n```json\n{\n    \"loading_duration_ms\": 5432,\n    \"processing_start_time\": 1728582889,\n    \"processing_end_time\": 1728582899\n}\n```\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate processing_duration from diffTime(processing_start_time, processing_end_time)\n| create total_duration from addInterval(loading_duration_ms.toInterval('ms'), processing_duration)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate processing_duration from processing_start_time.diffTime(processing_end_time)\n| create total_duration from addInterval(loading_duration_ms.toInterval('ms'), processing_duration)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"loading_duration_ms\": 5432,\n    \"processing_start_time\": 1728582889,\n    \"processing_end_time\": 1728582899,\n    \"processing_duration\": \"10s\",\n    \"total_duration\": \"15432ms\"\n}\n```\n\n\n"
  addTime:
    description: "Returns a new timestamp by adding an interval to an existing timestamp.\n\nBoth `timestamp` and `interval` are first-class types in DataPrime, so ensure that the correct types are passed.\n\n!!! note\n    Negative intervals are supported and act as subtraction. For example, adding `-1h` to a timestamp subtracts one hour.\n"
    syntax: "addTime(t: timestamp, i: interval): timestamp\n"
    category: [Functions reference, Time, addTime]
    content: "\n\n# `addTime`\n\n## Description\n\n\nReturns a new timestamp by adding an interval to an existing timestamp.\n\nBoth `timestamp` and `interval` are first-class types in DataPrime, so ensure that the correct types are passed.\n\n!!! note\n    Negative intervals are supported and act as subtraction. For example, adding `-1h` to a timestamp subtracts one hour.\n\n\n## Syntax\n\nLike many functions in DataPrime, `addTime` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\naddTime(t: timestamp, i: interval): timestamp\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(t: timestamp).addTime(i: interval): timestamp\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | t | timestamp | **true** | The base timestamp to modify |    | i | interval | **true** | The interval to add (or subtract, if negative) |\n\n## Example\n\n\n**Use case: Compute an event’s end time from its start time and duration**\n\nA log contains a `start_timestamp` field and a `duration` field in seconds. Convert the duration to an interval, then add it to the start time to calculate the event's `end_timestamp`.\n\n```json\n{\n  \"start_timestamp\": 1728582889,\n  \"duration\": 120\n}\n```\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate end_timestamp from addTime(start_timestamp, duration.toInterval('s'))\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate end_timestamp from start_timestamp.addTime(duration.toInterval('s'))\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"start_timestamp\": 1728582889,\n  \"duration\": 120,\n  \"end_timestamp\": 1728583009\n}\n```\n\n\n"
  diffTime:
    description: "Returns the duration between two timestamps as an interval.\n\nThe result is not the absolute difference:\n\n* Positive if `to > from`\n* Negative if `to < from`\n"
    syntax: "diffTime(to: timestamp, from: timestamp): interval\n"
    category: [Functions reference, Time, diffTime]
    content: "\n\n# `diffTime`\n\n## Description\n\n\nReturns the duration between two timestamps as an interval.\n\nThe result is not the absolute difference:\n\n* Positive if `to > from`\n* Negative if `to < from`\n\n\n## Syntax\n\nLike many functions in DataPrime, `diffTime` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ndiffTime(to: timestamp, from: timestamp): interval\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(to: timestamp).diffTime(from: timestamp): interval\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | to | timestamp | **true** | The timestamp to compare (typically the later time) |    | from | timestamp | **true** | The timestamp to compare (typically the earlier time) |\n\n## Example\n\n\n**Use case: Measure process duration**\n\nA document contains start and end timestamps for a process. Use `diffTime` to compute the elapsed interval.\n\n```json\n{\n  \"processing_start_time\": 1728636298,\n  \"processing_end_time\": 1728636358\n}\n```\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate time_taken_duration from diffTime(processing_start_time, processing_end_time)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate time_taken_duration from processing_start_time.diffTime(processing_end_time)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"processing_start_time\": 1728636298,\n  \"processing_end_time\": 1728636358,\n  \"time_taken_duration\": \"50s\"\n}\n```\n\n\n"
  extractTime:
    description: "Returns a specific unit of time extracted from a timestamp, such as the hour, minute, or second.\n\n!!! note\n    * Date units such as `'month'` or `'week'` start from **1**, not 0.\n    * Units smaller than `minute` return floating-point numbers; all others return integers.\n"
    syntax: "extractTime(timestamp: timestamp, unit: dateunit | timeunit, tz?: string): number\n"
    category: [Functions reference, Time, extractTime]
    content: "\n\n# `extractTime`\n\n## Description\n\n\nReturns a specific unit of time extracted from a timestamp, such as the hour, minute, or second.\n\n!!! note\n    * Date units such as `'month'` or `'week'` start from **1**, not 0.\n    * Units smaller than `minute` return floating-point numbers; all others return integers.\n\n\n## Syntax\n\nLike many functions in DataPrime, `extractTime` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nextractTime(timestamp: timestamp, unit: dateunit | timeunit, tz?: string): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(timestamp: timestamp).extractTime(unit: dateunit | timeunit, tz?: string): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | timestamp | timestamp | **true** | The timestamp to extract from |    | unit | dateunit \\| timeunit | **true** | The unit of time to extract, in short or long notation |    | tz | string | **false** | A valid time zone string (see Time Zone section for details) |\n\n## Example 1\n\n\n**Use case: Find the hour in a specific time zone**\n\nExtract the hour of the day from a timestamp, adjusted to Tokyo time.\n\n\n### Example data\n```json\n{\n  \"timestamp\": 1728636298\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose extractTime($m.timestamp, 'h', 'Asia/Tokyo') as h\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose $m.timestamp.extractTime('h', 'Asia/Tokyo') as h\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"h\": 20\n}\n```\n\n\n## Example 2\n\n\n**Use case 2: Extract the number of seconds**\n\nExtract just the seconds portion of a timestamp.\n\n\n### Example data\n```json\n{\n  \"timestamp\": 1728636298\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose extractTime(timestamp, 'second') as s\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose timestamp.extractTime('second') as s\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"s\": 13.0\n}\n```\n\n\n"
  formatInterval:
    description: "Returns an interval rendered as a string, with optional control over which time unit is displayed.\n"
    syntax: "formatInterval(interval: interval, scale?: timeunit): string\n"
    category: [Functions reference, Time, formatInterval]
    content: "\n\n# `formatInterval`\n\n## Description\n\n\nReturns an interval rendered as a string, with optional control over which time unit is displayed.\n\n\n## Syntax\n\nLike many functions in DataPrime, `formatInterval` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nformatInterval(interval: interval, scale?: timeunit): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(interval: interval).formatInterval(scale?: timeunit): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | interval | interval | **true** | The interval to format |    | scale | timeunit | **false** | The largest unit to display.\nDoes not cascade into smaller units.\nDefaults to `nano`.\n |\n\n## Example\n\n\n**Use case: Render an interval in seconds**\n\nEven if the interval is 5 minutes, you may want to render it as `300s`. Use the `scale` argument to specify seconds.\n\n```json\n{\n  \"timestamp\": 1728636298\n}\n```\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose formatInterval(now() - $m.timestamp, 'seconds') as seconds_elapsed\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose (now() - $m.timestamp).formatInterval('seconds') as seconds_elapsed\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"seconds_elapsed\": \"300s\"\n}\n```\n\n\n"
  formatTimestamp:
    description: "Returns a timestamp formatted as a string, with optional control over the output format and time zone.\n"
    syntax: "formatTimestamp(timestamp: timestamp, format?: string, tz?: string): string\n"
    category: [Functions reference, Time, formatTimestamp]
    content: "\n\n# `formatTimestamp`\n\n## Description\n\n\nReturns a timestamp formatted as a string, with optional control over the output format and time zone.\n\n\n## Syntax\n\nLike many functions in DataPrime, `formatTimestamp` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nformatTimestamp(timestamp: timestamp, format?: string, tz?: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(timestamp: timestamp).formatTimestamp(format?: string, tz?: string): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | timestamp | timestamp | **true** | The timestamp to format |    | format | string | **false** | The format specification. Defaults to `iso8601` |    | tz | string | **false** | A valid time zone string (see Time Zone section for details) |\n\n## Example 1\n\n\nPrint a timestamp with a +5h offset using the default format**\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose formatTimestamp($m.timestamp, tz='+05') as ts\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose $m.timestamp.formatTimestamp(tz='+05') as ts\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ts\": \"2023-08-29T19:08:37.405937400+0500\"\n}\n```\n\n\n## Example 2\n\n\n**Use case 2: Print only the year and month**\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose formatTimestamp($m.timestamp, '%Y-%m') as ym\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose $m.timestamp.formatTimestamp('%Y-%m') as ym\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ym\": \"2023-08\"\n}\n```\n\n\n## Example 3\n\n\n**Use case 3: Print only the hours and minutes**\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose formatTimestamp($m.timestamp, '%H:%M') as hm\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose $m.timestamp.formatTimestamp('%H:%M') as hm\n\n```\n///\n\n\n### Example output\n\n```json\n{\n\"hm\": \"14:11\"\n}\n```\n\n\n## Example 4\n\n\n**Use case 4: Print a timestamp in milliseconds (13 digits)**\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose formatTimestamp($m.timestamp, 'timestamp_milli') as ms\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose $m.timestamp.formatTimestamp('timestamp_milli') as ms\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ms\": \"1693318678696\"\n}\n```\n\n\n"
  fromUnixTime:
    description: "Returns a parsed timestamp from a numeric Unix time value.\n\nThe Unix epoch starts on January 1, 1970. Timestamps before this are represented by negative numbers.\n"
    syntax: "fromUnixTime(unixTime: number, timeUnit?: timeunit): timestamp\n"
    category: [Functions reference, Time, fromUnixTime]
    content: "\n\n# `fromUnixTime`\n\n## Description\n\n\nReturns a parsed timestamp from a numeric Unix time value.\n\nThe Unix epoch starts on January 1, 1970. Timestamps before this are represented by negative numbers.\n\n\n## Syntax\n\nLike many functions in DataPrime, `fromUnixTime` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nfromUnixTime(unixTime: number, timeUnit?: timeunit): timestamp\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(unixTime: number).fromUnixTime(timeUnit?: timeunit): timestamp\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | unixTime | number | **true** | The Unix timestamp to convert |    | timeUnit | timeunit | **false** | The unit of the Unix timestamp. Defaults to `milli` |\n\n## Example\n\n\n**Use case: Convert a numeric Unix timestamp to a proper timestamp**\n\nInterpret a numeric value as milliseconds since the epoch and convert it into a `timestamp`.\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose fromUnixTime(1658958157515, 'ms') as ts\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose 1658958157515.fromUnixTime('ms') as ts\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"ts\": 1658958157515000000\n}\n```\n\n\n"
  multiplyInterval:
    description: "Returns an interval multiplied by a numeric factor, allowing extrapolation over time.\n\n!!! note\n    Both integer and decimal factors are supported.\n"
    syntax: "multiplyInterval(i: interval, factor: number): interval\n"
    category: [Functions reference, Time, multiplyInterval]
    content: "\n\n# `multiplyInterval`\n\n## Description\n\n\nReturns an interval multiplied by a numeric factor, allowing extrapolation over time.\n\n!!! note\n    Both integer and decimal factors are supported.\n\n\n## Syntax\n\nLike many functions in DataPrime, `multiplyInterval` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nmultiplyInterval(i: interval, factor: number): interval\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(i: interval).multiplyInterval(factor: number): interval\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | i | interval | **true** | The interval to multiply |    | factor | number | **true** | The multiplier to apply to the interval |\n\n## Example\n\n\n**Use case: Estimate total processing time for queued jobs**\n\nA document tracks how many jobs remain in the queue and the average time per job in seconds. Multiply the per-job interval by the number of jobs to calculate the total wait time.\n\n```json\n{\n    \"jobs_in_queue\": 25,\n    \"time_per_job_seconds\": 30\n}\n```\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate overall_wait_time from toInterval(time_per_job_seconds, 's').multiplyInterval(jobs_in_queue)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate overall_wait_time from time_per_job_seconds.toInterval('s').multiplyInterval(jobs_in_queue)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"jobs_in_queue\": 25,\n    \"time_per_job_seconds\": 30,\n    \"overall_wait_time\": \"12m30s\"\n}\n```\n\n\n"
  now:
    description: "Returns the current time as a timestamp at query execution.\n\n* Produces nanosecond precision if supported by the runtime, otherwise falls back to milliseconds.\n* Always returns the same value across multiple invocations within the same query.\n"
    syntax: "now(): timestamp\n"
    category: [Functions reference, Time, now]
    content: "\n\n# `now`\n\n## Description\n\n\nReturns the current time as a timestamp at query execution.\n\n* Produces nanosecond precision if supported by the runtime, otherwise falls back to milliseconds.\n* Always returns the same value across multiple invocations within the same query.\n\n\n## Syntax\n\n```dataprime\nnow(): timestamp\n\n```\n\n\n## Example\n\n\n**Capture the current time**\n\nCreate a new field with the timestamp of when the query was executed.\n\n\n\n\n### Example query\n\n```dataprime\ncreate now_time from now()\n\n```\n\n### Example output\n\n```json\n{\n  \"now_time\": 1728636400000000000\n}\n```\n\n\n"
  parseInterval:
    description: "Returns an interval parsed from a string representation such as `2d` or `35m10s`, enabling calculations with durations.\n\nA valid string must follow these rules:\n\n* Format: `NdNhNmNsNmsNusNns` where `N` is a non-negative integer\n* At least one time unit must be present\n* No unit may appear more than once (`1d2d` is invalid)\n* Units must appear in descending order (days → nanoseconds). `1d1s` is valid; `1s1d` is not\n* A leading `-` is allowed to indicate a negative interval (the only valid position for `-`)\n* If the format is invalid, the function returns `null`\n"
    syntax: "parseInterval(string: string): interval\n"
    category: [Functions reference, Time, parseInterval]
    content: "\n\n# `parseInterval`\n\n## Description\n\n\nReturns an interval parsed from a string representation such as `2d` or `35m10s`, enabling calculations with durations.\n\nA valid string must follow these rules:\n\n* Format: `NdNhNmNsNmsNusNns` where `N` is a non-negative integer\n* At least one time unit must be present\n* No unit may appear more than once (`1d2d` is invalid)\n* Units must appear in descending order (days → nanoseconds). `1d1s` is valid; `1s1d` is not\n* A leading `-` is allowed to indicate a negative interval (the only valid position for `-`)\n* If the format is invalid, the function returns `null`\n\n\n## Syntax\n\nLike many functions in DataPrime, `parseInterval` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nparseInterval(string: string): interval\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(string: string).parseInterval(): interval\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | string | string | **true** | The string to parse into an interval |\n\n## Example\n\n\n**Use case: Parse an interval string and add it to a timestamp**\n\nA log includes a timestamp and a `completed_in` field with a duration string. Parse the string to an interval, then add it to the timestamp to calculate the job’s completion time.\n\n```json\n{\n  \"timestamp\": 1728763337,\n  \"job_name\": \"BUILD_VIDEO\",\n  \"completed_in\": \"35m10s\"\n}\n```\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate completed_time from addTime(timestamp, parseInterval(completed_in))\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate completed_time from timestamp.addTime(completed_in.parseInterval())\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"timestamp\": 1728763337,\n  \"job_name\": \"BUILD_VIDEO\",\n  \"completed_in\": \"35m10s\",\n  \"completed_time\": 1728765447\n}\n```\n\n\n"
  parseTimestamp:
    description: "Returns a parsed timestamp from a date or time string, enabling use of DataPrime's time functions.\n\n!!! note\n    If the string cannot be parsed (for example, if it does not match the expected format), the function returns `null`.\n"
    syntax: "parseTimestamp(string: string, format?: string, tz?: string): timestamp\n"
    category: [Functions reference, Time, parseTimestamp]
    content: "\n\n# `parseTimestamp`\n\n## Description\n\n\nReturns a parsed timestamp from a date or time string, enabling use of DataPrime's time functions.\n\n!!! note\n    If the string cannot be parsed (for example, if it does not match the expected format), the function returns `null`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `parseTimestamp` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nparseTimestamp(string: string, format?: string, tz?: string): timestamp\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(string: string).parseTimestamp(format?: string, tz?: string): timestamp\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | string | string | **true** | The string to parse into a timestamp |    | format | string | **false** | The format of the input string. Defaults to `auto`, which attempts to match against well-known formats. |    | tz | string | **false** | A valid time zone string |\n\n## Example 1\n\n\n**Use case: Parse a simple date string using default format**\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose parseTimestamp('2023-04-05') as ts\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose '2023-04-05'.parseTimestamp() as ts\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ts\": 1680652800000000000\n}\n```\n\n\n## Example 2\n\n\n**Use case: Parse a US-style date**\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose parseTimestamp('04/05/23', '%D') as ts\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose '04/05/23'.parseTimestamp('%D') as ts\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ts\": 1680652800000000000\n}\n```\n\n\n## Example 3\n\n\n**Use case 3: Parse date and time with units**\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose parseTimestamp('2023-04-05 16h07m', '%F %Hh%Mm') as ts\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose '2023-04-05 16h07m'.parseTimestamp('%F %Hh%Mm') as ts\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ts\": 1680710820000000000\n}\n```\n\n\n## Example 4\n\n\n**Use case 4: Parse a Unix timestamp in seconds**\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nchoose parseTimestamp('1680710853', 'timestamp_second') as ts\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nchoose '1680710853'.parseTimestamp('timestamp_second') as ts\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ts\": 1680710853000000000\n}\n```\n\n\n## Example 5\n\n\n**Use case 5: Parse inconsistent formats with multiple options**\n\nSome logs contain timestamps in different formats. Provide a `|`-separated list of formats to handle them all.\n\n\n### Example data\n```json\n{ \"ts\": \"1680710853123\", \"app\": \"app1\" },\n{ \"ts\": \"2023-04-05\", \"app\": \"app2\" },\n{ \"ts\": \"2023-04-05T16:07:33.123Z\", \"app\": \"app3\" }\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate ts_parsed from parseTimestamp(ts, 'timestamp_second|%Y-%m-%d|iso8601')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate ts_parsed from ts.parseTimestamp('timestamp_second|%Y-%m-%d|iso8601')\n\n```\n///\n\n\n### Example output\n\n```json\n{ \"ts\": \"1680710853123\", \"app\": \"app1\", \"ts_parsed\": 1680710853123000000 },\n{ \"ts\": \"2023-04-05\", \"app\": \"app2\", \"ts_parsed\": 1680652800000000000 },\n{ \"ts\": \"2023-04-05T16:07:33.123Z\", \"app\": \"app3\", \"ts_parsed\": 1680710853123000000 }\n```\n\n\n"
  parseToTimestamp:
    description: "Returns a timestamp parsed from a date/time string with an optional format specification and time zone override. See [`parseTimestamp`](parseTimestamp) for details.\n"
    syntax: "parseToTimestamp(string: string, format?: string, tz?: string): timestamp\n"
    category: [Functions reference, Time, parseToTimestamp]
    content: "\n\n# `parseToTimestamp`\n\n## Description\n\n\nReturns a timestamp parsed from a date/time string with an optional format specification and time zone override. See [`parseTimestamp`](parseTimestamp) for details.\n\n\n## Syntax\n\nLike many functions in DataPrime, `parseToTimestamp` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nparseToTimestamp(string: string, format?: string, tz?: string): timestamp\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(string: string).parseToTimestamp(format?: string, tz?: string): timestamp\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | string | string | **true** | The date/time string to parse |    | format | string | **false** | The format of the input string. Defaults to `auto` |    | tz | string | **false** | A valid time zone string |\n\n"
  roundInterval:
    description: "Returns an interval rounded down to a specified precision. All time units smaller than the specified `timeunit` are zeroed out.\n"
    syntax: "roundInterval(interval: interval, scale: timeunit): interval\n"
    category: [Functions reference, Time, roundInterval]
    content: "\n\n# `roundInterval`\n\n## Description\n\n\nReturns an interval rounded down to a specified precision. All time units smaller than the specified `timeunit` are zeroed out.\n\n\n## Syntax\n\nLike many functions in DataPrime, `roundInterval` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nroundInterval(interval: interval, scale: timeunit): interval\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(interval: interval).roundInterval(scale: timeunit): interval\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | interval | interval | **true** | The interval to round |    | scale | timeunit | **true** | The unit to round to, zeroing out smaller units |\n\n## Example\n\n\n**Use case: Bucket intervals into whole hours**\n\nSpans contain a `duration` interval in `$m` - the metadata. Use `roundInterval` to reduce precision to hours, then format and group by these buckets.\n\n\n### Example data\n```json\n{ \"duration\": \"2h10m15s\", ... },\n{ \"duration\": \"3h8m15s\", ... },\n{ \"duration\": \"5d2h22m46s\", ... },\n{ \"duration\": \"53m15s\", ... }\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate time_bucket from roundInterval(duration, 'h')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate time_bucket from duration.roundInterval('h')\n\n```\n///\n\n\n### Example output\n\n```json\n{ \"duration\": \"2h10m15s\", \"time_bucket\": \"2h\", ... },\n{ \"duration\": \"5d2h22m46s\",  \"time_bucket\": \"5d2h\", ... },\n{ \"duration\": \"3h10m15s\", \"time_bucket\": \"3h\", ... },\n{ \"duration\": \"53m15s\",   \"time_bucket\": \"0ns\", ... }\n```\n\n\n"
  roundTime:
    description: "Returns a timestamp rounded down to the nearest interval.\n\n!!! note\n    Functionally equivalent to dividing a timestamp by an interval: `timestamp / interval`.\n"
    syntax: "roundTime(sourceTimestamp: timestamp, timeInterval: interval): timestamp\n"
    category: [Functions reference, Time, roundTime]
    content: "\n\n# `roundTime`\n\n## Description\n\n\nReturns a timestamp rounded down to the nearest interval.\n\n!!! note\n    Functionally equivalent to dividing a timestamp by an interval: `timestamp / interval`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `roundTime` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nroundTime(sourceTimestamp: timestamp, timeInterval: interval): timestamp\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(sourceTimestamp: timestamp).roundTime(timeInterval: interval): timestamp\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | sourceTimestamp | timestamp | **true** | The timestamp to round |    | timeInterval | interval | **true** | The interval that defines the rounding precision |\n\n## Example\n\n\n**Use case: Group timestamps into one-hour buckets**\n\nRound event timestamps to one-hour buckets and count `CREATE` actions per bucket.\n\n\n### Example data\n```json\n{ \"ts\": 1728763337, \"action\": \"CREATE\" },\n{ \"ts\": 1728751234, \"action\": \"CREATE\" },\n{ \"ts\": 1728734567, \"action\": \"UPDATE\" },\n{ \"ts\": 1728763312, \"action\": \"DELETE\" }\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nfilter action == \"CREATE\"\n| groupby roundTime(ts, 1h) as time_bucket agg count() as create_count\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nfilter action == \"CREATE\"\n| groupby ts.roundTime(1h) as time_bucket agg count() as create_count\n\n```\n///\n\n\n### Example output\n\n```json\n{ \"time_bucket\": 1728763200000000000, \"create_count\": 2 },\n{ \"time_bucket\": 1728748800000000000, \"create_count\": 1 },\n{ \"time_bucket\": 1728734400000000000, \"create_count\": 1 }\n```\n\n\n"
  subtractInterval:
    description: "Returns the result of subtracting one interval from another.\n\n!!! note\n    Equivalent to `addInterval(left, -right)` or `left - right`.\n"
    syntax: "subtractInterval(left: interval, right: interval): interval\n"
    category: [Functions reference, Time, subtractInterval]
    content: "\n\n# `subtractInterval`\n\n## Description\n\n\nReturns the result of subtracting one interval from another.\n\n!!! note\n    Equivalent to `addInterval(left, -right)` or `left - right`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `subtractInterval` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nsubtractInterval(left: interval, right: interval): interval\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(left: interval).subtractInterval(right: interval): interval\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | left | interval | **true** | The interval to subtract from |    | right | interval | **true** | The interval to subtract |\n\n## Example\n\n\n**Use case: Calculate idle time**\n\nA log tracks total time taken, as well as processing and loading durations. Subtract the sum of processing and loading from the total to compute idle time.\n\n```json\n{\n    \"event\": \"PROCESSING_COMPLETE\",\n    \"timestamp\": 1728763337,\n    \"total_time_taken\": \"1m\",\n    \"processing_time_taken\": \"30s\",\n    \"loading_time_taken\": \"28s\"\n}\n```\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate idle_time from subtractInterval(total_time_taken, loading_time_taken + processing_time_taken)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate idle_time from total_time_taken.subtractInterval(loading_time_taken + processing_time_taken)\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"event\": \"PROCESSING_COMPLETE\",\n    \"timestamp\": 1728763337,\n    \"total_time_taken\": \"1m\",\n    \"processing_time_taken\": \"30s\",\n    \"loading_time_taken\": \"28s\",\n    \"idle_time\": \"2s\"\n}\n```\n\n\n"
  subtractTime:
    description: "Returns a timestamp reduced by a given interval.\n\n!!! note\n    Equivalent to `addTime(t, -i)` or `t - i`, where `t` is a timestamp and `i` is an interval.\n"
    syntax: "subtractTime(t: timestamp, i: interval): timestamp\n"
    category: [Functions reference, Time, subtractTime]
    content: "\n\n# `subtractTime`\n\n## Description\n\n\nReturns a timestamp reduced by a given interval.\n\n!!! note\n    Equivalent to `addTime(t, -i)` or `t - i`, where `t` is a timestamp and `i` is an interval.\n\n\n## Syntax\n\nLike many functions in DataPrime, `subtractTime` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nsubtractTime(t: timestamp, i: interval): timestamp\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(t: timestamp).subtractTime(i: interval): timestamp\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | t | timestamp | **true** | The timestamp to modify |    | i | interval | **true** | The interval to subtract from the timestamp |\n\n## Example\n\n\n**Use case: Calculate process start time**\n\nA log records a completion timestamp and a process duration in seconds. Convert the duration to an interval and subtract it from the completion time to calculate when the process started.\n\n```json\n{\n    \"timestamp\": 1728763337000000000,\n    \"time_taken_s\": 500,\n    \"event\": \"COMPLETE\"\n}\n```\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate time_started from subtractTime(timestamp, time_taken_s.toInterval('s'))\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate time_started from timestamp.subtractTime(time_taken_s.toInterval('s'))\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"timestamp\": 1728763337000000000,\n    \"time_taken_s\": 500,\n    \"event\": \"COMPLETE\",\n    \"time_started\": 1728762837000000000\n}\n```\n\n\n"
  timeRound:
    description: "Returns a timestamp rounded down to a specified interval. This function is deprecated in favor of `roundTime`.\n"
    syntax: "timeRound(date: timestamp, interval: interval): timestamp\n"
    category: [Functions reference, Time, timeRound]
    content: "\n\n# `timeRound`\n\n## Description\n\n\nReturns a timestamp rounded down to a specified interval. This function is deprecated in favor of `roundTime`.\n\n\n## Syntax\n\nLike many functions in DataPrime, `timeRound` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ntimeRound(date: timestamp, interval: interval): timestamp\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(date: timestamp).timeRound(interval: interval): timestamp\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | date | timestamp | **true** | The timestamp to round |    | interval | interval | **true** | The interval that defines the rounding precision |\n\n"
  toInterval:
    description: "Returns an interval created from a numeric value and an optional time unit.\n\nThis function works with integers, decimals, positive, and negative values.\n"
    syntax: "toInterval(number: number, timeUnit?: timeunit): interval\n"
    category: [Functions reference, Time, toInterval]
    content: "\n\n# `toInterval`\n\n## Description\n\n\nReturns an interval created from a numeric value and an optional time unit.\n\nThis function works with integers, decimals, positive, and negative values.\n\n\n## Syntax\n\nLike many functions in DataPrime, `toInterval` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ntoInterval(number: number, timeUnit?: timeunit): interval\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(number: number).toInterval(timeUnit?: timeunit): interval\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | number | number | **true** | The number to convert into an interval |    | timeUnit | timeunit | **false** | The time unit of the value. Defaults to `nano` |\n\n## Example\n\n\n**Use case: Add numeric duration to a timestamp to compute an end time**\n\nA log contains a `start_time` and a numeric duration in seconds. Convert the duration into an interval and add it to the timestamp.\n\n```json\n{\n  \"start_time\": 1728763337,\n  \"duration_seconds\": 50\n}\n```\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate end_time from addTime(start_time, duration_seconds.toInterval('s'))\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate end_time from start_time.addTime(duration_seconds.toInterval('s'))\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"start_time\": 1728763337,\n  \"duration_seconds\": 50,\n  \"end_time\": 1728763387\n}\n```\n\n\n"
  toIso8601DateTime:
    description: "Returns a timestamp formatted as an ISO 8601 string (e.g. `2023-08-11T07:29:17.634Z`).\nThis function supports nanosecond precision.\n"
    syntax: "toIso8601DateTime(timestamp: timestamp): string\n"
    category: [Functions reference, Time, toIso8601DateTime]
    content: "\n\n# `toIso8601DateTime`\n\n## Description\n\n\nReturns a timestamp formatted as an ISO 8601 string (e.g. `2023-08-11T07:29:17.634Z`).\nThis function supports nanosecond precision.\n\n\n## Syntax\n\nLike many functions in DataPrime, `toIso8601DateTime` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ntoIso8601DateTime(timestamp: timestamp): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(timestamp: timestamp).toIso8601DateTime(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | timestamp | timestamp | **true** | The timestamp to format in ISO 8601 |\n\n## Example\n\n\n**Use case: Convert a timestamp into ISO 8601 format**\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate formatted_ts from toIso8601DateTime($m.timestamp)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate formatted_ts from $m.timestamp.toIso8601DateTime()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"formatted_ts\": \"2023-08-11T07:29:17.634Z\"\n}\n```\n\n\n"
  toUnixTime:
    description: "Returns the number of time units since the Unix epoch (`1970-01-01T00:00:00Z`) for a given timestamp.\n\n!!! note\n    Timestamps before the epoch are represented as negative numbers.\n"
    syntax: "toUnixTime(timestamp: timestamp, timeUnit?: timeunit): number\n"
    category: [Functions reference, Time, toUnixTime]
    content: "\n\n# `toUnixTime`\n\n## Description\n\n\nReturns the number of time units since the Unix epoch (`1970-01-01T00:00:00Z`) for a given timestamp.\n\n!!! note\n    Timestamps before the epoch are represented as negative numbers.\n\n\n## Syntax\n\nLike many functions in DataPrime, `toUnixTime` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\ntoUnixTime(timestamp: timestamp, timeUnit?: timeunit): number\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(timestamp: timestamp).toUnixTime(timeUnit?: timeunit): number\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | timestamp | timestamp | **true** | The timestamp to convert |    | timeUnit | timeunit | **false** | The unit for the result. Defaults to `milli` |\n\n## Example\n\n\n**Use case: Convert a nanosecond timestamp into seconds for system compatibility**\n\n A log contains a timestamp in nanoseconds. Convert it to seconds to match external system requirements.\n\n\n### Example data\n```json\n{\n    \"ts\": 1728769618374000000\n}\n\n```\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate ts_seconds from toUnixTime(ts, 's')\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate ts_seconds from ts.toUnixTime('s')\n\n```\n///\n\n\n### Example output\n\n```json\n{\n    \"ts\": 1728769618374000000,\n    \"ts_seconds\": 1728769618\n}\n```\n\n\n"
  urlDecode:
    description: "Returns the decoded version of a URL-encoded string.\n\nURL encoding replaces certain characters with escape sequences (for example, spaces become `%20`) so they can be safely transmitted in URLs. Use `urlDecode` to restore the original values after parsing.\n"
    syntax: "urlDecode(string: string): string\n"
    category: [Functions reference, URL, urlDecode]
    content: "\n\n# `urlDecode`\n\n## Description\n\n\nReturns the decoded version of a URL-encoded string.\n\nURL encoding replaces certain characters with escape sequences (for example, spaces become `%20`) so they can be safely transmitted in URLs. Use `urlDecode` to restore the original values after parsing.\n\n\n## Syntax\n\nLike many functions in DataPrime, `urlDecode` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nurlDecode(string: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(string: string).urlDecode(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | string | string | **true** | The URL-encoded string to decode |\n\n## Example\n\n\n**Use case: Decode query string parameters**\n\nSuppose you want to parse query string parameters and decode any encoded values. Consider this document:\n\n```json\n{\n  \"domain\": \"https://www.coralogix.com\",\n  \"path\": \"/home\",\n  \"query_string\": \"name=Tom%20Kosman&b=c&c=d\"\n}\n```\n\nFirst, extract the parameters into an object using `kv`:\n\n```\nextract query_string into query_string_parameters using kv(pair_delimiter='&', key_delimiter='=')\n```\n\nThis produces:\n\n```json\n{\n  \"domain\": \"https://www.coralogix.com\",\n  \"path\": \"/home\",\n  \"query_string\": \"name=Tom%20Kosman&b=c&c=d\",\n  \"query_string_parameters\": {\n    \"name\": \"Tom%20Kosman\",\n    \"b\": \"c\",\n    \"c\": \"d\"\n  }\n}\n```\n\nNow decode the `name` field:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nreplace query_string_parameters.name with urlDecode(query_string_parameters.name)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nreplace query_string_parameters.name with query_string_parameters.name.urlDecode()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"domain\": \"https://www.coralogix.com\",\n  \"path\": \"/home\",\n  \"query_string\": \"name=Tom%20Kosman&b=c&c=d\",\n  \"query_string_parameters\": {\n    \"name\": \"Tom Kosman\",\n    \"b\": \"c\",\n    \"c\": \"d\"\n  }\n}\n```\n\n\n"
  urlEncode:
    description: "Returns the URL-encoded version of a string.\n\nURL encoding replaces special characters with escape sequences (for example, spaces become `%20`) so values can be safely transmitted in URLs. Use `urlEncode` when preparing data for output, such as with log forwarders.\n"
    syntax: "urlEncode(string: string): string\n"
    category: [Functions reference, URL, urlEncode]
    content: "\n\n# `urlEncode`\n\n## Description\n\n\nReturns the URL-encoded version of a string.\n\nURL encoding replaces special characters with escape sequences (for example, spaces become `%20`) so values can be safely transmitted in URLs. Use `urlEncode` when preparing data for output, such as with log forwarders.\n\n\n## Syntax\n\nLike many functions in DataPrime, `urlEncode` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nurlEncode(string: string): string\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(string: string).urlEncode(): string\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | string | string | **true** | The string to URL encode |\n\n## Example\n\n\n**Use case: Encode query string parameters**\n\nSuppose you want to parse query string parameters and encode any values that contain spaces. Consider this document:\n\n```json\n{\n  \"domain\": \"https://www.coralogix.com\",\n  \"path\": \"/home\",\n  \"query_string\": \"name=Tom Kosman&b=c&c=d\"\n}\n```\n\nFirst, extract the parameters into an object using `kv`:\n\n```\nextract query_string into query_string_parameters using kv(pair_delimiter='&', key_delimiter='=')\n```\n\nThis produces:\n\n```json\n{\n  \"domain\": \"https://www.coralogix.com\",\n  \"path\": \"/home\",\n  \"query_string\": \"name=Tom Kosman&b=c&c=d\",\n  \"query_string_parameters\": {\n    \"name\": \"Tom Kosman\",\n    \"b\": \"c\",\n    \"c\": \"d\"\n  }\n}\n```\n\nNow encode the `name` field:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\nreplace query_string_parameters.name with urlEncode(query_string_parameters.name)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\nreplace query_string_parameters.name with query_string_parameters.name.urlEncode()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"domain\": \"https://www.coralogix.com\",\n  \"path\": \"/home\",\n  \"query_string\": \"name=Tom Kosman&b=c&c=d\",\n  \"query_string_parameters\": {\n    \"name\": \"Tom%20Kosman\",\n    \"b\": \"c\",\n    \"c\": \"d\"\n  }\n}\n```\n\n\n"
  isUuid:
    description: "Returns `true` if a given string is a valid UUID, otherwise returns `false`.\n\nUse `isUuid` to clean data or flag malformed identifiers in logs and datasets.\n"
    syntax: "isUuid(uuid: string): bool\n"
    category: [Functions reference, UUID, isUuid]
    content: "\n\n# `isUuid`\n\n## Description\n\n\nReturns `true` if a given string is a valid UUID, otherwise returns `false`.\n\nUse `isUuid` to clean data or flag malformed identifiers in logs and datasets.\n\n\n## Syntax\n\nLike many functions in DataPrime, `isUuid` supports [two notations](../index.md), **function** and **method** notation. These interchangeable forms allow flexibility in how you structure expressions.\n\n\n/// tab | Function notation\n```dataprime\nisUuid(uuid: string): bool\n\n```\n///\n\n/// tab | Method notation\n```dataprime\n(uuid: string).isUuid(): bool\n\n```\n///\n\n\n\n## Arguments\n\n| Name | Type | Required | Description |\n|------|------|----------|-------------|    | uuid | string | **true** | The candidate UUID value |\n\n## Example\n\n\n**Use case: Flag invalid or corrupted UUIDs**\n\nSuppose you want to validate whether UUID fields are well-formed. Consider these documents:\n\n```json\n{\n  \"uuid\": \"0b954eed-de4a-4304-a398-16fbb09cd7e3\"\n},\n{\n  \"uuid\": \"0b954eed-de4a-4304-a398-1\"\n}\n```\n\nThe first value is a valid UUID, while the second is truncated and invalid. You can flag these issues with `isUuid`:\n\n\n\n\n### Example query\n\n\n/// tab | Function notation\n```dataprime\ncreate is_uuid from isUuid(uuid)\n\n```\n///\n\n/// tab | Method notation\n```dataprime\ncreate is_uuid from uuid.isUuid()\n\n```\n///\n\n\n### Example output\n\n```json\n{\n  \"uuid\": \"0b954eed-de4a-4304-a398-16fbb09cd7e3\",\n  \"is_uuid\": true\n},\n{\n  \"uuid\": \"0b954eed-de4a-4304-a398-1\",\n  \"is_uuid\": false\n}\n```\n\n\n"
  randomUuid:
    description: "Returns a randomly generated UUIDv4, useful for assigning identifiers to documents.\n"
    syntax: "randomUuid(): string\n"
    category: [Functions reference, UUID, randomUuid]
    content: "\n\n# `randomUuid`\n\n## Description\n\n\nReturns a randomly generated UUIDv4, useful for assigning identifiers to documents.\n\n\n## Syntax\n\n```dataprime\nrandomUuid(): string\n\n```\n\n\n## Example\n\n\n**Use case: Add unique identifiers to documents**\n\nSuppose you have log documents that do not include a `request_id`. You can generate one automatically. Consider this document:\n\n```json\n{\n\"path\": \"/home\",\n\"domain\": \"coralogix.com\",\n\"full_url_encoded\": \"aHR0cHM6Ly9jb3JhbG9naXguY29tL2hvbWU=\"\n}\n```\n\nYou can assign a new UUID with:\n\n\n\n\n### Example query\n\n```dataprime\ncreate request_id from randomUuid()\n\n```\n\n### Example output\n\n```json\n{\n\"path\": \"/home\",\n\"domain\": \"coralogix.com\",\n\"full_url_encoded\": \"aHR0cHM6Ly9jb3JhbG9naXguY29tL2hvbWU=\",\n\"request_id\": \"37367559-35f4-459c-943e-19025765da15\"\n}\n```\n\n\n"
  uuid:
    description: "\nReturns a randomly generated UUID, useful for assigning identifiers to documents.\n"
    syntax: "uuid(): string\n"
    category: [Functions reference, UUID, uuid]
    content: "\n\n# `uuid`\n\n## Description\n\n\n\nReturns a randomly generated UUID, useful for assigning identifiers to documents.\n\n\n## Syntax\n\n```dataprime\nuuid(): string\n\n```\n\n\n## Example\n\n\n**Use case: Add unique identifiers to documents**\n\nSuppose you have log documents that do not include a `request_id`. You can generate one automatically. Consider this document:\n\n```json\n{\n\"path\": \"/home\",\n\"domain\": \"coralogix.com\",\n\"full_url_encoded\": \"aHR0cHM6Ly9jb3JhbG9naXguY29tL2hvbWU=\"\n}\n```\n\nYou can assign a new UUID with:\n\n\n\n\n### Example query\n\n```dataprime\ncreate request_id from uuid()\n\n```\n\n### Example output\n\n```json\n{\n\"path\": \"/home\",\n\"domain\": \"coralogix.com\",\n\"full_url_encoded\": \"aHR0cHM6Ly9jb3JhbG9naXguY29tL2hvbWU=\",\n\"request_id\": \"37367559-35f4-459c-943e-19025765da15\"\n}\n```\n\n\n"
