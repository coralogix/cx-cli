commands:
  filter:
    description: Keeps rows where the predicate is true.
    syntax: "| filter <predicate>"
    category: [Commands reference, filter]
  lucene:
    description: "Full-text search using Lucene syntax."
    syntax: "| lucene <query>"
    category: [Commands reference, lucene]
  aggregate:
    description: Aggregates values per group.
    syntax: "| aggregate <aggregation>"
    category: [Commands reference, aggregate]
  groupby:
    description: Groups rows by field values.
    syntax: "| groupby <fields>"
    category: [Commands reference, groupby]
  sort:
    description: Sorts rows.
    syntax: "| sort <fields>"
    category: [Commands reference, sort]
  limit:
    description: Limits the number of rows.
    syntax: "| limit <n>"
    category: [Commands reference, limit]
  fields:
    description: Selects or renames fields.
    syntax: "| fields <list>"
    category: [Commands reference, fields]
  json:
    description: Extracts JSON paths.
    syntax: "| json <path>"
    category: [Commands reference, json]
  regex:
    description: Matches regular expressions.
    syntax: "| regex <pattern>"
    category: [Commands reference, regex]
  stats:
    description: Computes statistics.
    syntax: "| stats <expr>"
    category: [Commands reference, stats]
