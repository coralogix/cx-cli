[package]
name = "cli-otel"
version = "0.1.0"
edition = "2021"
description = "OpenTelemetry execution spans for short-lived CLI commands"
license = "Apache-2.0"
repository = "https://github.com/coralogix/cx-cli"

[features]
clap = ["dep:clap"]
command-failure-logs = ["opentelemetry-proto/logs", "dep:tokio"]
reqwest-middleware = ["dep:http-body", "dep:reqwest-middleware"]

[dependencies]
async-trait = "0.1"
bytes = "1"
clap = { version = "4.5", default-features = false, features = ["help", "std"], optional = true }
flate2 = "1"
http = "1"
http-body = { version = "1", optional = true }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "0.32", default-features = false }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "gzip-http"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
reqwest-middleware = { version = "0.5", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.6"
tokio = { version = "1", features = ["macros", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
