# Example global cx config.
# Save as ~/.cx/config.toml

# Profile name used when --profile is not provided.
default_profile = "default"

# Default output mode when --output is not provided.
# Valid values: "text", "json", "agents"
default_output_format = "text"

# Maximum serialized byte size of a non-aggregated Dataprime response that can
# be printed directly to stdout in "agents" output mode. If the payload exceeds
# this limit the results are written to a temp file instead, and a short summary
# (result count + file path) is printed to stdout. Default: 102400 (100 KiB).
# Set to -1 to disable the limit and always print results directly.
# max_dataprime_direct_output_size = 102400

# Directory where temp result files are stored when the payload exceeds
# max_dataprime_direct_output_size. Files are prefixed with "cx_results" so
# they can be identified and removed with `cx cleanup`. Default: "/tmp/".
# temp_dir = "/tmp/"

# Credentials live in separate profile files under ~/.cx/profiles/.
# Example: ~/.cx/profiles/default.toml
#
# api_key = "cxp_your_api_key_here"
# region = "eu1"
# label = "production"
#
# For BYOC / private environments, region accepts a full endpoint URL:
# region = "https://api.myenv.example.com"
#
# Optional: override the web console base URL used to build "View in
# Coralogix" links printed after dashboard/alert/case mutations. By default
# this is resolved automatically via GET /identity/whoami; only needed when
# that lookup isn't reachable (e.g. a custom, self-hosted environment).
# See docs/configuration.md#console-links.
# console_url = "https://<your-team>.<console-domain>"
