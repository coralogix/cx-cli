# ocb manifest: only the components config.yaml + local.yaml use, plus the
# Elastic rate limit processor (not in otelcol-contrib 0.165.0).
# One image serves the deployment and the local runs, so the `file` and `debug`
# exporters are in the deployed binary too. They do nothing there: config.yaml
# has no pipeline that uses them.
dist:
  name: cx-telemetry-otelcol
  description: cx CLI telemetry collector (contrib subset + ratelimit processor)
  output_path: /build/out
  version: 0.165.0
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.165.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.165.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.165.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/ratelimitprocessor v0.81.0
exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/coralogixexporter v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.165.0   # in the image; used only by local.yaml (telemetry-collector-check.sh)
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.165.0                               # in the image; used only by local.yaml and the service repo's local run
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.165.0
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.71.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.71.0
