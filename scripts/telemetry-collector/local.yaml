# Local check only (scripts/telemetry-collector-check.sh): merged over
# config.yaml, it swaps the Coralogix exporter for debug output and a file the
# script reads, and shortens the batch timeout so the check runs fast.
processors:
  batch:
    timeout: 200ms
exporters:
  debug:
    verbosity: detailed
  file:
    path: /out/events.jsonl
    flush_interval: 200ms
service:
  pipelines:
    logs:
      exporters: [debug, file]
